name: Integración continua

# Verifica cada Pull Request y cada integración en develop y main.
# La integración exige el pipeline en verde (Art. XI, verificación).
#
# El flujo de documentación va aparte, en docs.yml.

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "**.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verificar:
    name: Compilar, formatear y probar
    runs-on: ubuntu-latest

    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # `verify` encadena todo lo que exige la constitución:
      #   - compilación
      #   - Spotless: formato aplicado (Art. VI.6)
      #   - pruebas unitarias (*Test)
      #   - pruebas de integración con Testcontainers (*IT)
      #   - ArchUnit: reglas de dependencia entre capas (§5.2)
      #   - JaCoCo: cobertura como indicador (Art. VII.7)
      #
      # Testcontainers levanta PostgreSQL por su cuenta: el ejecutor de
      # GitHub trae Docker, de modo que no hace falta un servicio aparte.
      - name: Verificar
        run: mvn -B verify

      # `OpenApiContractIT` reescribe docs/api/openapi.json y openapi.yaml
      # durante `verify`. Los dos: el JSON se lee, y el YAML es lo que piden por
      # defecto los generadores de cliente del frontend.
      # Si lo que acaba de generarse no coincide con lo comprometido, es que
      # alguien cambió un endpoint y no regeneró el contrato: el Art. VIII.6
      # trata esa divergencia como defecto, y aquí es donde se convierte en
      # pipeline en rojo.
      #
      # `git add -N` marca el archivo como pendiente de añadir para que
      # `git diff` lo vea también la primera vez, cuando todavía no está
      # versionado. Sin eso, la primera ejecución pasaría en verde sin haber
      # comprobado nada.
      - name: El contrato publicado está al día
        run: |
          git add -N docs/api/openapi.json docs/api/openapi.yaml
          git diff --exit-code -- docs/api/openapi.json docs/api/openapi.yaml \
            || { echo "::error::El contrato ha cambiado. Ejecuta 'mvn verify' y commitea docs/api/."; exit 1; }

      - name: Publicar el informe de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco
          path: target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 7

  # ADR-007: la imagen se construye UNA vez, aquí y no en el servidor, y solo
  # después de que `verificar` quede en verde. Dokploy recibe la orden de
  # desplegarla; no compila nada.
  #
  # Apagado mientras no exista la variable de repositorio DOKPLOY_DEPLOY=true:
  # sin ella el job se salta, y un repositorio sin Dokploy configurado no deja
  # el pipeline en rojo. Cada entorno de GitHub —`testing` para `develop`,
  # `production` para `main`— lleva sus propios secretos:
  #
  #   DOKPLOY_URL             https://panel.del-servidor, sin barra final
  #   DOKPLOY_API_KEY         Settings → Profile → API/CLI en Dokploy
  #   DOKPLOY_APPLICATION_ID  el del servicio `backend` de ESE entorno
  #
  # Ver docs/deployment.md §10.
  publicar-y-desplegar:
    name: Publicar la imagen y desplegar
    needs: verificar
    if: >-
      github.event_name == 'push'
      && vars.DOKPLOY_DEPLOY == 'true'
      && (github.ref_name == 'develop' || github.ref_name == 'main')
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'testing' }}

    permissions:
      contents: read
      packages: write

    # Dos despliegues de la misma rama no se pisan: el segundo espera.
    concurrency:
      group: desplegar-${{ github.ref_name }}
      cancel-in-progress: false

    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Preparar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Entrar en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Dos etiquetas: la de la rama es la que Dokploy despliega; la del commit
      # es la que permite volver atrás a un despliegue concreto (§12).
      # GHCR exige el nombre en minúsculas.
      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/nexuspro-dev/backend:${{ github.ref_name }}
            ghcr.io/nexuspro-dev/backend:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Desplegar en Dokploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
        run: |
          curl --fail-with-body -sS -X POST "$DOKPLOY_URL/api/application.deploy" \
            -H 'Content-Type: application/json' \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -d "{\"applicationId\":\"$DOKPLOY_APPLICATION_ID\",\"title\":\"${GITHUB_SHA::7}\"}"
