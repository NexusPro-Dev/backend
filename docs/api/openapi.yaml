            no la declaraba.
        quantity:
          type: integer
          format: int32
        unitPrice:
          type: number
        lineAmount:
          type: number
          description: quantity × unitPrice − lineDiscount.
        validityDays:
          type:
          - integer
          - "null"
          format: int32
          description: "Vigencia copiada, en días. NULA si lo adquirido no caduca."
        lineDiscount:
          type: number
          description: "Lo que se rebajó a la línea: quantity × la suma de sus rebajas."
        discounts:
          type: array
