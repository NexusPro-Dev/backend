  /api/v1/hotlinks/{username}/{code}:
    get:
      tags:
      - Hotlinks
      summary: Consultar un hotlink
      description: |
        **Permiso requerido:** ninguno. Ruta pública: responde sin token.

        Devuelve, **sin token**, el producto que el enlace señala y el **nombre
        y apellido** de quien lo reparte.

        **Es público por decisión, no por definición.** Las otras cinco rutas
        públicas del sistema lo son porque quien las llama no puede portar
        todavía un token; esta lo es porque un enlace se abre antes de
        registrarse.

        **Solo publica productos activos y de alcance `HOTLINK` o `AMBOS`**
        (`HOTLINKS` hasta el 15-09-2026), y solo el
        nombre de quien porta un rol de tipo `VENDEDOR`. Ni correo, ni
        identificador, ni estado, ni roles.

        **De la membresía se publican tres campos** —código, nombre y color—,
        y no los cinco que devuelven los otros endpoints: el identificador no
        sirve a quien no puede llamar a nada más, y el nivel publicaría la
        forma de la cadena comercial sin token.

        **El precio llega en la moneda del producto y, si hay tasa vigente,
        convertido a la moneda por omisión.** `rate` viaja como **cadena**
        porque tiene ocho decimales y un número JSON pasa por coma flotante en
        cualquier cliente JavaScript.

        **Viene UN importe** (`RN-PM-024`, reescrita el 12-09-2026): `price`,
        el que se cobra. **El precio de compra no viaja por aquí ni se
        consulta**: es lo que NEXUS paga por el producto, y este endpoint es
        público. Entre el 08-09-2026 y el 12-09-2026 viajó también
        `publicPrice`, cuando ese importe era lo que se anunciaba; ese campo
        **ya no existe**. **La conversión se calcula sobre `price`.**

        **Vienen los `links` del producto, y sin token** (`RN-PM-048`): aquí
        viaja **solo el video** y **resuelto** —con el identificador externo ya
        pegado al final (`RN-PM-049`)—, porque es material de venta y existe
        para que lo vea quien va a comprar. El `CUPON_BOT` **no sale**: es la
        prestación que se compra, y esta ruta la puede abrir cualquiera
        (`RN-PM-050`). La lista va **presente y vacía** cuando el producto no
        declara ninguno.

        **La conversión es INFORMATIVA**: lo que se cobra no es ese número. Una
        venta va en una sola moneda y congela su importe al registrarse; esta
        conversión se calcula al vuelo, cambia el día que cambie la tasa y **no
        reserva nada**. Cuando no hay tasa vigente —o el producto ya está en la
        moneda de casa— `exchange` llega **presente y nulo**, y el producto se
        devuelve igual.

        **Todo lo que no procede responde el MISMO `404`**: usuario
        inexistente, persona que no es vendedora, código inexistente, producto
        inactivo, retirado o de alcance `TIENDA` o `NINGUNO`. **No dice cuál falló**, y esa
        uniformidad es deliberada — distinguirlos convertiría el enlace en un
        oráculo que dice quién existe.
      operationId: hotlink
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
      - name: code
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "El enlace, con su producto y su vendedor."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/HotlinkResponse"
        "404":
          description: El enlace no lleva a ninguna parte. **El mismo cuerpo en los
            seis casos** (`EX-001`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/HotlinkResponse"
        "429":
          description: Demasiadas peticiones desde ese origen
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/HotlinkResponse"
      security: []
  /api/v1/hotlinks/{username}/packages/{code}:
    get:
      tags:
      - Hotlinks
      summary: Consultar el hotlink de un paquete
      description: |
        **Permiso requerido:** ninguno. Ruta pública: responde sin token.

        Devuelve, **sin token**, el paquete que el enlace señala —con sus productos,
        el descuento de cada uno y **la cuenta hecha**— y el nombre y apellido de
        quien lo reparte.

        **Cada producto va en la misma forma que el hotlink del producto**, tal
        cual: código, nombre, descripción, icono, video, portada, membresía en tres
        campos, precio, conversión y `rating`. A su lado, `discount` y
        `priceInPackage` — lo que vale ese producto **dentro** del paquete, con el
        precio de catálogo de hoy. `listPrice` es la suma sin descuentos, `price` lo
        que vale el paquete y `savings` la diferencia; `exchange` convierte `price`
        a la moneda de casa si hay tasa. **`priceInPackage` es la cuenta de hoy y
        no una reserva**: si un producto cambia de precio, el paquete cambia solo,
        y un fijo que hoy supera su precio cuenta cero.

        **Solo publica paquetes activos y de alcance `HOTLINK` o `AMBOS`**, y **el
        alcance de los productos no filtra dentro del paquete**: el canal lo decide
        el paquete. Sin `purchasePrice` ni `status` en ningún nivel.

        **Todo lo que no procede responde el MISMO `404`, y el mismo que el hotlink
        del producto**: usuario inexistente, persona que no es vendedora, código
        inexistente, paquete inactivo, retirado o de alcance `TIENDA` o `NINGUNO`,
        y **también el paquete que hoy no se puede ofrecer** —un producto suyo
        inactivo o retirado, menos de dos productos, sin descripción, o **fuera de
        su vigencia** (`RN-PM-047`): todavía no empieza o ya terminó—. Dentro de
        ella, `validFrom` y `validTo` viajan para que quien abre el enlace sepa
        hasta cuándo vale. **No dice cuál
        falló**: distinguirlos publicaría, sin token, que el paquete existe y qué le
        pasa. Quien tiene que saberlo es administración, y lo sabe por el detalle.
      operationId: hotlinkDePaquete
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
      - name: code
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "El enlace, con su paquete y su vendedor."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PackageHotlinkResponse"
        "404":
          description: "El enlace no lleva a ninguna parte. **El mismo cuerpo en todos\
            \ los casos**, y el mismo que el hotlink del producto (`EX-001`)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PackageHotlinkResponse"
        "429":
          description: Demasiadas peticiones desde ese origen
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PackageHotlinkResponse"
      security: []
  /api/v1/document-types:
    get:
      tags:
      - Tipos de documento
      summary: Consultar el catálogo de tipos de documento
      description: |
        **Permiso requerido:** ninguno. Ruta pública: responde sin token.

        Devuelve los documentos de identidad con los que una persona puede
        registrarse, con su **nombre** y su **abreviación**.

        **El catálogo contiene solo documentos de persona mayor de edad**, y esa
        es la validación entera: no hay ninguna marca que distinga cuáles sí y
        cuáles no, porque los que no están **no están**. Registrar a un menor no
        se rechaza — no se puede expresar.

        **No se administra por API** (`RN-SP-036`): no hay alta, ni edición, ni
        eliminación, ni cambio de estado. Se puebla por migración, y lo que deja
        de admitirse se retira también por migración. Es la asimetría deliberada
        con los catálogos de países y monedas, que sí tienen operación para
        cambiar su estado.

        **No se pagina**: son unos pocos elementos, y partirlos obligaría a dos
        llamadas para pintar un desplegable.
      operationId: listar_9
      parameters:
      - name: includeInactive
        in: query
        required: false
        schema:
          type: boolean
      responses:
        "200":
          description: "Catálogo completo, ordenado por nombre"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DocumentTypeCatalogResponse"
        "500":
          description: Fallo no controlado (`ERR-500`)
      security: []
  /api/v1/currencies:
    get:
      tags:
      - Monedas
      summary: Consultar el catálogo de monedas
      description: |
        **Permiso requerido:** `currencies:read`. Sin él, `403` (`AUTH-002`).

        Devuelve el catálogo completo, sin paginar, ordenado por código.

        `decimalPlaces` es el campo del que depende el redondeo de todo cálculo
        financiero: cero es un valor legítimo y el campo nunca es nulo.

        Las monedas inactivas no aparecen salvo que se pidan con
        `includeInactive=true`, que **añade** a las activas en lugar de
        sustituirlas.
      operationId: consultar_3
      parameters:
      - name: peticion
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/ListCurrenciesRequest"
      responses:
        "200":
          description: "Catálogo devuelto. Siempre es una colección, aunque tenga\
            \ un solo elemento."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CurrencyCatalogResponse"
        "400":
          description: El parámetro de inclusión no es booleano
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: Autenticado sin el permiso de lectura de monedas (`AUTH-002`)
        "500":
          description: Fallo no controlado (`ERR-500`)
      x-required-permission: currencies:read
  /api/v1/commissions/effective:
    get:
      tags:
      - Comisiones
      summary: Consultar la comisión efectiva
      description: |
        **Permiso requerido:** `commissions:read-effective`. Sin él, `403` (`AUTH-002`).

        Responde **cuánto le corresponde a una persona por vender un producto un
        día concreto**, y **por qué**: devuelve la tasa que ganó y de cuál de las
        dos piezas salió.

        **La precedencia son dos niveles, y los dos exigen ASOCIACIÓN:** si la
        persona tiene una tasa **personalizada** vigente ese día **asociada a ese
        producto**, es esa. Si no, la que su **rol vendedor** tenga **asociada a
        ese producto**. Si ninguna, no hay tarifa.

        **Hasta el 11-09-2026 el primer nivel no miraba el producto**: una
        excepción tapaba el catálogo entero de su titular y el segundo nivel no
        llegaba a consultarse nunca. Desde esa fecha las dos clases de tasa se
        asocian igual, y `RN-CM-012` —ninguna tasa rige hasta que se asocia—
        deja de tener excepción.

        **Tres desenlaces, y ninguno es un error:**

        - `RESUELTA`: hay tasa. `source` dice si fue `PERSONALIZADA` o `ROL`. El
          porcentaje puede ser **cero**, y eso significa «no comisiona» — es una
          decisión declarada.
        - `SIN_TARIFA`: la persona vende y **no hay tasa aplicable**. La causa más
          probable **no es que nadie la declarara**, sino que **nadie la asoció** a
          ese producto: la tasa puede existir en el catálogo y no regir. El
          porcentaje llega **nulo y presente**, nunca cero.
        - `NO_COMISIONA`: la persona **no porta rol vendedor** y **tampoco tiene
          tasa personalizada**.

        **`roleId` puede llegar nulo con `outcome` igual a `RESUELTA`**, y no es
        incoherente: significa que ganó la tasa personalizada de alguien que ya no
        porta rol vendedor. Las personalizadas dejaron de llevar rol el
        01-09-2026, y **siguen rigiendo aunque su titular deje de vender**.

        **Nulo y cero no son lo mismo**, y quien consuma esto va a pagar con esa
        cifra.

        Sin `onDate`, se resuelve con la fecha de hoy. Un producto **retirado** se
        resuelve con normalidad: preguntar qué se pagaba por algo que ya no se
        vende es legítimo.
      operationId: efectiva
      parameters:
      - name: userId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: productId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: onDate
        in: query
        required: false
        schema:
          type: string
          format: date
      responses:
        "200":
          description: Cualquiera de los tres desenlaces
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EffectiveCommissionResponse"
        "400":
          description: Parámetros inválidos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EffectiveCommissionResponse"
        "403":
          description: Sin permiso
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EffectiveCommissionResponse"
        "422":
          description: La persona o el producto no existen
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EffectiveCommissionResponse"
      x-required-permission: commissions:read-effective
  /api/v1/brokers:
    get:
      tags:
      - Brokers
      summary: Consultar el catálogo de brokers
      description: |
        **Permiso requerido:** ninguno. Ruta pública: responde sin token.

        Devuelve los brokers con los que opera la plataforma, **ordenados por
        nombre**.

        **Un broker guarda de momento solo su nombre**, y eso tiene una
        consecuencia que conviene conocer antes de integrarse: **el nombre es la
        clave de negocio**, no un texto descriptivo. No hay un `code` estable
        frente a un cambio de nombre comercial — quien necesite referenciar un
        broker debe hacerlo por su **identificador**.

        **No se administra por API** (`RN-SP-039`): no hay alta, ni edición, ni
        eliminación, ni cambio de estado. Se puebla por migración, igual que los
        catálogos de monedas y de tipos de documento, y cada alta queda en el
        historial del repositorio en lugar de en una fila que alguien insertó.

        **Puede responder la colección vacía**, y eso no es un fallo: es el
        estado de un catálogo que todavía no se ha sembrado.

        **No se pagina**: son unos pocos elementos y partirlos obligaría a dos
        llamadas para pintar un desplegable.
      operationId: listar_10
      parameters:
      - name: includeInactive
        in: query
        required: false
        schema:
          type: boolean
      responses:
        "200":
          description: "Catálogo, ordenado por nombre"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BrokerCatalogResponse"
        "500":
          description: Fallo no controlado (`ERR-500`)
      security: []
  /api/v1/broker-accounts:
    get:
      tags:
      - Cuentas de broker
      summary: Consultar y filtrar todas las cuentas de broker
      description: |
        **Permiso requerido:** `broker-accounts:read`. Sin él, `403` (`AUTH-002`).

        Devuelve **todas** las cuentas de broker del sistema, paginadas y con
        su titular en cada fila. **Sin ningún filtro devuelve el sistema
        entero**: es lo que `broker-accounts:read` significa.

        **`supervisorId` devuelve LA RED ENTERA de esa persona, en
        profundidad** (`RN-SP-047`): sus subordinados, los subordinados de
        estos, y así hasta abajo. **No es un solo nivel**, al revés que
        `GET /api/v1/users/{id}/team` y que
        `GET /api/v1/users/me/team/broker-accounts` — aquellos se autorizan
        por la estructura y por eso se acotan; este se autoriza por permiso,
        que ya alcanza a todos, de modo que la profundidad **ahorra recorrer
        el árbol y no concede nada**.

        **La raíz NO se incluye en su red.** Preguntar por la red de alguien
        devuelve la de los suyos; sus propias cuentas se piden con `userId`, y
        **los dos filtros se combinan** — juntos responden «de la red de este
        vendedor, las cuentas de esta persona».

        **Solo la estructura vigente.** Quien dejó la red ayer no aparece, ni
        los que colgaban de él por esa vía. Y una persona **eliminada** no
        aparece **sin que su rama se corte**: quienes dependían de ella siguen
        saliendo.

        **Filtros, todos opcionales y combinables con Y:**

        - `supervisorId` — la red, en profundidad.
        - `userId` — una persona concreta.
        - `status` — `REGISTER` o `FIRST_DEPOSIT`. **Cualquier otro valor es
          `400`**, no una página vacía.
        - `brokerId` — un broker del catálogo.
        - `search` — fragmento de **número de cuenta**, nombre de usuario,
          correo o nombre completo. Sin acentos y sin distinguir mayúsculas.
        - `from` / `to` — **cuándo se declaró la cuenta**. Son **instantes con
          zona**, no fechas sueltas, y el rango es **semiabierto**: incluye
          `from`, excluye `to`. `from` posterior a `to` es `400`.

        **Un identificador inexistente devuelve la página vacía sin error** —
        `supervisorId`, `userId` y `brokerId` no se validan contra su tabla—,
        al revés que `status` y que el rango: aquellos son preguntas legítimas
        con respuesta vacía y estos son preguntas mal escritas.

        `totalElements` **cuenta lo filtrado**.

        **La respuesta lleva además un `summary` con TRES totales y sus
        desgloses por broker**, los tres con la misma forma —un `total` y un
        `byBroker`—:

        - `summary.accounts` — cuántos registros cumplen el filtro. Su
          `total` es **el mismo número que `totalElements`**, y sale de la
          misma consulta: no pueden discrepar.
        - `summary.register` — cuántos de esos están en `REGISTER`.
        - `summary.firstDeposit` — cuántos de esos están en `FIRST_DEPOSIT`.

        **`accounts` es siempre `register` + `firstDeposit`**, total a total y
        broker a broker. La redundancia es deliberada: van los dos estados
        para no obligar a restar, y va el total porque es la pregunta que más
        se hace.

        **El resumen respeta TODOS los filtros, incluido `status`**, y de ahí
        sale lo único que hay que saber antes de pintarlo: **con
        `?status=REGISTER`, `summary.firstDeposit.total` vale SIEMPRE cero**,
        y con `?status=FIRST_DEPOSIT` vale siempre el total. **Ese cero no
        significa «nadie ha depositado»: significa «no pediste ninguno».** Un
        tablero que lo enseñe sin decirlo miente; para ver el embudo completo,
        consulte **sin** el filtro `status`.

        **`byBroker` trae TODOS los brokers del catálogo**, ordenado por
        nombre y **con cero donde el filtro no deja ninguna**: su longitud
        **no cambia** al filtrar, de modo que las columnas de una tabla se
        arman una vez y no bailan. Un broker **desactivado sigue apareciendo**
        — apagarlo no borra lo que ya se declaró en él. Los tres desgloses
        **suman exactamente** su `total`.

        **Con la página vacía el resumen va en ceros**, no ausente: el
        `byBroker` sigue trayendo el catálogo entero, todo a cero.

        **La fila es idéntica campo por campo a la de
        `GET /api/v1/users/me/team/broker-accounts`**, a propósito: las dos
        pantallas se pintan con el mismo componente. **Lo que aquella no
        lleva es el `summary`**: el resumen se pidió para el listado de
        administración.

        **Hoy todas las cuentas están en `REGISTER`**: quien mueve una a
        `FIRST_DEPOSIT` es el webhook del broker, que todavía no existe.

        **Esta ruta no sustituye a `GET /api/v1/users/{id}/broker-accounts`**,
        que existe para **el superior comercial sin permiso**.
