  /api/v1/exchange-rates:
    post:
      tags:
      - Tasas de cambio
      summary: Registrar una tasa de cambio
      description: |
        Declara **a cuánto se cambia una moneda por otra y desde cuándo**.

        `price` es **cuántas unidades de la moneda de destino da UNA de la de
        origen**: `USD → COP` a `4150` significa que un dólar da cuatro mil
        ciento cincuenta pesos. **La dirección contraria no se deduce** — la
        inversa aritmética casi nunca es la tasa real, y calcularla produciría
        un número plausible y falso. Quien necesite las dos declara **dos
        tasas**.

        **Ocho decimales**, y no los de ninguna moneda: una tasa **no es un
        importe**, es un cociente entre dos monedas. Con cuatro, `COP → USD`
        se guardaría redondeada y una moneda más devaluada, como cero.

        **`validFrom` es obligatoria y `validTo` no**: sin ella la tasa es
        **vitalicia**. Ausente y `null` significan lo mismo. Una vigencia que
        empieza y termina el mismo día es legítima, y una que **empieza en el
        futuro** también — es lo que hace innecesario un estado «programada».

        **`isActive` es opcional y por omisión verdadero.**

        **Dos tasas activas del mismo par no pueden solaparse** (`RN-SP-032`),
        y los **dos extremos de la vigencia cuentan**: una que termina el 30 de
        junio choca con otra que empieza el 30 de junio. El choque devuelve
        `409` y **no registra nada**: el sistema **no** cierra ni recorta la
        tasa anterior, porque resolver el conflicto es una decisión de quien
        administra, no del servidor.
      operationId: registrar_5
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterExchangeRateRequest"
        required: true
      responses:
        "201":
          description: Tasa registrada.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExchangeRateResponse"
        "400":
          description: Datos inválidos (serie `VAL-nnn`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExchangeRateResponse"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExchangeRateResponse"
        "403":
          description: Autenticado sin el permiso `exchange-rates:create` (`AUTH-002`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExchangeRateResponse"
        "409":
          description: Se solapa con una tasa vigente del mismo par (`EX-002`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExchangeRateResponse"
        "422":
          description: Moneda inexistente o desactivada (`EX-001`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExchangeRateResponse"
  /api/v1/countries:
    get:
      tags:
      - Países
      summary: Consultar el catálogo de países
      description: |
        Devuelve el catálogo completo, sin paginar, **ordenado alfabéticamente
        por nombre** según la intercalación del español — no por orden de bytes.

        La búsqueda actúa sobre código y nombre, ignorando mayúsculas y acentos.
        Sin coincidencias devuelve una colección vacía, no un error.

        Los países inactivos no aparecen salvo que se pidan, y entonces se
        **añaden** a los activos. La búsqueda y el estado son independientes.
      operationId: consultar_1
      parameters:
      - name: peticion
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/ListCountriesRequest"
      responses:
        "200":
          description: Catálogo devuelto. Puede venir vacío.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CountryCatalogResponse"
        "400":
          description: El parámetro de inclusión no es booleano
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: Autenticado sin el permiso de lectura de países (`AUTH-002`)
        "500":
          description: Fallo no controlado (`ERR-500`)
    post:
      tags:
      - Países
      summary: Registrar un país
      description: |
        Registra un país en el catálogo. Queda **activo** siempre: el estado no
        se envía y enviarlo devuelve `400`.

        El código se normaliza a mayúsculas y se recorta, porque lo fija
        ISO 3166-1 alfa-3 y no lo inventa nadie: `col`, ` COL` y `COL` son el
        mismo país. Son tres letras y no dos.

        El nombre admite acentos y caracteres no latinos sin transformación
        alguna, pero **no puede coincidir** con otro ya registrado ignorando
        mayúsculas y acentos: el catálogo no se edita, y el duplicado sería
        permanente.
      operationId: registrar_6
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterCountryRequest"
        required: true
      responses:
        "201":
          description: "País registrado, con su código ya normalizado."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CountryResponse"
        "400":
          description: "Código o nombre inválidos, o campo no admitido en el cuerpo"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: Autenticado sin el permiso de creación de países (`AUTH-002`)
        "409":
          description: Código o nombre ya presentes en el catálogo (`EX-001`)
        "500":
          description: Fallo no controlado (`ERR-500`)
  /api/v1/commission-rates:
    get:
      tags:
      - Comisiones
      summary: Consultar las tasas de comisión por rol
      description: |
        Devuelve **todas las tasas de rol que se han configurado**, cada una
        **con su producto** (`id`, `code`, `name`, su **`price`** y su
        **`currency`**: `id`, `code`, `decimalPlaces`) y su rol, paginadas. Es
        lo que el responsable del proyecto pidió leer: qué paga cada producto,
        en una sola lista —y sobre qué precio y en qué moneda, porque un
        porcentaje es una parte del precio y un importe fijo es dinero en la
        moneda del producto—.
        Se filtra por `productId`, `roleId` y `rateType`, y con
        `includeDeleted` entran las retiradas.

        **Toda tasa viva rige** sobre su producto (`RN-CM-021`): ya no hay un
        contador de asociaciones que mirar.

        Las tasas **personalizadas** no salen en este listado: están en
        `GET /api/v1/user-commission-rates`. **No hay filtro por fecha**, porque
        las tasas de rol no tienen vigencia.
      operationId: listar_5
      parameters:
      - name: filtros
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/ListCommissionRatesRequest"
      responses:
        "200":
          description: Página de tasas
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommissionRatePageResponse"
        "400":
          description: Parámetros inválidos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommissionRatePageResponse"
        "403":
          description: Sin permiso
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommissionRatePageResponse"
    post:
      tags:
      - Comisiones
      summary: Registrar la tasa de comisión de un rol sobre un producto
      description: |
        Declara cuánto gana un rol de tipo **vendedor** por vender **este
        producto**. **`productId` es obligatorio** (`RN-CM-021`, 15-09-2026): la
        tasa nace con su producto, **rige sobre él desde este instante** y no
        cambia de producto — cambiar es retirarla y registrar otra.

        **Registrar es poner en vigor.** No hay paso de asociación ni borrador:
        una tasa registrada «para probar» sobre un producto activo es una
        comisión real. Hasta el 15-09-2026 la tasa se registraba sin producto y
        no pagaba nada hasta asociarse; las tasas de aquel catálogo se
        borraron (`V94`) y hay que registrarlas de nuevo, producto a producto.

        **Un solo rol por producto** entre las vivas (`RN-CM-013`): la segunda
        responde `409`. Y todo lo que antes se comprobaba al asociar se
        comprueba aquí: producto **vivo y no retirado**, el **tope** —la suma de
        lo que el producto paga a sus roles no pasa de cien, `RN-CM-019`—, la
        regla del **gratuito** —solo importe fijo, `RN-CM-020`— y, para un
        importe fijo, **los decimales de la moneda del producto**
        (`RN-CM-017`).

        **El porcentaje cero es válido** y significa «esto no comisiona», que **no
        es lo mismo** que no declarar la tasa.
      operationId: registrar_7
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterCommissionRateRequest"
        required: true
      responses:
        "201":
          description: "Tasa registrada, y rigiendo desde ya"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommissionRateResponse"
        "400":
          description: "Datos inválidos, el rol no es vendedor, o el importe fijo\
            \ no cabe en los decimales de la moneda del producto (`VAL-014`)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommissionRateResponse"
        "403":
          description: Sin permiso
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommissionRateResponse"
        "409":
          description: "Ya hay una tasa viva de ese rol sobre ese producto (`EX-007`),\
            \ el producto pagaría más de cien (`EX-005`), o es gratuito y la tasa\
            \ es de porcentaje (`EX-006`)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommissionRateResponse"
        "422":
          description: "El rol no existe (`EX-002`), o el producto no existe o está\
            \ retirado"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommissionRateResponse"
  /api/v1/commission-rates/{id}/deletion:
    post:
      tags:
      - Comisiones
      summary: Retirar una tasa de comisión de rol
      description: |
        Retira una tasa con **motivo obligatorio** (`RN-CM-005`), y desde ese
        instante **el producto deja de pagar a ese rol**: es la única forma de
        dejar de pagar, a la vista y con instantánea.

        Hasta el 15-09-2026 una tasa asociada no se retiraba (`RN-CM-015`);
        desde que la tasa nace con su producto no hay asociación que la
        sostenga, y esa condición queda solo para la personalizada.

        **No es idempotente**: retirar dos veces devuelve `409`.
      operationId: retirar_3
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteCommissionRateRequest"
      responses:
        "204":
          description: Tasa retirada
        "400":
          description: "Motivo ausente, en blanco o demasiado largo"
        "403":
          description: Sin permiso
        "404":
          description: La tasa no existe
        "409":
          description: Ya estaba retirada
  /api/v1/auth/registration:
    post:
      tags:
      - Registro por enlace
      summary: Registrarse desde el enlace de un vendedor
      description: |
        Crea una cuenta de cliente **sin autenticación**, a partir del enlace
        que un vendedor reparte. Es el **primer endpoint público del sistema
        que escribe**.

        El enlace lleva dos datos y **ninguno es un secreto**: el producto y el
        vendedor. **Los dos viajan dentro de `movement`** (`productId` y
        `sellerUsername`) y no en el primer nivel: hasta el 09-09-2026 estaban
        además duplicados como `product` y `referrer`, y dos campos para un
        dato son dos valores que pueden discrepar.

        `countryCode` va en alfa-3 y `documentType` por abreviación, porque es
        un formulario público al que no se le puede pedir que conozca los
        identificadores del sistema. Los que sí son UUID son los de lo que el
        formulario **acaba de leer de un catálogo**: el broker de cada cuenta y
        el producto.

        **`companyPhone` NO se admite aquí**, y enviarlo devuelve `400` por
        propiedad desconocida. El resto del sistema lo declara desde el
        10-09-2026, pero quien se registra por un enlace es un cliente y
        preguntarle por el teléfono de una empresa que no tiene añadiría un
        campo que nadie rellenaría. Puede ponerlo después desde su propio perfil
        (`PATCH /api/v1/users/me`). **Ignorarlo en silencio sería peor que
        rechazarlo**: haría creer a quien lo manda que quedó guardado.

        **El registro anota una venta** (`RN-SP-043`), siempre — también en el
        enlace gratuito. Nace `PENDIENTE`, de modo que registrarse **no paga
        nada**, y su código se devuelve en `sale`.

        **`brokerAccounts` es una LISTA: se declaran UNA O MÁS cuentas** en el
        mismo registro, porque una persona puede operar con varios brokers y
        esta es hoy la única vía para declararlos.

        **Es obligatoria —al menos una— cuando el producto del enlace es una
        membresía `BECA → BECA`** (`RN-SP-042`), y solo entonces. El motivo es
        el estado en el que nace la cuenta: sin cuenta de broker declarada,
        nadie podrá atribuirle el depósito que la saca de `FTD_PENDIENTE`. Con
        otro producto **se admiten igualmente** las que se envíen.

        **El nombre de usuario en el broker no se pide**: lo rellena después el
        webhook del propio broker.

        **Dos cuentas iguales en la misma petición se rechazan** con `VAL-014`,
        y no con el `409` del índice: ese mensaje diría «ya está declarada por
        otra persona», y la otra persona sería ella misma.

        **El estado en que nace la cuenta depende del producto**
        (`RN-SP-044`). Con un enlace `BECA → BECA` nace en `FTD_PENDIENTE`, que
        **autentica y no opera**: quien se registra puede iniciar sesión y ver
        lo suyo, y lo que le falta para operar es el primer depósito. Con un
        producto **de pago** nace **`ACTIVO`** —no hay ningún depósito que
        esperar— y recibe la membresía **del suelo**, no la comprada: esa la
        concede **confirmar la venta**, y no registrarse.

        **La contraseña la elige la persona**, y por eso la cuenta **no** queda
        marcada para cambio obligatorio — se marca lo que fijó otro, no lo que
        uno fijó.

        **No devuelve credenciales de sesión**: registrarse no es iniciar
        sesión. Quien acaba de crear su cuenta pasa por el inicio de sesión
        como todo el mundo.

        **Los rechazos no dicen qué pasó, salvo dos.** Producto inexistente,
        inactivo o retirado comparten respuesta, y lo mismo el vendedor que no
        existe y el que no es fuerza comercial: distinguirlos convertiría este
        endpoint en una forma de enumerar el catálogo y la plantilla. **Sí
        dicen** cuál de las dos identidades —nombre de usuario o correo— está
        en uso, y que la cuenta de broker ya está declarada por otra persona:
        los dos los necesita quien se registra para poder corregir.
      operationId: registrar_8
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelfRegistrationRequest"
        required: true
      responses:
        "201":
          description: "Cuenta creada —`FTD_PENDIENTE` con el enlace gratuito, `ACTIVO`\
            \ con uno de pago— y venta anotada en estado `PENDIENTE`"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SelfRegistrationResponse"
        "400":
          description: Datos inválidos (serie `VAL-nnn`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SelfRegistrationResponse"
        "409":
          description: "Nombre de usuario o correo en uso (`EX-005`), cuenta de broker\
            \ ya declarada (`EX-009`), o la venta no procede — método de pago en una\
            \ venta gratuita, o ausente en una con importe (`RN-MV-022`)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SelfRegistrationResponse"
        "422":
          description: "El enlace no procede (`EX-001`, `EX-002`, `EX-003`, `EX-006`,\
            \ `EX-007`, `EX-008`) o el movimiento no procede (`EX-010`)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SelfRegistrationResponse"
        "429":
          description: Demasiadas peticiones desde este origen
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SelfRegistrationResponse"
  /api/v1/auth/refresh:
    post:
      tags:
      - Sesión
      summary: Renovar la sesión
      description: |
        Rota el refresh token y entrega credenciales nuevas.

        **La rotación es la defensa:** el token entregado deja de servir, de
        modo que presentarlo de nuevo significa que existe una copia. En ese
        caso se revoca la **familia entera** de la sesión y se emite la alarma.

        Las cinco condiciones de rechazo devuelven la **misma** respuesta: el
        cliente no debe poder deducir si el token fue robado, si expiró o si la
        cuenta fue desactivada.
      operationId: refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
        required: true
      responses:
        "200":
          description: Credenciales renovadas.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          description: Refresh token ausente
        "401":
          description: "La sesión no es válida — cinco causas posibles, una sola respuesta"
        "500":
          description: Fallo no controlado (`ERR-500`)
      security: []
  /api/v1/auth/password:
    post:
      tags:
      - Sesión
      summary: Cambiar la propia contraseña
      description: |
        Sustituye la contraseña de **quien porta el token**.

        **No lleva identificador de usuario**, y esa ausencia es la
        implementación de la regla: no hay campo por el que dirigir la
        operación a un tercero. Restablecer la contraseña de otra persona es
        otra operación, con su propio permiso.

        La contraseña actual se comprueba **la última**, después del formato, de
        que la nueva sea distinta y de la política. Es el único paso que consume
        el contador de intentos: ponerlo antes haría que cinco peticiones
        descuidadas de un cliente propio bloquearan la cuenta de su titular.

        La contraseña actual incorrecta devuelve `422` y **no `401`**: un `401`
        le diría al cliente que su sesión ya no vale y lo mandaría a iniciar
        sesión, cuando lo único que ocurrió es que escribió mal su contraseña.

        **Aquí sí se dice qué falló**, al revés que al iniciar sesión: quien
        hace esta petición ya está autenticado y no se le revela nada que no
        supiera.

        Al cambiarla, **todas las sesiones se revocan**, incluida la que ejecutó
        el cambio.
      operationId: cambiarContrasena
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
        required: true
      responses:
        "204":
          description: Contraseña sustituida.
        "400":
          description: "Falta alguna de las dos (`VAL-001`, `VAL-002`), la nueva no\
            \ cumple la política (`VAL-004`) o es igual a la actual (`VAL-005`)"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "422":
          description: La contraseña actual no es correcta (`VAL-003`). Consume un
            intento
        "423":
          description: La cuenta quedó bloqueada al alcanzar el umbral de fallos
        "500":
          description: Fallo no controlado (`ERR-500`)
      security:
      - bearerAuth: []
  /api/v1/auth/password-recovery:
    post:
      tags:
      - Sesión
      summary: Solicitar la recuperación de la propia contraseña
      description: |
        Emite un permiso temporal de un solo uso y lo envía al correo de la
        cuenta. Público: quien olvidó su contraseña no puede autenticarse.

        **La respuesta es idéntica exista o no la identidad**, en el cuerpo y
        en el estado. No hay forma de usar este endpoint para averiguar qué
        cuentas existen, que es exactamente para lo que se usaría si
        distinguiera.

        Y lo es **también en el tiempo**: el envío ocurre después de responder
        y por otro camino. Igualar solo el mensaje dejaría la defensa
        declarada y no real — emitir y enviar cuesta cientos de milisegundos
        que se miden desde fuera con un cronómetro.

        **Tampoco rechaza nada más.** Ni la cuenta bloqueada, ni la inactiva:
        cualquiera de esos rechazos diría algo. El `202` es además el estado
        honesto — el sistema no puede afirmar que algo se entregó.

        **Emitir uno invalida el anterior**, de modo que nunca hay dos puertas
        abiertas a la vez sobre la misma cuenta.
      operationId: solicitarRecuperacion
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordRecoveryRequest"
        required: true
      responses:
        "202":
          description: Solicitud aceptada. **La misma respuesta exista o no la identidad**
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PasswordRecoveryResponse"
        "400":
          description: Falta el identificador (`VAL-001`)
        "429":
          description: "Demasiadas solicitudes, por identidad o por origen (`ERR-429`)"
        "500":
          description: Fallo no controlado (`ERR-500`)
      security: []
  /api/v1/auth/password-recovery/confirmation:
    post:
      tags:
      - Sesión
      summary: Confirmar la recuperación con el permiso recibido
      description: |
        Consume el permiso y fija la contraseña nueva. Público: lo que
        autoriza es el permiso, no un token.

        **La política se comprueba antes de tocar el permiso.** Una contraseña
        que no la cumple es un error de la persona legítima, y consumir su
        permiso por ello la obligaría a pedir otro —y a esperar otro correo—
        por haber escrito una contraseña corta.

        **El `422` no distingue sus cuatro causas** —permiso inexistente,
        caducado, ya usado o sustituido—: hacerlo le diría a quien prueba
        permisos al azar cuál estuvo a punto de acertar.

        La contraseña que se fija aquí **no es provisional**: la eligió su
        titular y nadie más la conoce, de modo que la cuenta no queda marcada
        para cambio obligatorio. Es la diferencia deliberada con el
        restablecimiento por un administrador.

        **No levanta el bloqueo ni cambia el estado de la cuenta.** Recuperar
        la contraseña prueba que se tiene el correo, no que alguien decidiera
        devolver el acceso.

        Al completarse, **todas las sesiones se revocan** y los tokens de
        acceso ya emitidos dejan de admitirse.
      operationId: confirmarRecuperacion
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordRecoveryConfirmation"
        required: true
      responses:
        "204":
          description: Contraseña sustituida.
        "400":
          description: "Falta el permiso (`VAL-002`) o la contraseña (`VAL-003`),\
            \ o esta no cumple la política (`VAL-004`). **No consume el permiso**"
        "422":
          description: "El permiso no es válido (`VAL-005`): inexistente, caducado,\
            \ ya usado o sustituido. **Los cuatro casos comparten respuesta**"
        "429":
          description: Demasiadas confirmaciones desde el mismo origen (`ERR-429`)
        "500":
          description: Fallo no controlado (`ERR-500`)
      security: []
  /api/v1/auth/logout:
    post:
      tags:
      - Sesión
      summary: Cerrar sesión
      description: |
        Revoca el refresh token de la sesión, o **todos** los de la persona si
        se pide.

        Responde `204` para **cualquier** token sintácticamente válido, exista o
        no, esté vigente o revocado. Distinguirlos permitiría comprobar con dos
        peticiones si una cadena de texto es un refresh token del sistema, y el
        resultado prometido —que ese token no sirva— se cumple igual.
      operationId: logout
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
        required: true
      responses:
        "204":
          description: Sesión cerrada.
        "400":
          description: Refresh token ausente o con formato imposible
        "500":
          description: Fallo no controlado (`ERR-500`)
      security: []
  /api/v1/auth/login:
    post:
      tags:
      - Sesión
      summary: Iniciar sesión
      description: |
        Autentica con **nombre de usuario o correo** —el mismo campo para los
        dos— y entrega las credenciales de sesión.

        El rechazo por credenciales lleva `remainingAttempts`: **cuántos
        intentos quedan** antes del bloqueo. El identificador que no
        corresponde a ninguna cuenta los gasta igual, de modo que el número no
        permite averiguar qué cuentas existen.

        La cuenta bloqueada recibe `423` y un mensaje que la identifica como
        tal: es una excepción consciente al mensaje genérico, porque quien
        provocó el bloqueo ya sabe que la cuenta existe. Si el bloqueo es
        **automático**, la respuesta añade `unlockAt` —el instante en que se
        levanta— y `retryAfterSeconds` —lo que falta—. El bloqueo **manual**
        no los lleva: esa cuenta no se desbloquea sola.

        **La espera no va escrita en el mensaje, y es deliberado.** Un texto
        con «vuelva en dos minutos» es cierto al serializarse y deja de serlo
        enseguida. Con `retryAfterSeconds` el cliente **descuenta** —una
        cuenta regresiva no envejece— sin depender de que su reloj coincida
        con el del servidor, que es lo que sí ocurriría calculándola a partir
        de `unlockAt`.

        Si la contraseña la fijó otra persona, la respuesta autentica **y
        advierte** con `mustChangePassword`: hace falta una sesión para poder
        cambiarla.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: Credenciales de sesión.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          description: Identificador o contraseña ausentes
        "401":
          description: "Credenciales inválidas, cuenta inexistente, inactiva o eliminada\
            \ — los cuatro casos comparten cuerpo y mensaje, sin una sola diferencia\
            \ observable. Lleva `remainingAttempts`; el intento que agota el contador\
            \ añade además `unlockAt` y `retryAfterSeconds`"
        "423":
          description: "Cuenta bloqueada. El bloqueo automático lleva `unlockAt` y\
            \ `retryAfterSeconds`; el manual no los lleva, porque no expira solo"
        "500":
          description: Fallo no controlado (`ERR-500`)
      security: []
  /api/v1/users/{id}:
    get:
      tags:
      - Usuarios
      summary: Consultar el detalle de una persona
      description: |
        Sus roles **con el estado de cada uno**, sus permisos efectivos, su
        membresía y el contexto de su acceso.

        Las dos primeras juntas son lo único que explica por qué una persona
        **con roles** no puede hacer nada: porque todos están inactivos y la
        lista de permisos llega vacía.

        Los permisos efectivos salen del **mismo componente que autoriza**, de
        modo que esta respuesta no puede contradecir a lo que el sistema hará
        con la siguiente petición de esa persona.

        `lockedUntil` nulo significa dos cosas distintas y eso es información:
        la cuenta no está bloqueada, o lo está **por decisión de un actor** y
        por tanto sin expiración. El estado desambigua.

        Trae el `country`, el `document` y el `contact` de la persona. El
        contacto lleva **dos teléfonos**: `phone`, el personal, y `companyPhone`,
        el de la empresa — este último **opcional**, de modo que llega presente y
        en nulo cuando la persona no lo declaró.

        **`country` nunca es nulo y `document` sí puede serlo**: quienes se
        registraron antes de que el documento fuera obligatorio no lo tienen, y
        **esta pantalla es donde esa ausencia se ve** — es la que sirve para
        saber a quién hay que completar.

        **El país y el tipo de documento se devuelven aunque estén inactivos.**
        Retirarlos del catálogo los quita de los desplegables del alta; no
        cambia dónde está ni con qué se identifica quien ya los tenía, ni lo
        oculta a quien administra.

        **No devuelve intentos fallidos** —diría cuántos le quedan a una cuenta
        antes de bloquearse—, **ni dato alguno de la credencial**, **ni el
        superior comercial**, que tiene su propio endpoint.

        Una persona eliminada devuelve el **mismo** `404` que una inexistente,
        sin ninguna pista de que existió.
      operationId: detalle
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: La persona.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserDetailResponse"
        "400":
          description: El identificador no es un UUID en forma canónica (`VAL-001`)
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: Autenticado sin `users:read` (`AUTH-002`)
        "404":
          description: "No existe, o está eliminada (`EX-001`)"
        "500":
          description: Fallo no controlado (`ERR-500`)
    patch:
      tags:
      - Usuarios
      summary: Editar los datos de una persona
      description: |
        Modifica el nombre, los apellidos, el correo, el país, la **identidad
        documental** y los **datos de contacto**. `PATCH` y no `PUT`:
        `PUT` obligaría a enviar el recurso completo —incluidos el nombre de
        usuario, el estado y los roles, que esta operación **no** puede
        modificar— y habría que decidir qué hacer si llegaran con otros valores.

        **Todos los campos son opcionales, y el nulo explícito NO significa lo
        mismo en todos.** El campo ausente nunca se toca; con el nulo hay **dos
        familias**, y la línea que las separa es la de lo obligatorio y lo
        opcional:

        - **Lo rechazan con `400`**: `firstName`, `lastName`, `email`,
          `countryId`, `documentTypeId`, `documentNumber` y `phone`. Su columna
          no admite ausencia, y aceptarlo produciría un `500` en lugar del `400`
          que corresponde.
        - **Lo aceptan y VACÍAN el campo**: `addressLine1`, `addressLine2`,
          `city` y `companyPhone`. Son opcionales, y «ya no vive ahí» —o «ya no
          tiene ese número»— es un hecho que hay que poder registrar.

        **`companyPhone` cae del lado que vacía aunque sea un teléfono**, y es la
        comprobación de que la línea está bien trazada: comparte forma y
        validación con `phone` y aun así va del otro lado, porque lo que decide
        no es qué dato es sino si `RN-SP-037` lo exige.

        **El tipo y el número de documento se envían juntos o no se envían.**
        Enviar uno solo devuelve `400`: un número sin decir de qué documento es
        no significa nada.

        **Esta es la ÚNICA operación que cambia el documento y el país.** El
        titular no puede tocarlos desde `PATCH /api/v1/users/me`.

        **Se comprueba el destino, nunca el actual.** Un país o un tipo de
        documento inactivos se rechazan **como destino**; que los vigentes de
        la persona lo estén no impide editarla — es justamente para eso que
        existe esta operación.

        **Corregir el documento no libera el anterior.** Es la diferencia
        deliberada con el correo, que sí queda libre: un documento identifica a
        alguien en el mundo real, y liberarlo permitiría que otra ficha lo
        tomara.

        **El nombre de usuario no se puede cambiar**, y enviarlo devuelve `400`
        por propiedad desconocida en lugar de ignorarse en silencio. Lo mismo
        con el estado, los roles, la membresía y la contraseña: cada uno tiene
        su operación.

        El correo se normaliza —recorte y minúsculas— **antes** de compararse,
        de modo que reenviar el propio en mayúsculas es un cambio sin efecto y
        no un conflicto consigo mismo.

        **El actor sí puede editarse a sí mismo**: corregir el propio apellido
        no concede ningún privilegio.
      operationId: editar
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
        required: true
      responses:
        "200":
          description: "La persona, con los datos actualizados."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: "Ningún campo informado (`VAL-001`), campo vaciado que no admite\
            \ vaciarse (`VAL-002`, `VAL-006` país, `VAL-007` documento, `VAL-008`\
            \ teléfono), tipo y número de documento sin su pareja (`VAL-007`), correo\
            \ inválido (`VAL-003`), longitud excedida (`VAL-005`) o campo desconocido\
            \ —incluidos el nombre de usuario, el estado, los roles y la contraseñ\
            a"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: Autenticado sin `users:update` (`AUTH-002`)
        "404":
          description: "No existe, o está eliminada (`EX-002`)"
        "409":
          description: "El correo ya está en uso (`RN-SP-016`). **El mensaje no dice\
            \ de quién es**: puede ser de alguien eliminado, y decirlo revelaría una\
            \ cuenta"
        "500":
          description: Fallo no controlado (`ERR-500`)
  /api/v1/users/{id}/supervisor:
    patch:
      tags:
      - Usuarios
      summary: Establecer o cambiar el superior comercial
      description: |
        `PATCH` sobre el subrecurso y no `PUT`: el cuerpo no representa el
        estado completo —falta el periodo, que lo fija el sistema— y `PUT`
        invitaría a pensar que se puede enviar.

        **No admite fecha de inicio.** La asignación rige desde que se ejecuta,
        siempre. Declararla obligaría a especificar solapamientos, huecos entre
        tramos y correcciones retroactivas sobre periodos ya liquidados.

        **No admite retirar el superior.** El estado «vendedor sin superior» no
        existe: la única salida es dejar de portar rol comercial retirándolo.

        Cada cambio **cierra** el tramo vigente con su fecha y **abre** otro:
        nunca se sobrescribe el superior de una fila. La respuesta devuelve el
        **anterior con su fecha de cierre**, que es lo que permite confirmar de
        un vistazo que se cerró el tramo que se creía cerrar.

        **El equipo se mueve con el reasignado**: sus subordinados conservan su
        superior y solo cambia de quién depende la rama.

        Repetir la operación con el mismo superior no cierra ni abre nada y no
        deja auditoría — pero el motivo se exige igual, antes de saberlo.
      operationId: asignarSuperior
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignSupervisorRequest"
        required: true
      responses:
        "200":
          description: "La estructura, con el superior nuevo y el anterior."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommercialStructureResponse"
        "400":
          description: "Identificador malformado, o motivo ausente o vacío (`VAL-001`,\
            \ `VAL-008`)"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: Autenticado sin `users:assign-supervisor` (`AUTH-002`)
        "404":
          description: Alguna de las dos personas no existe o está eliminada (`VAL-002`)
        "409":
          description: "El actor es el propio subordinado (`RN-SP-017`), el subordinado\
            \ no pertenece a la fuerza comercial (`VAL-003`) o es la cúspide (`VAL-004`),\
            \ el superior no porta el rol que exige el orden de mando (`RN-SP-020`)\
            \ —el mensaje dice cuál—, no está activo (`VAL-006`), o sería su propio\
            \ superior (`VAL-007`)"
        "500":
          description: Fallo no controlado (`ERR-500`)
  /api/v1/users/{id}/status:
    patch:
      tags:
      - Usuarios
      summary: Retirar o devolver el acceso de una persona
      description: |
        Subrecurso propio y no un campo de la edición: el estado tiene reglas de
        rechazo que la edición no tiene y exige un motivo que la edición no
        admite.

        **Se envía el estado destino y no una acción**, lo que hace la operación
        idempotente por construcción. Pedir el estado que ya se tiene no cambia
        nada y no deja evento.

        **Salvo en un caso, y es el que da sentido al requerimiento:** pasar de
        bloqueo **automático** a bloqueo **manual** sí es un cambio aunque el
        estado sea el mismo — `lockedUntil` pasa de informado a nulo, y con ello
        el bloqueo deja de levantarse solo.

        **El motivo es condicional en los dos sentidos:** obligatorio al retirar
        el acceso, **rechazado** al devolverlo.

        **`PENDIENTE` no se admite**, aunque el esquema lo acepte: ningún
        requerimiento lo produce y sería el único camino hacia un estado del que
        nadie sabe salir.

        **Reactivar nunca falla por regla.** Devolver el acceso no puede dejar a
        nadie sin administración ni a ningún equipo huérfano.

        Retirar el acceso **revoca todas las sesiones** de la persona.
      operationId: cambiarEstado
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeUserStatusRequest"
        required: true
      responses:
        "200":
          description: El estado resultante. `lockedUntil` nulo con BLOQUEADO significa
            manual.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserStatusResponse"
        "400":
          description: "Estado ausente, fuera del dominio o `PENDIENTE` (`VAL-001`);\
            \ motivo ausente al retirar (`VAL-005`) o presente al devolver (`VAL-006`)"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: "Autenticado sin `users:update` (`AUTH-002`), o es la cuenta\
            \ del propio actor (`RN-SP-017`) — dos casos distintos con `error_code`\
            \ distinto"
        "404":
          description: "No existe, o está eliminada (`EX-005`)"
        "409":
          description: "Es el último superadministrador activo (`RN-SP-001`), o tiene\
            \ personas a cargo (`RN-SP-022`) — este último dice **cuántas**, nunca\
            \ quiénes"
        "500":
          description: Fallo no controlado (`ERR-500`)
  /api/v1/users/me:
    get:
      tags:
      - Usuarios
      summary: Consultar el propio perfil
      description: |
        Devuelve el perfil de **quien porta el token**, con sus **permisos
        efectivos**.

        Su `contact` lleva **dos teléfonos** —`phone`, el personal, y
        `companyPhone`, el de la empresa, este último **opcional** y por tanto
        presente y en nulo cuando no se declaró— junto a la dirección. Es lo que
        permite precargar el formulario de `PATCH /api/v1/users/me` sin
        reescribir nada de memoria.

        Su `membership` —**ausente**, no nula, cuando la persona no tiene una
        vigente— trae `code`, `name`, `level`, `color` y `endsAt`. `name` y
        `color` entran el 14-09-2026: son lo que la pantalla de «mi perfil»
        necesita para pintar el nivel con su color y llamarlo por su nombre sin
        pedir la cadena entera de membresías. El color son seis hexadecimales
        sin `#`.

        `me` es un **literal**, no un identificador: no se admite pedir el
        propio detalle por la ruta con identificador, que es otra operación y
        exige permiso de lectura de usuarios.

        **Sin parámetros de ningún tipo** — ni de ruta, ni de consulta, ni de
        cuerpo.

        Los permisos salen del **mismo componente que autoriza**, de modo que lo
        que esta pantalla dice que la persona puede hacer es exactamente lo que
        el sistema le dejará hacer. Es lo que permite a una interfaz decidir qué
        mostrar sin duplicar en el navegador una regla que vive en el servidor.

        **No exige permiso alguno**, solo estar autenticado: no hay recurso
        ajeno que proteger.

        Devuelve **solo el superior comercial, nunca el equipo**: a quién
        reporta uno es un dato del actor; quiénes dependen de uno es un conjunto
        de terceros.

        Trae además el `country`, el `document` y el `contact` del actor.
        **`country` nunca falta y `document` sí puede faltar**: las personas
        registradas antes de que el documento fuera obligatorio no lo tienen, y
        el campo llega ausente. El navegador tiene que contemplarlo.

        **El `contact` se publica aquí para que la pantalla de edición pueda
        precargarse**: es exactamente lo que `PATCH /api/v1/users/me` deja
        corregir. El `document` viaja en la misma respuesta y **no** es
        editable por el titular — esa diferencia es la razón de que los dos
        vayan en objetos separados en lugar de como campos sueltos.

        `lastLoginAt` es un dato **informativo de la sesión en curso**, no una
        señal de intrusión: el inicio de sesión sobrescribe ese valor al entrar.
      operationId: miPerfil
      responses:
        "200":
          description: El perfil.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OwnProfileResponse"
        "401":
          description: "Sin credencial válida, o la cuenta fue eliminada tras emitirse\
            \ el token (`AUTH-001`) — lo que dejó de valer es la sesión, no la ruta,\
            \ y por eso no es `404`"
        "500":
          description: Fallo no controlado (`ERR-500`)
    patch:
      tags:
      - Usuarios
      summary: Editar el propio perfil
      description: |
        Corrige el **propio** nombre, apellidos, correo y **datos de contacto**
        —los **dos teléfonos**, dirección, complemento y ciudad—. Autenticado y **sin
        ningún permiso**: `RF-SP-027` hace el mismo cambio pero exige
        `users:update`, que es un permiso de administración, de modo que
        concedérselo a alguien para que arregle su propio apellido le daría de
        paso la capacidad de editar el de cualquiera.

        `me` es un **literal**, no un identificador, y el cuerpo **no admite
        ninguno**: la operación no se puede desviar hacia otra persona.

        **`currentPassword` es obligatorio si y solo si se envía `email`.**
        Desde `RF-SP-040` el correo es la vía por la que se recupera una
        contraseña olvidada, así que cambiarlo es cambiar **quién puede
        recuperar la cuenta**. Una sesión robada no lleva la contraseña, y
        exigirla convierte el robo de sesión en algo que **caduca** en lugar de
        en una apropiación permanente. Cambiar solo el nombre no la pide,
        porque equivocar un apellido no abre ninguna puerta.

        **Enviar el correo que ya se tiene sigue exigiendo la contraseña.** Que
        el valor no cambie se sabe después de mirarlo, y condicionar la
        exigencia a eso daría una forma de averiguar el correo vigente probando
        valores.

        ## Qué se puede cambiar aquí y qué no

        **El contacto sí; la identidad no.** El tipo y el número de documento y
        el país **no están en este cuerpo**: son identidad, no contacto, y los
        corrige un administrador por `PATCH /api/v1/users/{id}`. Enviarlos
        devuelve `400` por propiedad desconocida, no se ignoran.

        La línea no es técnica: un teléfono nuevo o una mudanza son hechos que
        la persona conoce mejor que nadie y no deberían costar un ticket; el
        documento es con lo que figura en la auditoría, y el país decide qué
        medios de pago se le ofrecen.

        **Ningún teléfono exige `currentPassword`**, al contrario que el correo.
        La contraseña se pide cuando el campo **es una vía de acceso**, y el
        teléfono hoy no lo es. El día que exista verificación por SMS o segundo
        factor telefónico, esta decisión se revisa.

        **El nulo explícito no significa lo mismo en todo el cuerpo.**
        `addressLine1`, `addressLine2`, `city` y `companyPhone` **lo aceptan y vacían**
        —«ya no vivo ahí» es un hecho que hay que poder registrar—; el nombre,
        los apellidos, el correo y el **teléfono personal** lo rechazan con `400`.

        **`companyPhone` cae del lado que vacía aunque sea un teléfono**, y ahí
        está toda la diferencia: lo que decide no es qué dato es, sino si
        `RN-SP-037` lo exige. «Ya no tengo teléfono de empresa» es un hecho que
        hay que poder registrar.

        Devuelve el perfil ya actualizado, con **la misma forma** que
        `GET /api/v1/users/me`.
      operationId: editarMiPerfil
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOwnProfileRequest"
        required: true
      responses:
        "200":
          description: El perfil actualizado.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OwnProfileResponse"
        "400":
          description: "Ningún campo informado (`VAL-001`), campo vaciado (`VAL-002`),\
            \ correo inválido (`VAL-003`), longitud excedida (`VAL-005`), falta la\
            \ contraseña actual habiendo correo (`VAL-006`) o campo desconocido"
        "401":
          description: "Sin credencial válida, o la cuenta fue eliminada tras emitirse\
            \ el token"
        "403":
          description: "Hay un cambio obligatorio de contraseña pendiente: se atiende\
            \ primero. Esta ruta **no** figura entre las alcanzables con esa marca"
        "409":
          description: Ese correo ya está en uso por otra persona (`RN-SP-016`)
        "422":
          description: La contraseña actual no es correcta (`VAL-007`)
        "500":
          description: Fallo no controlado (`ERR-500`)
  /api/v1/user-commission-rates/{id}:
    patch:
      tags:
      - Comisiones
      summary: Corregir una tasa personalizada
      description: |
        Corrige el **valor** —la forma y la cifra— y el **fin de vigencia**. Se
        aplica lo que llega y se deja intacto lo que no.

        **Corregir no es cambiar**, y aquí la distinción sigue viva: corregir
        arregla un error y reescribe lo que esa tasa dice que rigió; cambiar lo que
        gana alguien a partir de una fecha es **cerrar la vigente y registrar
        otra**.

        `validTo: null` **vacía** el fin de vigencia y la tasa vuelve a regir
        indefinidamente; `rateType: null` se **rechaza**.

        **La persona, el producto y el inicio de vigencia no se corrigen**:
        `userId` y `validFrom` devuelven `400` con `VAL-009`, y `productId` es un
        campo desconocido que también responde `400`.

        **Todo se revisa contra el producto de la tasa** (`RN-CM-021`): alargar
        `validTo` no puede pisar a otra tasa viva de la misma persona sobre él
        (`409`, `EX-006`); un `fixedAmount` que supere su precio se rechaza con
        `409` (`EX-007`); sobre un producto **gratuito** solo cabe el importe
        fijo (`RN-CM-020`): dejarla de porcentaje se rechaza con `409`
        (`EX-008`), y el fijo entra del importe que sea; y un importe fijo tiene
        que **caber en los decimales de la moneda del producto** (`VAL-014`).
      operationId: corregir
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserCommissionRateRequest"
        required: true
      responses:
        "200":
          description: Tasa corregida
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserCommissionRateResponse"
        "400":
          description: Datos inválidos o campos no corregibles
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserCommissionRateResponse"
        "403":
          description: Sin permiso
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserCommissionRateResponse"
        "404":
          description: "No existe, o está retirada"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserCommissionRateResponse"
        "409":
          description: "La vigencia resultante se solapa (`EX-006`), el valor pasarí\
            a del precio del producto (`EX-007`), o dejaría de porcentaje la tasa\
            \ de un producto gratuito (`EX-008`)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserCommissionRateResponse"
  /api/v1/roles/{id}:
    get:
      tags:
      - Roles
      summary: Consultar el detalle de un rol
      description: |
        Devuelve el alcance exacto de un rol: **la lista completa de los
        permisos que declara**, su rol padre, **cuántos** roles cuelgan de él y
        **cuántas** personas lo tienen asignado.

        **Los permisos son los declarados, sin recorrer la cadena de
        ancestros** (`RN-SEG-004`): el modelo no usa herencia, y esa decisión
        existe precisamente para que esta pregunta se responda leyendo una sola
        lista. Van completos y sin paginar, ordenados por código.

        **`childRoleCount` es un número, nunca una lista**: el listado de hijos
        se obtiene con `GET /api/v1/roles?parentRoleId={id}`, que ya está
        paginado. Así el tamaño de la respuesta no depende de cuántos hijos
        tenga el rol.

        **`assignedUserCount` cuenta personas distintas**, en cualquier estado
        —incluidas las inactivas y las bloqueadas— y **excluyendo las
        eliminadas**: alguien bloqueado sigue portando el rol, y su existencia
        es lo que impide borrarlo. Cero es un dato, no una ausencia. **No exige
        `users:read`**: es un agregado sin identidad, y quien quiera saber
        quiénes son usa `GET /api/v1/users?roleId={id}`.

        Un rol **eliminado devuelve el mismo `404`** que uno inexistente, sin
        ninguna pista de que existió.
      operationId: detalle_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Detalle del rol.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleDetailResponse"
        "400":
          description: El identificador no es un UUID en forma canónica (`VAL-001`)
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: Autenticado sin `roles:read` (`AUTH-002`)
        "404":
          description: "No existe el rol, o está eliminado lógicamente (`EX-001`)"
        "500":
          description: Fallo no controlado (`ERR-500`)
    patch:
      tags:
      - Roles
      summary: Editar un rol
      description: |
        Modifica el **nombre** y la **descripción**. Nada más: el código es
        estable por diseño —cambiarlo rompería cualquier referencia externa— y
        la clasificación es **inmutable**, porque determina si el rol puede
        llevar membresía y cambiarla dejaría membresías colgando de un rol que
        ya no es consumidor. Los permisos, el estado y el rol padre tienen cada
        uno su operación.

        Al menos uno de los dos campos debe venir informado. `description`
        admite `null` explícito —borrarla es una orden legítima—; `name` no,
        porque un rol sin nombre no existe.

        **Reenviar los valores actuales no es un error ni registra evento**: si
        nada cambió, no hay nada que auditar.

        **Un rol de sistema devuelve `409` y un rol que usted tiene asignado,
        `403`**. Lo segundo impide ampliar el alcance del rol con el que se
        está entrando; alcanza solo a los roles asignados **directamente**, de
        modo que un ancestro del propio sí puede editarse.
      operationId: editar_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleRequest"
        required: true
      responses:
        "200":
          description: Rol actualizado.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "400":
          description: "Ningún campo informado (`VAL-001`), nombre vacío (`VAL-002`)\
            \ o longitud excedida (`VAL-004`)"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "403":
          description: "Sin `roles:update` (`AUTH-002`), o el rol está asignado al\
            \ propio actor (`RN-SEG-011`)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "404":
          description: El rol no existe o está eliminado (`EX-004`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "409":
          description: Rol de sistema (`RN-SEG-012`) o nombre ya en uso (`RN-SEG-001`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "500":
          description: Fallo no controlado (`ERR-500`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
  /api/v1/roles/{id}/status:
    patch:
      tags:
      - Roles
      summary: Activar o desactivar un rol
      description: |
        **Desactivar no es retirar.** Las asignaciones a personas se conservan
        intactas; lo que cambia es que el rol **deja de conceder permisos de
        inmediato**, sin esperar a que ningún token expire.

        Se pide el **estado destino** —`ACTIVO` o `INACTIVO`— y no una acción,
        de modo que repetir la petición deja el mismo resultado y no registra
        evento.

        **El rol raíz no admite esta operación**, aparte de la prohibición
        general sobre los roles de sistema: un rol raíz inactivo no concede
        nada, y eso dejaría al sistema sin su última vía de administración.

        El cuerpo no admite motivo: el Art. V.13 lo exige solo en las
        eliminaciones.
      operationId: cambiarEstado_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeRoleStatusRequest"
        required: true
      responses:
        "200":
          description: Rol con su estado actualizado.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "400":
          description: Estado ausente o fuera del dominio (`VAL-001`)
        "401":
          description: Token ausente o inválido (`AUTH-001`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "403":
          description: "Sin `roles:update`, o el rol está asignado al propio actor\
            \ (`RN-SEG-011`)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "404":
          description: El rol no existe o está eliminado (`EX-003`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "409":
          description: Rol de sistema (`RN-SEG-012`) o rol raíz (`RN-SEG-007`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "500":
          description: Fallo no controlado (`ERR-500`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
  /api/v1/roles/{id}/parent:
    patch:
      tags:
      - Roles
      summary: Cambiar el rol padre
      description: |
        Reubica el rol bajo otro padre y **revalida la contención contra el
        nuevo** (`RN-SEG-013`): si el rol declara permisos que el nuevo padre
        no posee, la operación se rechaza **entera** enumerándolos, para que
        usted decida cuáles retirar. **Nunca se recorta nada en silencio.**

        **Los hijos acompañan al rol** y no hay que revisarlos: si este cabe en
        el nuevo padre, ellos caben en este por transitividad.

        El nuevo padre debe existir y estar **activo**, y no puede ser el
        propio rol ni uno de sus descendientes —eso formaría un ciclo—. Su
        clasificación es indiferente: un rol comercial puede colgar de uno
        funcionario, porque el padre acota privilegios, no clasifica.

        **El rol raíz no admite padre** y ningún rol puede quedarse sin él:
        `RN-SEG-007` exige exactamente una cima.
      operationId: cambiarPadre
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeRoleParentRequest"
        required: true
      responses:
        "200":
          description: Rol con su nuevo rol padre.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "400":
          description: Rol padre ausente o mal formado (`VAL-001`)
        "401":
          description: Token ausente o inválido (`AUTH-001`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "403":
          description: "Sin `roles:update`, o el rol está asignado al propio actor\
            \ (`RN-SEG-011`)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "404":
          description: El rol no existe o está eliminado (`EX-006`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "409":
          description: "Rol de sistema (`RN-SEG-012`), rol raíz (`RN-SEG-007`), ciclo\
            \ en la jerarquía (`RN-SEG-006`) o permisos que el nuevo padre no concede\
            \ (`RN-SEG-013`)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "422":
          description: El rol padre indicado no existe o no está activo (`EX-004`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "500":
          description: Fallo no controlado (`ERR-500`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
  /api/v1/products/{id}:
    get:
      tags:
      - Productos
      summary: Consultar el detalle de un producto
      description: |
        Devuelve el producto con su membresía destino y su moneda **resueltas**,
        sin exigir una segunda consulta.

        Trae **los dos precios** —`price`, el que se cobra, y `purchasePrice`,
        el **precio de compra**: lo que NEXUS paga por el producto, que llega
        **nulo y presente** si no se conoce— y **`exchange`**, la conversión
        de `price` a la moneda por omisión con la tasa vigente hoy. La
        conversión llega **presente y nula** cuando el producto ya está en esa
        moneda o cuando nadie declaró una tasa (`RN-PM-024`). El precio de
        compra solo se ve aquí y en el listado: la oferta y el hotlink no lo
        devuelven.

        Trae **`videoUrl`**, la dirección del video que presenta el producto,
        **tal cual se guardó** y **presente y nula** cuando no tiene
        (`RN-PM-032`) — también en un producto retirado.

        **Un producto retirado se devuelve marcado como tal**, no como
        inexistente: `deletedAt` dice desde cuándo y `deletionReason` **por
        qué**. Los dos campos **solo aparecen si el producto está retirado** —
        su ausencia significa que sigue vivo—. El motivo llega con
        `products:read` y **sin exigir permiso de auditoría**; es la
        contrapartida asumida de que el detalle lo devuelva.

        **No devuelve autoría en ninguna forma**: ni quién lo creó, ni quién lo
        corrigió, ni quién lo retiró. Eso vive en la auditoría y tiene su
        propio permiso.

        `targetMembership` y `validityDays` viajan **presentes en nulo** cuando
        no aplican: un bot no tiene destino y un producto puede no
        caducar, y un campo ausente es indistinguible de uno que el cliente no
        conoce.

        El **nivel** del destino es el **actual**, no el que tenía cuando se
        creó el producto: la cadena de membresías se reordena al insertar un
        eslabón.

        Un identificador con forma laxa se rechaza como **dato inválido**
        (`400`), no como recurso no encontrado.
      operationId: detalle_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: "El producto, con su destino y su moneda resueltos."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductDetailResponse"
        "400":
          description: Identificador sin forma canónica (`VAL-001`)
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: Autenticado sin el permiso `products:read` (`AUTH-002`)
        "404":
          description: No existe un producto con ese identificador (`EX-001`)
        "500":
          description: Fallo no controlado (`ERR-500`)
    patch:
      tags:
      - Productos
      summary: Corregir un producto
      description: |
        Corrige el **nombre**, la **descripción**, el **icono**, el **enlace
        del video**, **los dos precios**, la **moneda**, la **vigencia**, el
        **alcance** y la **implementación**. Se aplica lo que llega y se deja
        intacto lo que no.

        **Distingue el campo ausente del enviado vacío**, y de ahí salen dos
        comportamientos opuestos: `description: null`, `icon: null`,
        `videoUrl: null`, `validityDays: null` y `purchasePrice: null`
        **vacían** el campo,
        mientras que `name: null` y `price: null` se **rechazan**, porque un
        producto sin nombre o sin precio del sistema no puede existir.

        **`purchasePrice` es el precio de compra** —lo que NEXUS paga por el
        producto— y esta operación es donde hoy se registra lo que costó.
        **Vaciarlo NO es ponerlo a cero**: con nulo el costo pasa a «no se
        conoce», y con cero a «no costó nada». Son dos estados distintos y
        los dos se alcanzan desde aquí. Se llamó `publicPrice` hasta el
        12-09-2026; ese nombre es hoy una propiedad desconocida y devuelve
        `400`.

        **`scope: null` e `implementation: null` también se rechazan**, y ahí
        van con el nombre y no con la descripción: son obligatorios en la
        columna, de modo que «bórralo» no tiene ningún estado al que llevar el
        producto. Devuelven `400` con `VAL-007` y `VAL-008`.

        **El alcance y la implementación SÍ se corrigen, aunque el tipo y las
        membresías no**: ninguna de las dos define qué derecho otorga el
        producto —una dice en qué vistas se ofrece y la otra quién lo aplica—,
        de modo que corregirlas no reescribe lo que compró quien lo compró.
        `scope` admite `TIENDA`, `HOTLINK`, `AMBOS` y `NINGUNO`; **corregir
        un producto activo a `NINGUNO` no lo desactiva**: sigue activo y deja
        de ofrecerse. `HOTLINKS` se rechaza con `400`, como cualquier valor
        fuera del dominio.

        **El icono sí se corrige, aunque el tipo no**: es el aspecto del
        producto y no lo que otorga. En un `BOT`, cualquier valor distinto de
        nulo se rechaza con `VAL-013` (`RN-PM-016`).

        **`videoUrl` se corrige y se vacía en los DOS tipos** —con `null` o
        con `""`, que aquí también es un vaciado— y sin la condición del
        icono (`RN-PM-032`). Se comprueba **solo la forma** —URL absoluta
        `http` o `https`, sin espacios, hasta 500 caracteres— y lo demás se
        rechaza con `VAL-009` **sin aplicar ningún otro cambio** de la misma
        petición. Se guarda tal cual, recortado, y el sistema no lo sigue.

        **El tipo, el código y la membresía destino NO se pueden corregir**, y
        enviarlos devuelve `400` con `VAL-006`. Se rechazan y no se ignoran:
        ignorarlos haría creer que el cambio se aplicó. Definen qué derecho
        otorga el producto, y cambiarlos convertiría lo comprado en otra cosa.

        **Los DOS importes se validan contra la moneda que va a quedar**, y no
        solo el que llega en la petición: cambiar **solo** la moneda puede
        dejar sin caber a un precio que nadie tocó, y el rechazo **nombra el
        campo** que no cabe. Y el importe **no se convierte**: el sistema no
        hace conversión de divisa — cambiar de moneda es declarar que ese
        número siempre estuvo en la otra.

        **Un producto retirado no se corrige**: lo que se retiró debe quedar
        como estaba para que lo que lo referencie siga diciendo la verdad.

        **No se exige motivo**, ni siquiera al cambiar el precio. Una petición
        que no cambia nada devuelve `200` y **no registra evento**.
      operationId: corregir_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductRequest"
        required: true
      responses:
        "200":
          description: "El producto, ya corregido."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductDetailResponse"
        "400":
          description: "Identificador sin forma canónica (`VAL-001`), nombre vací\
            o o ningún campo informado (`VAL-002`), longitud excedida (`VAL-003`),\
            \ precio negativo o precio del sistema vaciado (`VAL-004`), decimales\
            \ que la moneda no admite (`VAL-005`), campos inmutables en la petició\
            n (`VAL-006`) o vigencia no positiva (`VAL-011`)"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: Autenticado sin el permiso `products:update` (`AUTH-002`)
        "404":
          description: No existe un producto vivo con ese identificador (`EX-001`)
        "409":
          description: El nombre ya lo tiene otro producto vivo (`EX-002`)
        "422":
          description: La moneda no existe o está desactivada (`EX-003`)
        "500":
          description: Fallo no controlado (`ERR-500`)
  /api/v1/products/{id}/status:
    patch:
      tags:
      - Productos
      summary: Publicar o retirar de la oferta un producto
      description: |
        Cambia el estado del producto entre `ACTIVO` e `INACTIVO`. **Es un
        recurso propio y no un campo de la edición**: publicar y corregir son
        decisiones distintas, y mezclarlas haría que una corrección de texto
        pudiera poner algo a la venta.

        **Pedir el estado que el producto ya tiene devuelve `200` sin cambiar
        nada y sin registrar evento.** No es un error: quien pulsa dos veces el
        mismo botón no ha hecho nada malo.

        **No se publica un producto sin descripción** (`RN-PM-014`). Sí se
        permite **desactivarlo** sin ella: la regla acota lo que se ofrece, no
        lo que se retira.

        **Solo puede haber un upgrade activo hacia cada membresía destino**
        (`RN-PM-004`). Al activar uno cuyo destino ya está ocupado, el rechazo
        **nombra el producto que lo ocupa**, para que se sepa cuál desactivar.
        Desactivar no comprueba nada: liberar un destino nunca produce
        conflicto.

        **Un producto retirado no vuelve a la venta por aquí**: responde que no
        existe.

        No se exige motivo para activar ni para desactivar.
      operationId: cambiarEstado_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeProductStatusRequest"
        required: true
      responses:
        "200":
          description: "El producto, con su estado ya aplicado."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductDetailResponse"
        "400":
          description: "Identificador sin forma canónica (`VAL-001`), estado ausente\
            \ o fuera de su dominio (`VAL-002`), o activación de un producto sin descripció\
            n (`VAL-003`)"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: Autenticado sin el permiso `products:update` (`AUTH-002`)
        "404":
          description: No existe un producto vivo con ese identificador (`EX-001`)
        "409":
          description: Ya hay otro upgrade activo hacia esa membresía destino (`EX-002`)
        "500":
          description: Fallo no controlado (`ERR-500`)
  /api/v1/products/{id}/comments/{commentId}:
    delete:
      tags:
      - Reseñas
      summary: Retirar la reseña propia
      description: |
        Retira lógicamente la reseña de quien llama, **sin motivo y sin cuerpo**. Es la
        primera baja de una entidad de negocio del sistema que no pide `reason`: el
        Art. V.13 admite desde el 14-09-2026 el **contenido propio** como excepción, porque
        el único «por qué» posible —su autor ya no la quiere ahí— está en el propio evento.
        El registro de eliminación se escribe igual, con la instantánea y un motivo fijo.

        Por eso es un `DELETE` y no un `POST /deletion`: el retiro del producto usa `POST`
        porque su cuerpo lleva el motivo, y aquí no hay cuerpo que proteger. Un cuerpo, si
        llega, se ignora.

        **Solo el autor** (`RN-PM-027`), sin excepción: el superadministrador recibe `403`
        sobre una ajena. **No existe moderación.**

        **Retirar dos veces responde `404`**, no `409`: la reseña retirada no la devuelve
        nadie, de modo que «retirada» y «no existe» son lo mismo. Retirada la suya, la
        persona puede escribir otra, y el promedio del producto la deja de contar en el
        acto.
      operationId: delete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: commentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Reseña retirada.
        "400":
          description: Identificador mal formado (`VAL-001`)
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: "Autenticado sin el permiso `products:comment` (`AUTH-002`),\
            \ o **con él pero sin ser el autor** (`EX-002`)"
        "404":
          description: "La reseña no existe, ya está retirada o no es del producto\
            \ de la ruta (`EX-001`)"
    patch:
      tags:
      - Reseñas
      summary: Corregir la reseña propia
      description: |
        Corrige la puntuación, el texto o los dos. **Lo que no viene no cambia**, y
        **ningún campo admite el nulo explícito**: los dos son obligatorios. Un cuerpo sin
        ningún campo responde `400`, como en la edición del producto.

        **Solo el autor** (`RN-PM-027`). El permiso `products:comment` habilita la operación;
        ser el autor la autoriza, y son dos cosas distintas: un administrador con el
        permiso corrige las suyas y recibe `403` en las ajenas. **No existe moderación.**

        Primero «existe» (`404`) y después «es tuya» (`403`). Una reseña **retirada**
        responde `404` también a su autor: no se revive corrigiendo. La reseña debe ser
        **del producto de la ruta**; si no, `404`.

        **Se corrige aunque el producto ya no se venda.** Un cuerpo cuyos valores
        coinciden con los guardados responde `200` sin escribir nada y sin avanzar
        `updatedAt`.
      operationId: update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: commentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductCommentRequest"
      responses:
        "200":
          description: "La reseña corregida, con `updatedAt` avanzado si algo cambió\
            ."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductCommentResponse"
        "400":
          description: "Identificador mal formado (`VAL-001`), puntuación nula o fuera\
            \ de 1..5 (`VAL-002`, `VAL-003`), texto nulo, vacío o largo (`VAL-004`),\
            \ campos no admitidos (`VAL-006`) o cuerpo sin ningún campo (`VAL-005`)"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: "Autenticado sin el permiso `products:comment` (`AUTH-002`),\
            \ o **con él pero sin ser el autor** (`EX-002`)"
        "404":
          description: "La reseña no existe, está retirada o no es del producto de\
            \ la ruta (`EX-001`)"
  /api/v1/packages/{id}:
    get:
      tags:
      - Paquetes
      summary: Consultar el detalle de un paquete
      description: |
        El paquete con sus productos y **la cuenta hecha**: cada producto con su
        descuento y su `priceInPackage`, y `listPrice`, `price` y `savings` que
        cuadran con las líneas. **El precio se calcula en cada lectura** con el
        precio de catálogo **de hoy** de cada producto: corregir el precio de un
        producto cambia el paquete sin tocarlo, y un fijo que hoy supera su precio
        cuenta **cero**, nunca negativo. `exchange` es la conversión de `price` a la
        moneda de casa; nula si el paquete ya está en ella o no hay tasa.

        Es la lectura de administración: **devuelve todo**. Un producto inactivo o
        retirado dentro del paquete **se devuelve igual**, con su `status` y su
        `deleted`, y **sigue sumando** — esta es la única pantalla desde la que se
        arregla. Y `purchasePrice` de cada producto viaja, presente y nulo cuando
        no se conoce; la oferta y el hotlink no lo llevan.

        `offerable` dice si el paquete se puede ofrecer hoy, y `offerableReason` el
        **primer** motivo que lo impide, en un orden fijo: menos de dos productos,
        sin descripción, inactivo, retirado, **fuera de su vigencia** —«todavía no
        está vigente: empieza el …» o «la vigencia terminó el …», con la fecha—, y
        un producto inactivo o retirado —**nombrado por su código**—. Nulo cuando
        es ofrecible. `validFrom` y `validTo` viajan siempre, el fin nulo cuando es
        indefinido, y **el día de fin cuenta entero**: un paquete que termina hoy
        se ofrece hoy. «Hoy» es el día en UTC.

        **Un paquete retirado no es un `404`**: se devuelve con `deletedAt` y
        `deletionReason`, como el producto. Exige `packages:read`.
      operationId: detalle_3
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: El paquete con su cuenta hecha.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PackageDetailResponse"
        "400":
          description: Identificador inválido (`VAL-001`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PackageDetailResponse"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PackageDetailResponse"
        "403":
          description: Autenticado sin el permiso `packages:read` (`AUTH-002`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PackageDetailResponse"
        "404":
          description: El paquete no existe (`EX-001`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PackageDetailResponse"
    patch:
      tags:
      - Paquetes
      summary: Corregir un paquete
      description: |
        Corrige **nombre, descripción, alcance y las dos fechas de vigencia**
        (`validFrom`, `validTo`), por separado o juntos, y devuelve el detalle.
        Cada campo puede venir ausente —no se toca—, con valor, o **presente y
        nulo**: el nulo vacía la descripción y el fin de vigencia —que vuelve a
        indefinido— y **se rechaza** en nombre, alcance e inicio de vigencia, que
        son obligatorios. **La pareja de fechas resultante se comprueba entera**:
        corregir solo el inicio a una fecha posterior al fin que ya había responde
        `400`; quien quiera mover las dos las manda juntas.

        **El código y la moneda no se pueden modificar**, y enviarlos responde `400`
        —se rechazan, no se ignoran—. La moneda es la unidad en la que se suma el
        paquete: cambiarla dejaría los descuentos fijos expresados en otra cosa.

        **Vaciar la descripción de un paquete activo se permite**: no lo desactiva,
        pero lo saca de la oferta hasta que vuelva a tenerla, y el detalle lo dice
        en `offerableReason`. **Cerrar la vigencia es lo mismo con otra fecha**
        (`RN-PM-047`): `validTo` en ayer —o en hoy, para que sea el último día—
        retira el paquete de la oferta y del hotlink **sin desactivarlo**, y vaciar
        el fin lo vuelve a abrir. Cambiar el alcance de `AMBOS` o `HOTLINK` a
        `TIENDA` hace que el hotlink del paquete deje de resolver; la oferta no
        cambia.

        Un cuerpo sin cambios de valor responde `200` sin avanzar `updatedAt` ni
        auditar. Exige `packages:update`.
      operationId: corregir_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePackageRequest"
        required: true
      responses:
        "200":
          description: "El paquete corregido, con su cuenta hecha."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PackageDetailResponse"
        "400":
          description: "Identificador inválido, nombre vacío o de más de 150, alcance\
            \ nulo o fuera de dominio, cuerpo vacío, o `code`/`currencyId` presentes\
            \ (`VAL-001` a `VAL-005`, `EX-003`)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PackageDetailResponse"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PackageDetailResponse"
        "403":
          description: Autenticado sin el permiso `packages:update` (`AUTH-002`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PackageDetailResponse"
        "404":
          description: El paquete no existe o está retirado (`EX-001`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PackageDetailResponse"
        "409":
          description: El nombre ya lo usa otro paquete vivo (`EX-002`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PackageDetailResponse"
  /api/v1/packages/{id}/status:
    patch:
      tags:
      - Paquetes
      summary: Activar o desactivar un paquete
      description: |
        Cambia el estado del paquete y devuelve el detalle.

        **Activar exige descripción y al menos dos productos**, y los dos motivos
        van **juntos** en el mismo `409` cuando faltan a la vez. **No exige que los
        productos estén activos hoy**: eso lo mira la oferta cada vez, y un paquete
        activo con un producto inactivo dentro es un estado legítimo — el detalle lo
        devuelve `offerable: false` nombrando el producto.

        **Desactivar no tiene condiciones**: el paquete sale de la oferta y del
        hotlink, y sus productos no cambian.

        Pedir el estado que ya tiene responde `200` sin escribir ni auditar. Exige
        `packages:update`.
