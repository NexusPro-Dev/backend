  /api/v1/commission-rates/{id}:
    patch:
      tags:
      - Comisiones
      summary: Corregir el porcentaje de una tasa de rol
      description: |
        Corrige el **porcentaje**, que es lo único corregible.

        **Esta operación borra el pasado.** Las tasas de rol no tienen vigencia:
        pasar un `AGENTE` de 10 a 12 **borra el 10**. No hay dos filas contando
        cada una su parte; hay una que ahora dice otra cosa.

        Lo único que preserva lo ya pagado es que la liquidación haya copiado el
        porcentaje que aplicó — y esa liquidación **todavía no existe**.

        `percentage: null` se **rechaza**. **El rol no se corrige**, y enviarlo
        devuelve `400`: se rechaza y no se ignora, porque ignorarlo haría creer
        que el cambio se aplicó.

        **Si la tasa está asociada, revisa el tope de cien en TODOS sus
        productos a la vez** (`RN-CM-019`): si el nuevo valor dejaría a alguno
        pagando más del 100 % de sí mismo, la corrección se rechaza **entera**
        y devuelve `409` — ninguno de los productos cambia, ni siquiera los que
        sí cabían.
      operationId: corregir_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCommissionRateRequest"
        required: true
      responses:
        "200":
          description: Tasa corregida
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommissionRateResponse"
        "400":
          description: Datos inválidos o campos no corregibles
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommissionRateResponse"
        "403":
          description: Sin permiso
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommissionRateResponse"
        "404":
          description: "No existe, o está retirada"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommissionRateResponse"
        "409":
          description: El nuevo valor dejaría a algún producto asociado pagando más
            de cien
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommissionRateResponse"
  /api/v1/users/{id}/team:
    get:
      tags:
      - Usuarios
      summary: Consultar el superior y el equipo a cargo
      description: |
        Devuelve el superior inmediato y el **equipo directo** de la persona,
        paginado.

        **Un solo nivel, nunca el árbol descendente**, y **sin conteo
        indirecto**: `totalElements` cuenta a quienes reportan directamente.
        Devolver la rama completa publicaría de una vez la estructura de la
        empresa por un permiso de lectura de usuarios.

        **Cada persona lleva `roles`: TODOS los que porta**, con `id`, `code`
        y `name`, ordenados por código y **presentes aunque la lista vaya
        vacía**. Es el mismo objeto que devuelve `GET /api/v1/users` en cada
        fila. **Sustituye a `roleCode`** (10-09-2026), que traía uno solo y
        únicamente si era de la fuerza comercial: la cartera de clientes
        llegaba con el rol en nulo y era indistinguible de un vendedor sin rol.

        **`roles` es además el único filtro**, y acota **el equipo**. Se pasan
        **códigos**, varios admitidos —`?roles=AGENTE,CLIENTE` o repitiendo el
        parámetro—, y entra quien porte **alguno** de ellos. `totalElements`
        **cuenta lo filtrado**. Un código que no existe devuelve el equipo
        vacío con `200`, **no un error**: es el mismo criterio que el filtro
        por rol de `GET /api/v1/users`.

        **El filtro NO toca al superior ni a la persona consultada.** Los dos
        se devuelven igual aunque no porten ninguno de los roles pedidos, y eso
        es contrato: `supervisor` va **ausente**, no en nulo, **solo** cuando
        la persona es la cúspide comercial, que es lo que distingue «no depende
        de nadie» de «no se pudo resolver».

        **Ningún otro filtro.** Ni búsqueda por nombre, ni estado, ni país: el
        listado general de usuarios ya los tiene, y replicarlos aquí obligaría
        a mantener dos semánticas sincronizadas.

        **Sin historial de superiores.**

        Quien no pertenece a la fuerza comercial recibe `200` con la estructura
        vacía, no `404` ni `409` — **con sus roles a la vista**: no tener
        estructura comercial no es no tener roles.

        **El alcance es global** mientras la decisión D-22 siga abierta: quien
        posea el permiso ve el equipo de cualquiera, no solo el suyo.
      operationId: equipo
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: roles
        in: query
        description: "Códigos de rol que acotan el equipo. Varios admitidos, con semá\
          ntica O."
        required: false
        schema:
          type: array
          items:
            type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: "La estructura, con el equipo paginado y los roles de cada\
            \ persona. El filtro por roles acota el equipo y su total, nunca al superior."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommercialStructureResponse"
        "400":
          description: Identificador malformado o paginación fuera de límites (`VAL-003`)
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: Autenticado sin `users:read` (`AUTH-002`)
        "404":
          description: La persona no existe o está eliminada (`VAL-002`)
        "500":
          description: Fallo no controlado (`ERR-500`)
  /api/v1/users/{id}/broker-accounts:
    get:
      tags:
      - Usuarios
      summary: Consultar las cuentas de broker de una persona
      description: |
        Devuelve las cuentas de broker de esa persona: **broker, identificador
        de cuenta, nombre de usuario en el broker y estado**, ordenadas por
        nombre de broker e identificador de cuenta.

        **Quién puede consultarlas** (`RN-SP-046`): **su superior comercial
        vigente**, sin ningún permiso, o quien traiga **`broker-accounts:read`**
        sobre cualquiera. Es la primera lectura del sistema cuyo alcance sale
        de la estructura comercial, y **solo alcanza a esta**.

        **Quien no es ninguna de las dos cosas recibe `404`, no `403`**, y es
        deliberado: el mismo `404` que si la persona no existiera. Un `403`
        dejaría a cualquier vendedor recorrer identificadores y averiguar
        cuáles corresponden a personas reales. Los dos cuerpos son idénticos.

        **Quien FUE su superior y ya no lo es recibe `404`**: el historial de
        la estructura no concede lectura.

        **El titular NO ve aquí sus propias cuentas** salvo que traiga el
        permiso: esta lectura se definió sobre el equipo.

        **Una persona sin cuentas devuelve `200` con la colección vacía**, no
        `404`: solo el registro por un enlace de beca obliga a declararlas.

        **Hoy el estado es siempre `REGISTER`**, y no es un fallo: quien mueve
        una cuenta a `FIRST_DEPOSIT` es el webhook del broker, que todavía no
        existe.

        **`brokerUsername` llega en nulo** mientras el broker no lo haya
        confirmado, y el campo **está presente**: su nulo significa «aún no
        confirmado», no «sin nombre».

        **No se pagina**: una persona tiene unas pocas cuentas. El listado
        paginado es `GET /api/v1/users/me/team/broker-accounts`.
      operationId: cuentasDeBrokerDe
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: "Las cuentas de la persona, ordenadas. Vacía si no declaró\
            \ ninguna."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BrokerAccountsResponse"
        "400":
          description: Identificador malformado (`VAL-001`)
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "404":
          description: "La persona no existe, está eliminada, **o el actor no es su\
            \ superior vigente ni posee `broker-accounts:read`** (`VAL-002`). Los\
            \ tres casos responden lo mismo, a propósito."
        "500":
          description: Fallo no controlado (`ERR-500`)
  /api/v1/users/me/team/broker-accounts:
    get:
      tags:
      - Usuarios
      summary: Consultar las cuentas de broker de mi equipo
      description: |
        Devuelve, **paginadas**, las cuentas de broker de todas las personas
        que dependen **directamente** del actor, **cada fila con su titular**.

        **No hay identificador en la ruta y no lo habrá**: el conjunto de datos
        lo determina el sistema a partir de quién pregunta. Quien deba ver las
        cuentas de otra persona usa `GET /api/v1/users/{id}/broker-accounts`
        con `broker-accounts:read`.

        **No exige ningún permiso**, solo estar autenticado: el alcance lo pone
        la estructura comercial (`RN-SP-046`). Quien **no tiene equipo** recibe
        `200` con la página vacía, no `404` ni `403`.

        **Un solo nivel**, el equipo directo. Las cuentas de quien depende de
        un subordinado del actor **no aparecen**: devolver la rama completa
        publicaría de una vez la estructura de la empresa.

        **Es un listado de CUENTAS y no de personas.** Quien está en el equipo
        y no declaró ninguna cuenta **no aparece**, y quien declaró dos aparece
        **dos veces**. Quién hay en el equipo lo responde
        `GET /api/v1/users/{id}/team`.

        **Filtros, ambos opcionales y combinables con Y:**

        - `status` — `REGISTER` o `FIRST_DEPOSIT`. **Cualquier otro valor es
          `400`**, no una página vacía: una página vacía sería indistinguible
          de «nadie está en ese estado».
        - `brokerId` — un broker del catálogo. **Un identificador inexistente
          devuelve la página vacía sin error**, al revés que `status`: es una
          pregunta legítima con respuesta vacía.

        `totalElements` **cuenta lo filtrado**.

        **Hoy todas las cuentas están en `REGISTER`**, y no es un fallo de esta
        consulta: quien mueve una cuenta a `FIRST_DEPOSIT` es el webhook del
        broker, que todavía no existe. Mientras no exista, ninguna cuenta tiene
        depósito confirmado.

        **`brokerUsername` llega en nulo** mientras el broker no lo haya
        confirmado, y el campo **está presente**: su nulo significa «aún no
        confirmado», no «sin nombre».
      operationId: cuentasDeBrokerDelEquipo
      parameters:
      - name: status
        in: query
        description: "Estado de la cuenta: `REGISTER` o `FIRST_DEPOSIT`."
        required: false
        schema:
          type: string
      - name: brokerId
        in: query
        description: Broker del catálogo. Uno inexistente devuelve la página vacía.
        required: false
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: "Página de cuentas del equipo directo, ordenada por titular,\
            \ broker e identificador de cuenta. Vacía si el actor no tiene equipo."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseTeamBrokerAccountItem"
        "400":
          description: "`status` fuera de `REGISTER`/`FIRST_DEPOSIT` (`VAL-001`),\
            \ `brokerId` malformado o paginación fuera de límites (`VAL-003`)"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "500":
          description: Fallo no controlado (`ERR-500`)
  /api/v1/products/available:
    get:
      tags:
      - Productos
      summary: Consultar la oferta disponible para uno mismo
      description: |
        Devuelve lo que **quien llama** puede comprar hoy, y no el catálogo.

        **No admite ningún parámetro**: ni de persona, ni de filtro, ni de
        paginación. El actor sale del token, de modo que no hay forma de
        preguntar qué puede comprar otra persona.

        **Exige `products:sale`**, un permiso propio de esta vista y no
        `products:read` — ese abre el catálogo administrativo entero, lo
        inactivo, lo retirado y el motivo del retiro, para que alguien pudiera
        ver tres líneas.

        **Solo lo activo.** Ni lo inactivo ni lo retirado aparecen aquí,
        aunque el catálogo de `RF-PM-002` sí los muestre a quien administra.

        **Upgrades: los declarados DESDE la membresía vigente de quien mira**,
        y ninguno más. La coincidencia es exacta: no se comparan niveles ni se
        recorre la cadena. Quien registró el producto ya decidió a quién va
        dirigido.

        Eso incluye **todos** los declarados desde ahí y no solo el inmediato
        —quien está en el peldaño más bajo elige cuánto saltar, y el precio de
        cada uno ya expresa el salto—, y llegan ordenados **del salto más
        corto al más largo**.

        **La RENOVACIÓN entra aquí**, y va primera: un producto `X → X`
        declarado desde su propia membresía es el salto de longitud cero. Lo
        que vende es **tiempo** —su `validityDays`— y no un cambio de nivel.

        **Un upgrade hacia el nivel que ya se tiene NO se ofrece cuando su
        origen no es el suyo**: sería el salto de otra persona que acaba donde
        quien mira ya está. Y **ninguna bajada** llega hasta aquí, aunque este
        filtro ya no la mire: lo impide `RN-PM-017` **al registrar**, porque un
        producto declarado desde mi membresía no puede apuntar por debajo.

        **Bots: todos los activos, para cualquiera.** No dependen del nivel de
        quien mira ni de que tenga uno.

        **Publica `scope` e `implementation` de cada producto y NO filtra por
        ninguno de los dos.** El alcance no puede filtrar aquí: `HOTLINKS`
        incluye `TIENDA`, de modo que los dos valores llegan a esta vista y un
        filtro devolvería siempre lo mismo que no ponerlo. La implementación
        viaja para que quien compra sepa **antes de pagar** si lo que se lleva
        se le entrega en el acto.

        **Quien no tiene membresía vigente —incluida la vencida— no ve ningún
        upgrade**, y sí todos los bots. No hay nivel desde el que subir, y
        ofrecerle el primero sería venderle una membresía, que no es lo que un
        upgrade hace.

        **Quien está en la cima recibe la lista de upgrades vacía.** No es un
        error ni un mensaje especial: es una lista vacía.

        **El precio es igual para todos**: un importe distinto según quién
        mira sería un descuento, y los descuentos son promociones, que están
        fuera de alcance.

        **Vienen LOS DOS importes** (`RN-PM-024`, reescrita el 08-09-2026):
        `price` es el del sistema —el que la venta cobra— y `publicPrice` el
        que el producto anuncia, **nulo y presente** cuando no lo declara.
        Hasta esa fecha esta respuesta publicaba **uno solo**, resuelto por la
        consulta, y quien la leía no sabía cuál de los dos era.

        Y viene **`exchange`**, la conversión a la moneda por omisión con la
        tasa vigente hoy, calculada sobre el importe **que se muestra** —el
        público si existe y el del sistema si no—. **Presente y nula** cuando
        no hay nada que convertir.

        **Quien construya la pantalla de compra tiene que saberlo**: el
        importe que confirma la venta es `price`, y puede no ser el que se le
        está enseñando a quien compra.

        Las dos colecciones viajan **envueltas en un objeto** y no como
        arreglos en la raíz: hoy la oferta no se pagina, y así el día que
        haya que paginarla no romperá a ningún cliente.
      operationId: oferta
      responses:
        "200":
          description: "La oferta del actor, con el nivel desde el que mira."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OfferResponse"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: Autenticado sin el permiso `products:sale` (`AUTH-002`)
        "500":
          description: Fallo no controlado (`ERR-500`)
  /api/v1/product-commission-rates:
    get:
      tags:
      - Comisiones
      summary: "Consultar qué comisiona un producto, y a qué rol"
      description: |
        Devuelve una entrada **por cada rol** que cobra comisión por ese producto,
        con el porcentaje ya resuelto.

        **Una lista vacía significa que ese producto no paga comisión a nadie**
        — ni siquiera a los roles que tienen tasa en el catálogo, si nadie la
        asoció (`RN-CM-012`).

        **Esto no resuelve la comisión de una persona.** Una tasa personalizada
        gana sobre todas estas y no aparece aquí, porque no se asocia a productos.
        Para saber qué cobra alguien concreto, use
        `GET /api/v1/commissions/effective`.
      operationId: porProducto
      parameters:
      - name: productId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Las asociaciones del producto
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductAssociationResponse"
        "400":
          description: Parámetros inválidos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductAssociationResponse"
        "403":
          description: Sin permiso
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductAssociationResponse"
  /api/v1/permissions:
    get:
      tags:
      - Permisos
      summary: Consultar el catálogo de permisos
      description: |
        Devuelve el catálogo completo, sin paginar, ordenado por recurso y acción.

        Los tres filtros son opcionales y ninguno se valida: un valor que no
        corresponda a ningún permiso produce una colección vacía, no un error.
        Los parámetros de paginación no se admiten y se ignoran.
      operationId: list
      parameters:
      - name: request
        in: query
        description: Filtro por recurso. Coincidencia exacta.
        required: true
        schema:
          $ref: "#/components/schemas/ListPermissionsRequest"
      responses:
        "200":
          description: Catálogo devuelto. La colección puede venir vacía.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PermissionCatalogResponse"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PermissionCatalogResponse"
        "403":
          description: Autenticado sin el permiso `permissions:read` (`AUTH-002`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PermissionCatalogResponse"
        "500":
          description: Fallo no controlado (`ERR-500`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PermissionCatalogResponse"
  /api/v1/permissions/{id}:
    get:
      tags:
      - Permisos
      summary: Consultar el detalle de un permiso
      description: |
        Devuelve qué habilita un permiso concreto: código, recurso, acción,
        nombre y descripción. Es la consulta de apoyo a la asignación de
        permisos a un rol, y se llega a ella desde el catálogo.

        **Se accede solo por identificador, nunca por código**: admitir dos
        formas de direccionar el mismo recurso obliga a distinguir en cada
        petición cuál llegó. El código es la vía para *encontrar* el permiso, y
        para eso está el filtro del catálogo.

        **No devuelve los roles que lo declaran** —es el recorrido inverso y
        corresponde a una consulta propia— ni marcas temporales: en una tabla
        que solo cambia por migración, esas fechas dicen cuándo se desplegó una
        migración y no cuándo ocurrió algo de negocio.

        `description` puede venir vacía, y entonces se devuelve como `null`,
        nunca omitida.
      operationId: detail
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Detalle del permiso.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PermissionResponse"
        "400":
          description: El identificador no es un UUID en forma canónica (`VAL-001`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PermissionResponse"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PermissionResponse"
        "403":
          description: Autenticado sin el permiso `permissions:read` (`AUTH-002`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PermissionResponse"
        "404":
          description: No existe un permiso con ese identificador (`EX-001`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PermissionResponse"
        "500":
          description: Fallo no controlado (`ERR-500`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PermissionResponse"
  /api/v1/payment-methods:
    get:
      tags:
      - Métodos de pago
      summary: Consultar los métodos de pago
      description: |
        Devuelve los métodos de pago **activos y de visibilidad `PUBLICO`**, sin
        paginar y ordenados por código.

        **Es una consulta PÚBLICA** (`RN-MV-024`): responde **sin token**, porque
        el formulario de registro por enlace elige con qué se paga antes de que
        exista la cuenta. **Con sesión devuelve exactamente lo mismo** — no hay
        un catálogo para el anónimo y otro para quien ha entrado, y no existe
        parámetro que cambie lo que sale.

        **Lo que NO devuelve, y no hay forma de pedirlo**: ni los métodos
        desactivados —un método retirado no se puede usar en una venta nueva— ni
        los de visibilidad `INTERNO` (`RN-MV-023`). Estos últimos **sirven para
        pagar y no los elige ninguna persona**: los pone el sistema. Es el caso
        de `GRATIS`, con el que se anotan las ventas de importe cero
        (`RN-MV-022`): quien depure una de esas verá un `paymentMethodId` que
        **este catálogo no resuelve**, y eso es deliberado.

        **La respuesta no publica el campo de visibilidad.** Si todo lo que sale
        es `PUBLICO`, declararlo sugeriría que puede salir otra cosa.

        **`excludedCountries` dice dónde NO vale cada medio.** Una lista vacía
        significa que vale en todos los países, y el campo **viaja siempre**:
        no hay que distinguir «sin exclusiones» de «no vino el campo».

        **Esta restricción es informativa y el servidor NO la aplica.** Registrar
        una venta con un método excluido en algún país **se registra con
        normalidad**: quien decide qué ofrecer es el cliente que consume esta
        respuesta. El servidor no sabe de qué país es quien compra — ninguna
        persona del sistema tiene país todavía.

        **No admite parámetros**, y en particular no admite un país: filtrar aquí
        haría creer que el servidor sabe cuál corresponde.

        **Está acotada por origen** —120 peticiones por minuto, con cubo propio—,
        como los demás catálogos públicos: superar la cota responde `429`.
      operationId: consultar_2
      responses:
        "200":
          description: El catálogo de métodos de pago activos y públicos. Se responde
            igual con token y sin él.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PaymentMethodCatalogResponse"
        "429":
          description: Se superó la cota de peticiones por origen (120 por minuto).
            La cabecera `Retry-After` dice cuánto esperar.
  /api/v1/movements/mine:
    get:
      tags:
      - Movimientos
      summary: Consultar los movimientos propios
      description: |
        Devuelve **los movimientos en los que usted participó**, paginados y del más
        reciente al más antiguo.

        **«Propio» son DOS papeles.** Un movimiento lleva a quien recibe lo comprado y a
        quien lo vendió, y usted puede ser cualquiera de los dos — o **los dos a la vez**,
        si compró para sí mismo algo que se le atribuye. Cada movimiento dice en qué papel
        aparece usted con `role`: `BUYER`, `SELLER` o `BOTH`. El que es las dos cosas
        **aparece una sola vez**.

        **No hay forma de preguntar por otra persona**, ni indicándola ni teniendo
        permisos: quien pregunta sale de la credencial. Consultar las ventas de terceros es
        otra operación, con su permiso.

        **Las líneas no viajan aquí.** Una venta puede llevar varias, y meterlas
        multiplicaría la respuesta por un dato que solo se mira al abrir uno: están en el
        detalle.

        **El vendedor puede ser nulo**, y viaja igual: es el caso normal de quien no cuelga
        de ningún vendedor.

        El orden es fijo y no se puede cambiar. `status` filtra por estado.
      operationId: mios
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: status
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: La página de movimientos propios.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseMyMovement"
        "400":
          description: Paginación inválida (`VAL-002`) o estado no admitido (`VAL-003`)
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "500":
          description: Fallo no controlado (`ERR-500`)
  /api/v1/movements/mine/{id}:
    get:
      tags:
      - Movimientos
      summary: Consultar el detalle de un movimiento propio
      description: |
        Devuelve **lo mismo que devuelve registrar una venta**, con sus líneas: qué
        productos, cuántos, a qué precio y con qué vigencia. Quien registró una venta y
        quien la consulta después ven la misma forma.

        **Un movimiento que no es suyo responde `404`**, exactamente igual que uno que no
        existe. No es un descuido: un `403` confirmaría que el identificador existe.
      operationId: mio
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: "El movimiento, con sus líneas."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SaleResponse"
        "400":
          description: Identificador malformado (`VAL-001`)
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "404":
          description: No existe **o no es suyo** (`VAL-002`). Las dos son la misma
            respuesta
        "500":
          description: Fallo no controlado (`ERR-500`)
  /api/v1/memberships/{id}:
    get:
      tags:
      - Membresías
      summary: Consultar el detalle de una membresía
      description: |
        Devuelve la membresía con sus dos vecinos inmediatos, expandidos.

        Los vecinos llegan solo hasta el primer grado y no traen los suyos: la
        cadena entera se obtiene con el listado.
      operationId: consultarDetalle
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Detalle devuelto.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MembershipDetailResponse"
        "400":
          description: El identificador no es un UUID (`VAL-001`)
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: Autenticado sin `memberships:read` (`AUTH-002`)
        "404":
          description: No existe membresía con ese identificador (`EX-001`)
        "500":
          description: Fallo no controlado (`ERR-500`)
  /api/v1/hotlinks/{username}/{code}:
    get:
      tags:
      - Hotlinks
      summary: Consultar un hotlink
      description: |
        Devuelve, **sin token**, el producto que el enlace señala y el **nombre
        y apellido** de quien lo reparte.

        **Es público por decisión, no por definición.** Las otras cinco rutas
        públicas del sistema lo son porque quien las llama no puede portar
        todavía un token; esta lo es porque un enlace se abre antes de
        registrarse.

        **Solo publica productos activos y de alcance `HOTLINKS`**, y solo el
        nombre de quien porta un rol de tipo `VENDEDOR`. Ni correo, ni
        identificador, ni estado, ni roles.

        **De la membresía se publican tres campos** —código, nombre y color—,
        y no los cinco que devuelven los otros endpoints: el identificador no
        sirve a quien no puede llamar a nada más, y el nivel publicaría la
        forma de la cadena comercial sin token.

        **El precio llega en la moneda del producto y, si hay tasa vigente,
        convertido a la moneda por omisión.** `rate` viaja como **cadena**
        porque tiene ocho decimales y un número JSON pasa por coma flotante en
        cualquier cliente JavaScript.

        **Vienen LOS DOS importes** (`RN-PM-024`, 08-09-2026): `price` es el
        del sistema —el que se cobra— y `publicPrice` el que el producto
        anuncia, **nulo y presente** cuando no lo declara. Hasta esa fecha
        viajaba uno solo. **La conversión se calcula sobre el que se muestra**
        —el público si existe y el del sistema si no—, y no sobre los dos.

        **La conversión es INFORMATIVA**: lo que se cobra no es ese número. Una
        venta va en una sola moneda y congela su importe al registrarse; esta
        conversión se calcula al vuelo, cambia el día que cambie la tasa y **no
        reserva nada**. Cuando no hay tasa vigente —o el producto ya está en la
        moneda de casa— `exchange` llega **presente y nulo**, y el producto se
        devuelve igual.

        **Todo lo que no procede responde el MISMO `404`**: usuario
        inexistente, persona que no es vendedora, código inexistente, producto
        inactivo, retirado o de alcance `TIENDA`. **No dice cuál falló**, y esa
        uniformidad es deliberada — distinguirlos convertiría el enlace en un
        oráculo que dice quién existe.
      operationId: hotlink
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
      - name: code
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "El enlace, con su producto y su vendedor."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/HotlinkResponse"
        "404":
          description: El enlace no lleva a ninguna parte. **El mismo cuerpo en los
            seis casos** (`EX-001`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/HotlinkResponse"
        "429":
          description: Demasiadas peticiones desde ese origen
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/HotlinkResponse"
  /api/v1/document-types:
    get:
      tags:
      - Tipos de documento
      summary: Consultar el catálogo de tipos de documento
      description: |
        Devuelve los documentos de identidad con los que una persona puede
        registrarse, con su **nombre** y su **abreviación**.

        **El catálogo contiene solo documentos de persona mayor de edad**, y esa
        es la validación entera: no hay ninguna marca que distinga cuáles sí y
        cuáles no, porque los que no están **no están**. Registrar a un menor no
        se rechaza — no se puede expresar.

        **No se administra por API** (`RN-SP-036`): no hay alta, ni edición, ni
        eliminación, ni cambio de estado. Se puebla por migración, y lo que deja
        de admitirse se retira también por migración. Es la asimetría deliberada
        con los catálogos de países y monedas, que sí tienen operación para
        cambiar su estado.

        **No se pagina**: son unos pocos elementos, y partirlos obligaría a dos
        llamadas para pintar un desplegable.
      operationId: listar_5
      parameters:
      - name: includeInactive
        in: query
        required: false
        schema:
          type: boolean
      responses:
        "200":
          description: "Catálogo completo, ordenado por nombre"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DocumentTypeCatalogResponse"
        "401":
          description: Token ausente o inválido
        "403":
          description: El actor no posee `document-types:read`
        "500":
          description: Fallo no controlado (`ERR-500`)
  /api/v1/currencies:
    get:
      tags:
      - Monedas
      summary: Consultar el catálogo de monedas
      description: |
        Devuelve el catálogo completo, sin paginar, ordenado por código.

        `decimalPlaces` es el campo del que depende el redondeo de todo cálculo
        financiero: cero es un valor legítimo y el campo nunca es nulo.

        Las monedas inactivas no aparecen salvo que se pidan con
        `includeInactive=true`, que **añade** a las activas en lugar de
        sustituirlas.
      operationId: consultar_3
      parameters:
      - name: peticion
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/ListCurrenciesRequest"
      responses:
        "200":
          description: "Catálogo devuelto. Siempre es una colección, aunque tenga\
            \ un solo elemento."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CurrencyCatalogResponse"
        "400":
          description: El parámetro de inclusión no es booleano
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: Autenticado sin el permiso de lectura de monedas (`AUTH-002`)
        "500":
          description: Fallo no controlado (`ERR-500`)
  /api/v1/commissions/effective:
    get:
      tags:
      - Comisiones
      summary: Consultar la comisión efectiva
      description: |
        Responde **cuánto le corresponde a una persona por vender un producto un
        día concreto**, y **por qué**: devuelve la tasa que ganó y de cuál de las
        dos piezas salió.

        **La precedencia son dos niveles, y los dos exigen ASOCIACIÓN:** si la
        persona tiene una tasa **personalizada** vigente ese día **asociada a ese
        producto**, es esa. Si no, la que su **rol vendedor** tenga **asociada a
        ese producto**. Si ninguna, no hay tarifa.

        **Hasta el 11-09-2026 el primer nivel no miraba el producto**: una
        excepción tapaba el catálogo entero de su titular y el segundo nivel no
        llegaba a consultarse nunca. Desde esa fecha las dos clases de tasa se
        asocian igual, y `RN-CM-012` —ninguna tasa rige hasta que se asocia—
        deja de tener excepción.

        **Tres desenlaces, y ninguno es un error:**

        - `RESUELTA`: hay tasa. `source` dice si fue `PERSONALIZADA` o `ROL`. El
          porcentaje puede ser **cero**, y eso significa «no comisiona» — es una
          decisión declarada.
        - `SIN_TARIFA`: la persona vende y **no hay tasa aplicable**. La causa más
          probable **no es que nadie la declarara**, sino que **nadie la asoció** a
          ese producto: la tasa puede existir en el catálogo y no regir. El
          porcentaje llega **nulo y presente**, nunca cero.
        - `NO_COMISIONA`: la persona **no porta rol vendedor** y **tampoco tiene
          tasa personalizada**.

        **`roleId` puede llegar nulo con `outcome` igual a `RESUELTA`**, y no es
        incoherente: significa que ganó la tasa personalizada de alguien que ya no
        porta rol vendedor. Las personalizadas dejaron de llevar rol el
        01-09-2026, y **siguen rigiendo aunque su titular deje de vender**.

        **Nulo y cero no son lo mismo**, y quien consuma esto va a pagar con esa
        cifra.

        Sin `onDate`, se resuelve con la fecha de hoy. Un producto **retirado** se
        resuelve con normalidad: preguntar qué se pagaba por algo que ya no se
        vende es legítimo.
      operationId: efectiva
      parameters:
      - name: userId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: productId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: onDate
        in: query
        required: false
        schema:
          type: string
          format: date
      responses:
        "200":
          description: Cualquiera de los tres desenlaces
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EffectiveCommissionResponse"
        "400":
          description: Parámetros inválidos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EffectiveCommissionResponse"
        "403":
          description: Sin permiso
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EffectiveCommissionResponse"
        "422":
          description: La persona o el producto no existen
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EffectiveCommissionResponse"
  /api/v1/brokers:
    get:
      tags:
      - Brokers
      summary: Consultar el catálogo de brokers
      description: |
        Devuelve los brokers con los que opera la plataforma, **ordenados por
        nombre**.

        **Un broker guarda de momento solo su nombre**, y eso tiene una
        consecuencia que conviene conocer antes de integrarse: **el nombre es la
        clave de negocio**, no un texto descriptivo. No hay un `code` estable
        frente a un cambio de nombre comercial — quien necesite referenciar un
        broker debe hacerlo por su **identificador**.

        **No se administra por API** (`RN-SP-039`): no hay alta, ni edición, ni
        eliminación, ni cambio de estado. Se puebla por migración, igual que los
        catálogos de monedas y de tipos de documento, y cada alta queda en el
        historial del repositorio en lugar de en una fila que alguien insertó.

        **Puede responder la colección vacía**, y eso no es un fallo: es el
        estado de un catálogo que todavía no se ha sembrado.

        **No se pagina**: son unos pocos elementos y partirlos obligaría a dos
        llamadas para pintar un desplegable.
      operationId: listar_6
      parameters:
      - name: includeInactive
        in: query
        required: false
        schema:
          type: boolean
      responses:
        "200":
          description: "Catálogo, ordenado por nombre"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BrokerCatalogResponse"
        "401":
          description: Token ausente o inválido
        "403":
          description: El actor no posee `brokers:read`
        "500":
          description: Fallo no controlado (`ERR-500`)
  /api/v1/broker-accounts:
    get:
      tags:
      - Cuentas de broker
      summary: Consultar y filtrar todas las cuentas de broker
      description: |
        Devuelve **todas** las cuentas de broker del sistema, paginadas y con
        su titular en cada fila. **Sin ningún filtro devuelve el sistema
        entero**: es lo que `broker-accounts:read` significa.

        **`supervisorId` devuelve LA RED ENTERA de esa persona, en
        profundidad** (`RN-SP-047`): sus subordinados, los subordinados de
        estos, y así hasta abajo. **No es un solo nivel**, al revés que
        `GET /api/v1/users/{id}/team` y que
        `GET /api/v1/users/me/team/broker-accounts` — aquellos se autorizan
        por la estructura y por eso se acotan; este se autoriza por permiso,
        que ya alcanza a todos, de modo que la profundidad **ahorra recorrer
        el árbol y no concede nada**.

        **La raíz NO se incluye en su red.** Preguntar por la red de alguien
        devuelve la de los suyos; sus propias cuentas se piden con `userId`, y
        **los dos filtros se combinan** — juntos responden «de la red de este
        vendedor, las cuentas de esta persona».

        **Solo la estructura vigente.** Quien dejó la red ayer no aparece, ni
        los que colgaban de él por esa vía. Y una persona **eliminada** no
        aparece **sin que su rama se corte**: quienes dependían de ella siguen
        saliendo.

        **Filtros, todos opcionales y combinables con Y:**

        - `supervisorId` — la red, en profundidad.
        - `userId` — una persona concreta.
        - `status` — `REGISTER` o `FIRST_DEPOSIT`. **Cualquier otro valor es
          `400`**, no una página vacía.
        - `brokerId` — un broker del catálogo.
        - `search` — fragmento de **número de cuenta**, nombre de usuario,
          correo o nombre completo. Sin acentos y sin distinguir mayúsculas.
        - `from` / `to` — **cuándo se declaró la cuenta**. Son **instantes con
          zona**, no fechas sueltas, y el rango es **semiabierto**: incluye
          `from`, excluye `to`. `from` posterior a `to` es `400`.

        **Un identificador inexistente devuelve la página vacía sin error** —
        `supervisorId`, `userId` y `brokerId` no se validan contra su tabla—,
        al revés que `status` y que el rango: aquellos son preguntas legítimas
        con respuesta vacía y estos son preguntas mal escritas.

        `totalElements` **cuenta lo filtrado**.

        **La respuesta lleva además un `summary` con TRES totales y sus
        desgloses por broker**, los tres con la misma forma —un `total` y un
        `byBroker`—:

        - `summary.accounts` — cuántos registros cumplen el filtro. Su
          `total` es **el mismo número que `totalElements`**, y sale de la
          misma consulta: no pueden discrepar.
        - `summary.register` — cuántos de esos están en `REGISTER`.
        - `summary.firstDeposit` — cuántos de esos están en `FIRST_DEPOSIT`.

        **`accounts` es siempre `register` + `firstDeposit`**, total a total y
        broker a broker. La redundancia es deliberada: van los dos estados
        para no obligar a restar, y va el total porque es la pregunta que más
        se hace.

        **El resumen respeta TODOS los filtros, incluido `status`**, y de ahí
        sale lo único que hay que saber antes de pintarlo: **con
        `?status=REGISTER`, `summary.firstDeposit.total` vale SIEMPRE cero**,
        y con `?status=FIRST_DEPOSIT` vale siempre el total. **Ese cero no
        significa «nadie ha depositado»: significa «no pediste ninguno».** Un
        tablero que lo enseñe sin decirlo miente; para ver el embudo completo,
        consulte **sin** el filtro `status`.

        **`byBroker` trae TODOS los brokers del catálogo**, ordenado por
        nombre y **con cero donde el filtro no deja ninguna**: su longitud
        **no cambia** al filtrar, de modo que las columnas de una tabla se
        arman una vez y no bailan. Un broker **desactivado sigue apareciendo**
        — apagarlo no borra lo que ya se declaró en él. Los tres desgloses
        **suman exactamente** su `total`.

        **Con la página vacía el resumen va en ceros**, no ausente: el
        `byBroker` sigue trayendo el catálogo entero, todo a cero.

        **La fila es idéntica campo por campo a la de
        `GET /api/v1/users/me/team/broker-accounts`**, a propósito: las dos
        pantallas se pintan con el mismo componente. **Lo que aquella no
        lleva es el `summary`**: el resumen se pidió para el listado de
        administración.

        **Hoy todas las cuentas están en `REGISTER`**: quien mueve una a
        `FIRST_DEPOSIT` es el webhook del broker, que todavía no existe.

        **Esta ruta no sustituye a `GET /api/v1/users/{id}/broker-accounts`**,
        que existe para **el superior comercial sin permiso**.
      operationId: listar_7
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: supervisorId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: userId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: brokerId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: search
        in: query
        required: false
        schema:
          type: string
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
      responses:
        "200":
          description: "Página de cuentas, ordenada por titular, broker e identificador\
            \ de cuenta, **con su resumen**. Vacía —y el resumen en ceros— si ningú\
            n registro cumple el filtro."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BrokerAccountsPage"
        "400":
          description: "`status` fuera de `REGISTER`/`FIRST_DEPOSIT`, `from` posterior\
            \ a `to`, identificador malformado (`VAL-001`) o paginación fuera de lí\
            mites (`VAL-003`)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BrokerAccountsPage"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BrokerAccountsPage"
        "403":
          description: Autenticado sin `broker-accounts:read` (`AUTH-002`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BrokerAccountsPage"
        "500":
          description: Fallo no controlado (`ERR-500`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BrokerAccountsPage"
  /api/v1/broker-accounts/indicators:
    get:
      tags:
      - Cuentas de broker
      summary: Consultar los indicadores de la red comercial
      description: |
        Devuelve **el árbol de la fuerza comercial**, cada nodo con dos
        bloques de números: `own` —lo que cuelga **directamente** de esa
        persona— y `network` —esa persona **y todo lo que cuelga de ella**, a
        cualquier profundidad—.

        **La regla es una sola en todos los niveles**: el `network` de alguien
        es su `own` más la suma de los `network` de sus hijos. Un agente
        recibe lo de sus clientes directos; un director, lo suyo más lo de sus
        agentes; un manager, lo suyo más lo de sus directores.

        **NO SUME LA COLUMNA `network` DE UNA LISTA.** El `network` de un
        director **ya contiene** el de sus agentes, de modo que sumar totales
        de distintos niveles cuenta dos veces. Para agregar, sume `own`; para
        leer el total de una rama, use su `network`.

        **Qué cuenta como uno:** `accounts` cuenta **cuentas** y `consumers`
        cuenta **personas**, y no tienen por qué coincidir — un cliente con
        dos cuentas es una persona y dos cuentas. **Solo cuentan las cuentas
        de consumidores**: la cuenta personal de un vendedor no entra en
        ningún indicador.

        **Los consumidores no son nodos.** Aportan el número y no aparecen: el
        árbol es de la fuerza comercial.

        **`conversion` es `ftd / accounts`, un cociente entre 0 y 1 —no un
        porcentaje— y es NULA cuando no hay cuentas**, no cero: cero se lee
        como «nadie convirtió» y la verdad sería «no hay nada que convertir».
        Se recalcula en cada nodo sobre sus propios totales; **no es el
        promedio de las de sus hijos**.

        **`unassigned` es lo que hace que los números cuadren**: las cuentas
        de consumidores que no cuelgan de ningún vendedor no entran en ningún
        nodo. Se cumple que `totals` + `unassigned` es igual al
        `totalElements` de `GET /api/v1/broker-accounts` sin filtros. Se omite
        cuando se pide una rama con `rootId`, donde no significa nada.

        **`rootId` acota el árbol a esa rama e INCLUYE a la persona como
        raíz**, al revés que el `supervisorId` de `GET /api/v1/broker-accounts`:
        allí se piden las cuentas de su red —y las suyas no son de su red— y
        aquí se pide el nodo que lleva sus números.

        **Hoy `ftd` será cero en todas partes** y el embudo se verá entero en
        `pending`: quien mueve una cuenta a `FIRST_DEPOSIT` es el webhook del
        broker, que todavía no existe. Es el estado real, no un fallo del
        indicador.
      operationId: indicadoresDeLaRed
      parameters:
      - name: rootId
        in: query
        description: "Acota el árbol a la rama de esa persona, ella incluida."
        required: false
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: "El árbol, con los totales y lo no atribuido. `nodes` vací\
            o si no hay fuerza comercial."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/NetworkIndicatorsResponse"
        "400":
          description: '`rootId` malformado (`VAL-001`)'
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/NetworkIndicatorsResponse"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/NetworkIndicatorsResponse"
        "403":
          description: Autenticado sin `broker-accounts:read` (`AUTH-002`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/NetworkIndicatorsResponse"
        "404":
          description: "`rootId` no designa a nadie de la fuerza comercial, o está\
            \ eliminado (`VAL-002`)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/NetworkIndicatorsResponse"
        "500":
          description: Fallo no controlado (`ERR-500`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/NetworkIndicatorsResponse"
  /api/v1/audit/security:
    get:
      tags:
      - Auditoría
      summary: Consultar la auditoría de seguridad
      description: |
        Entradas, bloqueos, cambios de privilegio y denegaciones de
        autorización, del más reciente al más antiguo.

        **Esta consulta se registra a sí misma.** Cada llamada deja un evento
        de seguridad con quién la hizo, cuándo y **con qué filtros**: en este
        registro, el acto de mirar es en sí mismo información de seguridad — y
        quién revisó los accesos de una cuenta ajena es exactamente la clase de
        hecho que conviene conservar. Es la diferencia con los otros tres, que
        se conforman con el registro de peticiones.

        **`targetUserId` es el filtro de la investigación de una cuenta**: qué
        le pasó a esta persona en estas fechas. Los **intentos de acceso
        fallidos no llevan usuario afectado** y por tanto no aparecen ahí: la
        presencia de ese campo delataría que la cuenta existe. Se localizan por
        tipo de evento y rango, leyendo el identificador intentado en `detail`.

        **`detail` no contiene credenciales en ninguna forma** —ni contraseñas,
        ni resúmenes, ni tokens—, y eso se garantiza al escribir.
      operationId: seguridad
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: eventType
        in: query
        required: false
        schema:
          type: string
      - name: severity
        in: query
        required: false
        schema:
          type: string
      - name: outcome
        in: query
        required: false
        schema:
          type: string
      - name: actorId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: targetUserId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: ipAddress
        in: query
        required: false
        schema:
          type: string
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
      responses:
        "200":
          description: Página de eventos de seguridad.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponse"
        "400":
          description: "Rango incoherente (`VAL-001`), paginación fuera de límites\
            \ (`VAL-002`) o tipo de evento, severidad o resultado fuera de su dominio\
            \ (`VAL-003`)"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseSecurityAuditItem"
        "403":
          description: Autenticado sin `audit:read-security` (`AUTH-002`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseSecurityAuditItem"
        "500":
          description: Fallo no controlado (`ERR-500`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseSecurityAuditItem"
  /api/v1/audit/errors:
    get:
      tags:
      - Auditoría
      summary: Consultar la auditoría de error
      description: |
        Fallos no controlados y rechazos por regla de negocio, del más reciente
        al más antiguo.

        **El filtro para el que existe esta consulta es `correlationId`**:
        alguien reporta un error citando el identificador que la respuesta le
        devolvió, y con él se llega al fallo concreto y a la traza técnica que
        lo acompaña.

        **Qué NO aparece aquí, y es la frontera que más importa:** la denegación
        de autorización (`403`) vive en la auditoría de **seguridad**, porque no
        es un fallo del sistema sino el sistema funcionando. Tampoco la
        validación de formato, el `401` ni el `404` — esos los cubre el registro
        de peticiones.

        `message` viene **ya saneado** desde que se escribió: sin trazas, sin
        SQL, sin rutas y sin versiones.
      operationId: errores
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: errorType
        in: query
        required: false
        schema:
          type: string
      - name: severity
        in: query
        required: false
        schema:
          type: string
      - name: errorCode
        in: query
        required: false
        schema:
          type: string
      - name: resource
        in: query
        required: false
        schema:
          type: string
      - name: actorId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: correlationId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Página de fallos registrados.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponse"
        "400":
          description: "Rango incoherente (`VAL-001`), paginación fuera de límites\
            \ (`VAL-002`) o tipo o severidad fuera de su dominio (`VAL-003`)"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseErrorAuditItem"
        "403":
          description: Autenticado sin `audit:read-errors` (`AUTH-002`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseErrorAuditItem"
        "500":
          description: Fallo no controlado (`ERR-500`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseErrorAuditItem"
  /api/v1/audit/deletions:
    get:
      tags:
      - Auditoría
      summary: Consultar la auditoría de eliminación
      description: |
        Qué se eliminó, quién lo eliminó y **por qué**, del más reciente al más
        antiguo.

        **`snapshot` es lo que hace útil a este registro**: el estado completo
        del registro en el momento de borrarse. Sin él, la fila diría que un
        identificador fue eliminado y nadie recordaría qué era.

        **`reason` va vacío en las eliminaciones de asociación** —retirar un
        permiso de un rol, por ejemplo—, y es correcto: lo que desaparece es una
        asociación y no una entidad de negocio, de modo que no exige motivo.

        El filtro `reason` **busca por texto** dentro del motivo, sin distinguir
        acentos ni mayúsculas: es prosa que escribió una persona y nadie
        recuerda cómo la redactó. Por lo mismo, buscar por motivo deja fuera las
        eliminaciones de asociación, que no lo llevan.
      operationId: eliminaciones
