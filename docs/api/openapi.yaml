          description: "Página de cuentas, ordenada por titular, broker e identificador\
            \ de cuenta, **con su resumen**. Vacía —y el resumen en ceros— si ningú\
            n registro cumple el filtro."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BrokerAccountsPage"
        "400":
          description: "`status` fuera de `REGISTER`/`FIRST_DEPOSIT`, `from` posterior\
            \ a `to`, identificador malformado (`VAL-001`) o paginación fuera de lí\
            mites (`VAL-003`)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BrokerAccountsPage"
        "401":
