openapi: 3.1.0
info:
  title: NEXUS — API del Sistema Principal
  description: |
    API del módulo `SP`. **Toda operación exige un token de acceso**
    salvo el inicio, la renovación y el cierre de sesión.

    Para probar cualquier endpoint: obtenga el token con
    `POST /api/v1/auth/login`, pulse **Authorize** y pegue el valor de
    `accessToken` — sin el prefijo `Bearer`, que Swagger añade solo.

    El token vive **quince minutos** y no es revocable: cuando expire,
    renuévelo con `POST /api/v1/auth/refresh` y vuelva a autorizar.
  version: v1
servers:
- url: /
  description: Este mismo servidor
security:
- bearerAuth: []
tags:
- name: Tipos de documento
  description: "Catálogo de documentos de identidad admitidos. Solo lectura: su contenido\
    \ es la validación de mayoría de edad (RN-SP-036)."
- name: Productos
  description: "Catálogo de venta: upgrades de membresía y bots."
- name: Roles
  description: Registro y administración de los roles del sistema.
- name: Movimientos
  description: "El libro de hechos económicos: qué se vendió, a quién y a quién se\
    \ le atribuye."
- name: Auditoría
  description: "Los cuatro registros de auditoría del sistema. Solo lectura, y cada\
    \ uno con su permiso."
- name: Países
  description: Catálogo de países. Inmutable salvo su estado.
- name: Comisiones
  description: "Tasas de comisión personalizadas: la excepción por persona."
- name: Cuentas de broker
  description: "Todas las cuentas de broker del sistema, para quien administra. Las\
    \ del propio equipo se consultan sin permiso en GET /api/v1/users/me/team/broker-accounts."
- name: Brokers
  description: "Catálogo de los brokers con los que opera la plataforma. Solo lectura:\
    \ se puebla por migración (RN-SP-039)."
- name: Comisiones
  description: "Tasas de comisión por rol: qué paga cada producto."
- name: Membresías
  description: Cadena lineal de niveles de consumidor. Inmutable salvo el reordenamiento.
- name: Usuarios
  description: Alta y administración de las personas del sistema.
- name: Permisos
  description: Catálogo de permisos del sistema. Solo lectura.
- name: Tasas de cambio
  description: A cuánto se cambia una moneda por otra
- name: Hotlinks
  description: El enlace público que un vendedor reparte
- name: Métodos de pago
  description: "Con qué se puede pagar, y en qué países no vale cada medio."
- name: Reseñas
  description: Lo que quien compra dice de un producto.
- name: Paquetes
  description: "Paquetes de productos: varios productos con su descuento."
- name: Comisiones
  description: Resolución de la comisión efectiva de una persona sobre un producto.
- name: Monedas
  description: Catálogo de monedas. Inmutable por API salvo su estado.
- name: Sesión
  description: "Inicio, renovación y cierre de sesión."
- name: Registro por enlace
  description: Alta de un cliente desde el enlace de un vendedor. Público (RF-SP-045).
paths:
  /api/v1/users/{id}/membership:
    put:
      tags:
      - Usuarios
      summary: Fijar la membresía de una persona
      description: |
        **`PUT` y no `POST`**, al revés que la asignación de roles, y la
        diferencia no es de gusto: aquí el cuerpo **sí** representa el estado
        final. La persona tiene siempre exactamente una, de modo que enviar una
        la deja como la única — y de ahí sale gratis la idempotencia.

        `endsAt` es opcional. **Ausente significa indefinida**: enviarlo ausente
        sobre una membresía que tenía fecha la convierte en indefinida, y es un
        caso normal, no un olvido que haya que interpretar. Presente, la
        membresía deja de estar vigente **al llegar** ese instante, no después.

        Repetir la petición idéntica no escribe ni deja auditoría. Cambiar solo
        la fecha sí es un cambio y sí se registra.

        Devuelve `200` incluso la primera vez: `PUT` sobre una ruta fija no crea
        un recurso direccionable nuevo.
      operationId: fijarMembresia
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignMembershipRequest"
        required: true
      responses:
        "200":
          description: "La membresía, con su nivel y su vigencia."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserMembershipResponse"
        "400":
          description: "Membresía ausente o malformada (`VAL-001`), o fecha de fin\
            \ igual o anterior al momento de la asignación (`VAL-005`)"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: Autenticado sin `users:assign-membership` (`AUTH-002`)
        "404":
          description: La persona no existe o está eliminada (`VAL-004`)
        "422":
          description: La membresía indicada no existe en la cadena (`VAL-002`)
        "500":
          description: Fallo no controlado (`ERR-500`)
    delete:
      tags:
      - Usuarios
      summary: Devolver la membresía de una persona al suelo
      description: |
        **Devuelve al nivel de arranque, y no deja a nadie sin nivel.** Desde el
        05-09-2026 `RN-SP-018` exige que **toda** persona tenga membresía, de
        modo que esta operación cierra la que tenga y le abre una `BECA`.

        Existe para **corregir un nivel concedido por error**. Bajar a alguien a
        un nivel intermedio es la operación de membresía, que admite indicar
        cuál.

        **Responde `200` con la membresía resultante**, no `204`: devolver un
        cuerpo vacío diría que no queda nada, y queda el nivel de arranque —
        quien llama necesita saber en qué quedó la persona sin volver a
        preguntar.

        **Es idempotente.** Aplicada sobre quien ya está en el suelo no escribe
        ni audita, y devuelve lo mismo.

        **Ya no rechaza a los consumidores.** Hasta el 05-09-2026 exigía que la
        persona **no** portara ningún rol de consumidor, porque la regla de
        entonces no admitía consumidores sin nivel; retirada `RN-SP-013`, esa
        precondición no protege nada.

        **Conserva el `DELETE`** y no le alcanza la enmienda del retiro de
        roles: esta operación no lleva cuerpo, de modo que el problema que
        aquella evitaba no existe aquí.
      operationId: devolverMembresiaAlSuelo
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: "La persona queda en el nivel de arranque, que se devuelve."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserMembershipResponse"
        "400":
          description: Identificador malformado (`VAL-001`)
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: Autenticado sin `users:assign-membership` (`AUTH-002`)
        "404":
          description: La persona no existe o está eliminada (`VAL-002`)
        "500":
          description: Fallo no controlado (`ERR-500`)
  /api/v1/products/{id}/cover:
    put:
      tags:
      - Productos
      summary: Subir o reemplazar la portada de un producto
      description: |
        Recibe **un archivo** —`multipart/form-data`, una sola parte llamada
        `file`— y lo convierte en la portada del producto. **Es el primer
        archivo que el sistema guarda** (`RN-PM-033`, `requirements/pm.md`
        §5.2.9), y lo guarda **tal cual**: ni recorte, ni redimensión, ni
        conversión.

        **El tipo lo deciden los bytes, no la cabecera**: `JPEG`, `PNG` o
        `WebP`, reconocidos por su firma; la cabecera `Content-Type` de la
        parte y el nombre del archivo se ignoran. Un `GIF`, un `SVG` o un
        texto con extensión `.png` se rechazan con `VAL-003`. **Hasta 5 MB**
        (`VAL-004`); sin archivo o vacío, `VAL-002`. Los tres nombran `file`.

        **Si el producto ya tenía portada, la reemplaza**: la nueva estrena
        identificador, **la anterior se borra** y **la dirección cambia** —
        `coverImageUrl` señala una imagen concreta, no «la portada del
        producto», y por eso `GET /api/v1/product-images/{imageId}` se sirve
        con caché inmutable. **En los dos tipos y sin condición**: subir una
        portada nunca deja al producto peor.

        **El alta no admite la imagen**: `POST /api/v1/products` sigue siendo
        JSON, y la portada se sube después con esta operación. Responde con
        el producto, como la corrección, y **un producto retirado no admite
        portada**.
      operationId: subirPortada
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: "El producto, con `coverImageUrl` señalando la imagen nueva."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductDetailResponse"
        "400":
          description: "Identificador sin forma canónica (`VAL-001`), sin archivo\
            \ o vacío (`VAL-002`), ni JPEG ni PNG ni WebP por sus bytes (`VAL-003`),\
            \ más de 5 MB (`VAL-004`) o petición que no es `multipart/form-data` (`EX-003`)"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: Autenticado sin el permiso `products:update` (`AUTH-002`)
        "404":
          description: No existe un producto vivo con ese identificador (`EX-001`)
        "500":
          description: Fallo no controlado (`ERR-500`)
    delete:
      tags:
      - Productos
      summary: Quitar la portada de un producto
      description: |
        Vacía la portada: el producto vuelve a pintarse con su icono —o con el
        que el frontend le pone por omisión, si es un bot— y **la imagen se
        borra**: su dirección deja de servir.

        **Es la única de las tres operaciones de la portada que puede decir
        que no**: un upgrade **sin icono** no puede quedarse sin portada
        (`RN-PM-034`), y se rechaza con `VAL-002` nombrando `icon` — lo que
        falta. El orden para arreglarlo es declarar el icono con
        `PATCH /api/v1/products/{id}` y después quitar la portada. A un bot
        se le quita siempre.

        **Sin portada responde igual y no escribe nada**: ni auditoría ni
        `updatedAt`. Responde `200` con el producto, y no `204`: se vacía un
        campo, no se retira una entidad. Sin cuerpo; si llega uno, se ignora.
      operationId: quitarPortada
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: "El producto, con `coverImageUrl` nulo."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductDetailResponse"
        "400":
          description: Identificador sin forma canónica (`VAL-001`) o upgrade sin
            icono que se quedaría sin nada que pintar (`VAL-002`)
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: Autenticado sin el permiso `products:update` (`AUTH-002`)
        "404":
          description: No existe un producto vivo con ese identificador (`EX-001`)
        "500":
          description: Fallo no controlado (`ERR-500`)
  /api/v1/packages/{id}/cover:
    put:
      tags:
      - Paquetes
      summary: Subir o reemplazar la portada de un paquete
      description: |
        **La misma imagen que la del producto, con las mismas condiciones y la
        misma ruta** (`RN-PM-045`, `requirements/pm.md` §5.2.12): recibe **un
        archivo** —`multipart/form-data`, una sola parte llamada `file`—,
        `JPEG`, `PNG` o `WebP` **reconocidos por sus bytes** (la cabecera y el
        nombre se ignoran; `VAL-003`), **hasta 5 MB** (`VAL-004`), sin archivo
        o vacío `VAL-002`, y lo guarda **tal cual**. La imagen se sirve sin token
        en `GET /api/v1/product-images/{imageId}`, que no sabe si lo que sirve es
        la portada de un producto o de un paquete.

        **Si el paquete ya tenía portada, la reemplaza**: la nueva estrena
        identificador, **la anterior se borra** y **la dirección cambia**. **Sin
        condición de estado ni de contenido**: un paquete inactivo, vacío o sin
        descripción la admite igual, y la activación sigue sin mirarla.

        **El paquete no declara icono ni color.** Cuando `coverImageUrl` es
        nula, el cliente pinta **el icono de promoción y el color por omisión
        del sistema**, los mismos para todos los paquetes — y por eso quitar la
        portada nunca se rechaza. El alta no admite la imagen: `POST
        /api/v1/packages` sigue siendo JSON. Responde con el paquete entero, con
        su cuenta hecha, como todas sus escrituras; **un paquete retirado no
        admite portada**.
      operationId: subirPortada_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: "El paquete, con `coverImageUrl` señalando la imagen nueva."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PackageDetailResponse"
        "400":
          description: "Identificador sin forma canónica (`VAL-001`), sin archivo\
            \ o vacío (`VAL-002`), ni JPEG ni PNG ni WebP por sus bytes (`VAL-003`),\
            \ más de 5 MB (`VAL-004`) o petición que no es `multipart/form-data` (`EX-003`)"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: Autenticado sin el permiso `packages:update` (`AUTH-002`)
        "404":
          description: No existe un paquete vivo con ese identificador (`EX-001`)
        "500":
          description: Fallo no controlado (`ERR-500`)
    delete:
      tags:
      - Paquetes
      summary: Quitar la portada de un paquete
      description: |
        Vacía la portada y **la imagen se borra**: su dirección deja de servir.
        El paquete vuelve a pintarse con **el icono de promoción y el color por
        omisión** que el cliente le pone cuando `coverImageUrl` es nula.

        **Nunca responde `400` por el estado del paquete** — es la única
        diferencia con `DELETE /api/v1/products/{id}/cover`: el paquete no
        declara icono ni color (`RN-PM-045`), de modo que no puede quedarse sin
        nada con qué pintarse. Un paquete activo y ofrecible sigue activo y
        ofrecible sin portada.

        **Sin portada responde igual y no escribe nada**: ni auditoría ni
        `updatedAt`. Responde `200` con el paquete, y no `204`: se vacía un
        campo, no se retira una entidad. Sin cuerpo; si llega uno, se ignora.
      operationId: quitarPortada_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: "El paquete, con `coverImageUrl` nulo."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PackageDetailResponse"
        "400":
          description: Identificador sin forma canónica (`VAL-001`)
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: Autenticado sin el permiso `packages:update` (`AUTH-002`)
        "404":
          description: No existe un paquete vivo con ese identificador (`EX-001`)
        "500":
          description: Fallo no controlado (`ERR-500`)
  /api/v1/users:
    get:
      tags:
      - Usuarios
      summary: Consultar personas
      description: |
        Listado paginado con filtros, búsqueda y ordenamiento.

        **El orden por defecto es `lastName,asc`** y no el nombre de usuario:
        esta es la lista desde la que se administra el acceso, y quien la mira
        busca a alguien por su apellido.

        Solo se puede ordenar por la lista blanca —`username`, `email`,
        `firstName`, `lastName`, `status`, `createdAt`, `updatedAt`—. **No se
        admite ordenar por ningún campo de la credencial**: ordenar por la marca
        de cambio obligatorio produciría la lista de quien no ha cambiado su
        contraseña inicial.

        **`roleId`, `membershipId` y `countryId` no se validan contra su
        catálogo.** Un filtro por algo inexistente devuelve la colección vacía y
        no es un error.

        **`countryId` NO se acota a países activos**, y va contra la intuición:
        filtrar solo por los activos convertiría desactivar un país en una forma
        de **esconder a su gente**, y este listado es justamente la herramienta
        con la que se busca a quien quedó dentro para moverlo. Quien esté en un
        país retirado aparece con normalidad.

        Cada fila trae su `country` **resuelto y nunca nulo** — es el único
        objeto anidado de la fila del que se puede decir eso: `roles` puede venir
        vacía y `membership` y `deletedAt` pueden venir nulos.

        **El listado NO publica el documento ni los datos de contacto**, y no se
        puede buscar por ellos. Es deliberado: exponer un documento en un listado
        paginado alcanza a mucha más gente que devolverlo en un detalle. Quien
        necesite el documento de una persona usa `GET /api/v1/users/{id}`.

        La búsqueda va sobre nombre de usuario, correo y nombre completo,
        **sin distinguir acentos ni mayúsculas**, y por fragmento.

        `membership` **no es nula cuando está vencida**: vencer no es lo mismo
        que no tener. `current` dice cuál de los dos casos es.

        Un filtro sin coincidencias devuelve `200` con la colección vacía. No
        hay `404` ni `422`.
      operationId: listar
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: sort
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: roleId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: membershipId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: countryId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: search
        in: query
        required: false
        schema:
          type: string
      - name: includeDeleted
        in: query
        required: false
        schema:
          type: boolean
      responses:
        "200":
          description: Página de personas.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponse"
        "400":
          description: "Paginación fuera de límites (`VAL-001`, `VAL-002`), campo\
            \ de ordenamiento no admitido (`VAL-003`), o estado fuera de su dominio\
            \ (`VAL-004`). Se devuelven **juntos**"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: Autenticado sin `users:read` (`AUTH-002`)
        "500":
          description: Fallo no controlado (`ERR-500`)
    post:
      tags:
      - Usuarios
      summary: Registrar una persona
      description: |
        Registra una persona con sus roles iniciales.

        La cuenta nace **activa** y **marcada para cambio obligatorio de
        contraseña**: quien prepara el alta conoce la credencial, y esa ventana
        se cierra en el primer inicio de sesión. Ni el estado ni la marca se
        envían; enviarlos devuelve `400`.
        **`membershipId` es OPCIONAL, y el superior es condicional.** Desde el
        05-09-2026 toda persona nace con nivel: si no se indica ninguno, se le
        concede el de arranque (`BECA`). Ya no hay rechazo por indicarlo sin rol
        de consumidor ni por omitirlo teniéndolo — esa exigencia murió con
        `RN-SP-013`.

        El rol de vendedor y el superior comercial **sí siguen siendo
        condicionales en los dos sentidos**: indicar uno sin el otro devuelve
        `409`, no se ignora.

        El superior debe portar el **rol padre inmediato** del rol vendedor de
        mayor rango de la persona, y estar activo.

        ## Identidad, contacto y país

        **`countryId`, `documentTypeId`, `documentNumber` y `phone` son
        obligatorios**, y a diferencia de la membresía y el superior **no
        dependen de qué roles se concedan**: su ausencia es `400`, nunca un
        `409` condicional.

        **`companyPhone`, `addressLine1`, `addressLine2` y `city` son
        opcionales.** Exigir una dirección postal a un funcionario interno
        bloquearía su alta sin que nadie la necesite. `city` es **texto
        libre**: no hay catálogo de ciudades.

        **El tipo de documento sale de `GET /api/v1/document-types`, y ese
        catálogo contiene SOLO documentos de persona mayor de edad.** Ahí está
        la validación de mayoría de edad del sistema entero: no hay ninguna
        marca que diga cuáles acreditan y cuáles no, porque **los que no
        acreditan no están**. Registrar a un menor no se rechaza — no se puede
        expresar, porque no hay identificador que enviar. Un desplegable
        alimentado por ese catálogo no puede ofrecer una opción que el alta vaya
        a rechazar.

        **El par tipo + número es único entre TODAS las personas, incluidas las
        eliminadas** (`RN-SP-035`), igual que el nombre de usuario y el correo.
        El `409` que produce **no dice de quién es** el documento, ni si esa
        persona sigue vigente.

        El número de documento se guarda **recortado y en mayúsculas**, y
        los **dos teléfonos** —`phone`, el personal, y `companyPhone`, el de la
        empresa— **normalizados a dígitos con un `+` opcional**, fuera espacios,
        guiones y paréntesis. La dirección y la ciudad solo se recortan.

        **`companyPhone` es OPCIONAL y `phone` no** (`RN-SP-037`): exigir un
        teléfono de empresa bloquearía el alta de todo el que no tenga una. Sale
        **presente y en nulo** cuando no se declara, nunca ausente.

        **Ningún teléfono se valida contra el país**: eso exigiría un catálogo de
        prefijos que no existe.

        La respuesta agrupa `country`, `document` y `contact` en tres objetos, y
        devuelve el **tipo de documento resuelto** —abreviación y nombre— para
        que no haga falta una segunda llamada al catálogo, que además exige otro
        permiso.

        La contraseña no se recorta: un espacio al principio o al final es parte
        de ella.
      operationId: registrar
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterUserRequest"
        required: true
      responses:
        "201":
          description: Persona registrada. `Location` apunta a su detalle.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: "Formato u obligatoriedad incumplidos —incluidos país, tipo\
            \ y número de documento y teléfono, que son obligatorios (`VAL-014` a\
            \ `VAL-017`)—, contraseña que no cumple la política, o campo no admitido\
            \ en el cuerpo"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: Autenticado sin el permiso de creación de usuarios (`AUTH-002`)
        "409":
          description: "Identidad ya en uso (`RN-SP-016`), documento ya registrado\
            \ por otra persona —vigente o eliminada— o tipo de documento inactivo\
            \ (`RN-SP-035`), país inactivo (`RN-SP-034`), rol que excede los privilegios\
            \ del actor (`RN-SEG-010`), vendedor sin superior o al revés (`RN-SP-019`),\
            \ o superior que no porta el rol padre (`RN-SP-020`)"
        "422":
          description: "Algún rol no existe o no está activo (`EX-003`), el país no\
            \ existe (`EX-009`) o el tipo de documento no existe (`EX-010`) — referencias\
            \ que no resuelven, frente al `409` de las que resuelven y una regla rechaza"
        "500":
          description: Fallo no controlado (`ERR-500`)
  /api/v1/users/{id}/roles:
    post:
      tags:
      - Usuarios
      summary: Asignar roles a una persona
      description: |
        Agrega roles. **No reemplaza la lista**: por eso es un `POST` sobre un
        subrecurso y no un `PUT`. Un reemplazo haría retiros implícitos que se
        saltarían tres reglas cuyo incumplimiento nadie vería.

        Pedir un rol que la persona ya tiene no es un error: no cambia nada y
        no deja rastro en la auditoría.

        **Esta operación no toca la membresía**, y desde el 05-09-2026 tampoco
        la admite: `membershipId` y `membershipEndsAt` se retiraron del cuerpo.
        Toda persona tiene nivel desde el alta, de modo que cuando llega esta
        petición ya lo tiene; cambiarlo es la operación de membresía, que tiene
        su propio permiso.

        `supervisorId` es **condicional**: obligatorio exactamente cuando la
        operación cambia el rango comercial de la persona, y no admitido en
        cualquier otro caso. Su admisibilidad depende del estado de la persona
        y no del cuerpo, de modo que su incumplimiento es `422` y nunca `400`.

        Un **ascenso** —que cambia el rol vendedor de mayor rango— exige
        declarar de nuevo el superior: el anterior puede haber dejado de ser
        admisible sin que nadie tocara esa fila.
      operationId: asignarRoles
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignRolesRequest"
        required: true
      responses:
        "200":
          description: La persona con su estructura actualizada.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: "Lista vacía, identificador malformado o más de 100 elementos"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: Autenticado sin `users:assign-roles` (`AUTH-002`)
        "404":
          description: La persona no existe o está eliminada (`VAL-006`)
        "409":
          description: Algún rol concede permisos que el actor no posee (`RN-SEG-010`).
            El cuerpo enumera cuáles
        "422":
          description: "Rol inexistente (`EX-002`), rol inactivo (`EX-003`), vendedor\
            \ sin superior (`RN-SP-019`), o superior inadmisible (`VAL-007`, `RN-SP-020`)"
        "500":
          description: Fallo no controlado (`ERR-500`)
  /api/v1/users/{id}/roles/revocations:
    post:
      tags:
      - Usuarios
      summary: Retirar roles de una persona
      description: |
        Retira roles y **arrastra UNA cascada**: quedarse sin ningún rol de
        vendedor cierra la asignación de superior comercial —cerrarla, nunca
        borrarla: esa fila dice a quién se atribuía cada resultado—.

        **La membresía ya no se arrastra** (05-09-2026). Quien deja de ser
        consumidor **conserva el nivel que tenía**, incluido uno comprado: toda
        persona debe tener membresía, y bajarla al suelo sería quitarle algo
        que pagó.

        **Revoca todas las sesiones de la persona.** Asignar no lo hace;
        retirar sí, porque el refresh token sobrevive al cambio de permisos y
        dejaría vivo hasta siete días el acceso que se acaba de quitar.

        Es un `POST` sobre un subrecurso y no un `DELETE`: la lista viaja en el
        cuerpo, y RFC 9110 no define semántica para el cuerpo de un `DELETE` —
        un intermediario puede descartarlo sin avisar, y el retiro llegaría sin
        roles.

        **No se pide motivo** y **no se comprueba que los roles existan**:
        retirar un rol eliminado del catálogo es legítimo, porque la asignación
        sigue ahí y debe poder soltarse.
      operationId: retirarRoles
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeRolesRequest"
        required: true
      responses:
        "200":
          description: La persona con su estructura actualizada.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: "Lista vacía, identificador malformado o más de 100 elementos"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: Autenticado sin `users:assign-roles` (`AUTH-002`)
        "404":
          description: La persona no existe o está eliminada (`VAL-006`)
        "409":
          description: "El retiro dejaría al sistema sin superadministrador activo\
            \ (`RN-SP-001`), algún rol excede los permisos del actor (`RN-SEG-010`),\
            \ o la persona tiene equipo a cargo (`RN-SP-022`) — este último informa\
            \ cuántas personas, nunca quiénes"
        "500":
          description: Fallo no controlado (`ERR-500`)
  /api/v1/users/{id}/password-reset:
    post:
      tags:
      - Usuarios
      summary: Restablecer la contraseña de una persona
      description: |
        Fija una credencial **provisional** sobre la cuenta indicada. `POST`
        sobre un subrecurso y no `PATCH` sobre el usuario: cada petición **crea**
        un restablecimiento, que es un hecho con fecha y con caducidad propia.

        **La credencial CADUCA.** Sin plazo, una cuenta restablecida y nunca
        usada conserva indefinidamente una contraseña que otra persona conoce, y
        nadie se entera porque no falla nada. Quien comprueba el plazo es el
        inicio de sesión.

        La cuenta queda marcada para **cambio obligatorio**: la ventana en que
        dos personas conocen la misma contraseña se cierra en el primer inicio
        de sesión.

        **No toca el estado ni el bloqueo**: restablecer no es reactivar. Una
        cuenta desactivada sigue desactivada.

        **La contraseña asignada no se devuelve**: la conoce quien la escribió, y
        repetirla la expondría a cualquier registro de la operación. Tampoco la
        fecha de caducidad — quien la necesite consulta el detalle.

        Revoca **todas** las sesiones de la persona.
      operationId: restablecerContrasena
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
        required: true
      responses:
        "204":
          description: Credencial fijada.
        "400":
          description: Contraseña ausente (`VAL-001`) o que no cumple la política
            (`VAL-002`)
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: Autenticado sin `users:reset-password` (`AUTH-002`)
        "404":
          description: La persona no existe o está eliminada (`VAL-004`)
        "409":
          description: "Es la cuenta del propio actor (`RN-SP-017`). El mensaje indica\
            \ cuál es la operación correcta: cambiar la propia contraseña, que exige\
            \ conocer la actual"
        "500":
          description: Fallo no controlado (`ERR-500`)
  /api/v1/users/{id}/deletion:
    post:
      tags:
      - Usuarios
      summary: Eliminar a una persona
      description: |
        Eliminación **lógica** y con motivo declarado. `POST` sobre un
        subrecurso y no `DELETE` con cuerpo: RFC 9110 no define semántica para
        el cuerpo de un `DELETE` y un intermediario puede descartarlo,
        convirtiendo la petición en un rechazo por motivo ausente que el actor
        no puede entender. Y tampoco por *query string*, o el motivo acabaría en
        los registros de acceso de los proxies.

        **El motivo se verifica el primero de todo**, antes incluso de saber si
        la persona existe.

        La operación **retira sus roles y su membresía**, **cierra** su
        asignación de superior —cerrarla, nunca borrarla: es historial de
        mando— y **revoca sus sesiones**, todo en la misma transacción y con la
        misma marca de tiempo.

        **El estado NO se toca**: se conserva como estaba para que el registro
        de eliminación diga en qué situación estaba la persona cuando se la
        eliminó.

        El `404` **no distingue** «nunca existió» de «ya estaba eliminada».
      operationId: eliminar
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteUserRequest"
        required: true
      responses:
        "204":
          description: Persona eliminada.
        "400":
          description: "Motivo ausente o vacío (`VAL-001`), o campo desconocido"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: "Autenticado sin `users:delete` (`AUTH-002`), o es la cuenta\
            \ del propio actor (`RN-SP-017`)"
        "404":
          description: "No existe, o ya estaba eliminada (`EX-004`)"
        "409":
          description: "Es el último superadministrador activo (`RN-SP-001`), o tiene\
            \ personas a cargo (`RN-SP-022`)"
        "500":
          description: Fallo no controlado (`ERR-500`)
  /api/v1/user-commission-rates:
    get:
      tags:
      - Comisiones
      summary: Consultar las tasas personalizadas
      description: |
        Devuelve las tasas **tal como se declararon**, cada una **con su
        producto** (`id`, `code`, `name`, `price` y `currency`), y no resuelve
        cuál se aplica: para eso está `GET /api/v1/commissions/effective`.

        **Incluye el historial**: las vencidas viajan junto a la vigente salvo que
        se filtre por fecha con `onDate`. Y es **el único historial que le queda al
        módulo** — las tasas de rol perdieron la vigencia.

        **Filtrar por persona devuelve las declaradas PARA esa persona**, no la que
        le aplica hoy sobre un producto.

        **Filtrar por producto (`productId`) devuelve las de ese producto**, de
        cualquier persona: es la respuesta a «quién tiene excepción aquí». Se
        combina con los demás filtros — persona y producto juntos responden
        «¿tiene esta persona excepción en este producto?», con su historial. Un
        producto donde nadie tiene excepción devuelve la página vacía, y **no
        significa que no comisione**: significa que todos cobran por su rol.

        Hasta el 16-09-2026 cada fila traía `associatedProducts`, cuántos
        productos hacían regir la excepción; hoy trae **cuál**, porque es uno.
      operationId: listar_1
      parameters:
      - name: filtros
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/ListUserCommissionRatesRequest"
      responses:
        "200":
          description: Página de tasas personalizadas
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserCommissionRatePageResponse"
        "400":
          description: Parámetros inválidos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserCommissionRatePageResponse"
        "403":
          description: Sin permiso
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserCommissionRatePageResponse"
    post:
      tags:
      - Comisiones
      summary: Registrar la tasa personalizada de una persona sobre un producto
      description: |
        Declara que **esta persona** gana esto —un porcentaje o un importe—
        **por este producto**, desde una fecha y, opcionalmente, hasta otra.
        **`productId` es obligatorio** (`RN-CM-021`, 16-09-2026): la tasa nace
        con su producto, **rige sobre él desde su inicio de vigencia** y no
        cambia de producto — cambiar es retirarla y registrar otra. Una
        excepción que abarque varios productos son varias tasas.

        **Registrar es poner en vigor.** No hay paso de asociación ni
        borrador. Del 11-09-2026 al 16-09-2026 la tasa se creaba sin producto y
        no pagaba nada hasta asociarse; las de aquel modelo se borraron (`V10`)
        y hay que registrarlas de nuevo, una por producto.

        **Una sola vigente por persona, producto y día** (`RN-CM-006`): un
        periodo que pise a otra tasa viva de esa persona sobre ese producto
        responde `409` — también cuando las dos llegan a la vez, porque la
        regla vive en el motor. Sobre **otro** producto no hay conflicto, y las
        consecutivas son el historial.

        Y todo lo que antes se comprobaba al asociar se comprueba aquí:
        producto **vivo y no retirado**; el **tope individual** —un importe
        fijo no pasa del precio del producto, `RN-CM-019`—; la regla del
        **gratuito** —solo importe fijo, `RN-CM-020`—; y, para un importe
        fijo, **los decimales de la moneda del producto** (`RN-CM-017`).

        **No lleva rol, y eso tiene una consecuencia que conviene conocer**: la
        tasa sigue rigiendo aunque su titular pase a un rol que no comisiona.
        Hasta el 01-09-2026 el rol era obligatorio precisamente para impedirlo.

        `validFrom` es obligatorio; sin `validTo`, rige indefinidamente.
      operationId: registrar_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterUserCommissionRateRequest"
        required: true
      responses:
        "201":
          description: "Tasa registrada, y rigiendo desde su inicio"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserCommissionRateResponse"
        "400":
          description: "Datos inválidos, o el importe fijo no cabe en los decimales\
            \ de la moneda del producto (`VAL-014`)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserCommissionRateResponse"
        "403":
          description: Sin permiso
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserCommissionRateResponse"
        "409":
          description: "Esa persona ya tiene una tasa viva sobre ese producto en parte\
            \ de ese periodo (`EX-006`), el importe pasa del precio del producto (`EX-007`),\
            \ o el producto es gratuito y la tasa es de porcentaje (`EX-008`)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserCommissionRateResponse"
        "422":
          description: "La persona no existe (`EX-002`), o el producto no existe (`EX-003`)\
            \ o está retirado (`EX-004`)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserCommissionRateResponse"
  /api/v1/user-commission-rates/{id}/deletion:
    post:
      tags:
      - Comisiones
      summary: Retirar una tasa personalizada
      description: |
        Retira una tasa que **no debió existir**, con **motivo obligatorio**, y
        desde ese instante **esa persona deja de cobrar por ese producto** por
        esta tasa.

        **Retirar no es cerrar la vigencia**: se cierra lo que dejó de regir, se
        retira lo que fue un error. Por eso el retiro **no toca la vigencia** — el
        registro de eliminación debe poder decir qué periodo cubría lo retirado.

        Los días que ocupaba **quedan libres**, de modo que puede declararse otra
        tasa que los cubra. Del 11-09-2026 al 16-09-2026 una tasa asociada no
        se retiraba; sin asociación no hay condición.

        **No es idempotente**: retirar dos veces devuelve `409`.
      operationId: retirar
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteCommissionRateRequest"
      responses:
        "204":
          description: Tasa retirada
        "400":
          description: "Motivo ausente, en blanco o demasiado largo"
        "403":
          description: Sin permiso
        "404":
          description: La tasa no existe
        "409":
          description: Ya estaba retirada
  /api/v1/roles:
    get:
      tags:
      - Roles
      summary: Consultar roles
      description: |
        Listado paginado con filtros, búsqueda y ordenamiento. Es la entrada
        natural a la administración de accesos: de aquí se navega al detalle de
        cada rol.

        **El orden por defecto es `code,asc`**: el código es el identificador
        con el que se habla de un rol en la documentación y en la auditoría.
        Solo se puede ordenar por la lista blanca —`code`, `name`, `roleType`,
        `status`, `createdAt`, `updatedAt`—; cualquier otro campo devuelve
        `400` y **no llega a la base de datos**.

        **No incluye los permisos de cada rol** ni el número de usuarios
        asignados: la primera pregunta la responde el detalle
        (`GET /api/v1/roles/{id}`) y la segunda se hace sobre un rol concreto,
        no sobre la lista.

        **`parentRoleId` no se valida contra el catálogo.** Filtra por el padre
        **directo** —no por el subárbol— y uno inexistente devuelve la
        colección vacía, que no es un error.

        La búsqueda va sobre código y nombre, **sin distinguir acentos ni
        mayúsculas**, y por fragmento: `ministracion` encuentra
        `ADMINISTRACION`. Un término en blanco equivale a no filtrar.

        **Los eliminados quedan fuera salvo que se pidan** con
        `includeDeleted=true`; cuando se piden, `deletedAt` es lo que permite
        distinguirlos.
      operationId: listar_2
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: sort
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: roleType
        in: query
        required: false
        schema:
          type: string
      - name: parentRoleId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: search
        in: query
        required: false
        schema:
          type: string
      - name: includeDeleted
        in: query
        required: false
        schema:
          type: boolean
      responses:
        "200":
          description: Página de roles.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponse"
        "400":
          description: "Paginación fuera de límites, campo de ordenamiento no admitido\
            \ (`VAL-003`), o `status`/`roleType` fuera de su dominio (`VAL-004`).\
            \ Se evalúan y se devuelven **juntos** en `errors`"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: Autenticado sin `roles:read` (`AUTH-002`)
        "500":
          description: Fallo no controlado (`ERR-500`)
    post:
      tags:
      - Roles
      summary: Registrar un rol
      description: |
        Registra un rol bajo un rol padre existente y activo, con los permisos que
        se declaren.

        Los permisos deben estar contenidos en los del rol padre (`RN-SEG-003`) y en
        los permisos efectivos de quien ejecuta el alta (`RN-SEG-010`). Declararlos es
        opcional: sin ellos el rol queda registrado y a la espera de `RF-SP-005`.

        El rol nace siempre **activo** y nunca de sistema. Ni `status` ni `isSystem`
        se admiten en el cuerpo: enviarlos devuelve `400`.
      operationId: registrar_2
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleRequest"
        required: true
      responses:
        "201":
          description: Rol registrado. La cabecera `Location` lleva su dirección.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "400":
          description: "Formato u obligatoriedad incumplidos (`VAL-001` a `VAL-004`,\
            \ `VAL-007`, `VAL-008`), o el cuerpo trae un campo que este endpoint no\
            \ admite"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: Autenticado sin `roles:create` (`AUTH-002`)
        "409":
          description: "Código o nombre ya en uso (`RN-SEG-001`), permiso fuera del\
            \ rol padre (`RN-SEG-003`) o fuera del alcance del actor (`RN-SEG-010`)"
        "422":
          description: "El rol padre no existe o no está activo (`EX-002`), o algú\
            n permiso no está en el catálogo (`EX-005`)"
        "500":
          description: Fallo no controlado (`ERR-500`)
  /api/v1/roles/{id}/permissions:
    post:
      tags:
      - Roles
      summary: Agregar permisos a un rol
      description: |
        Asocia permisos al rol. **La operación se aplica entera o no se
        aplica**: un solo permiso que incumpla la contención rechaza la
        petición completa, porque aplicar los válidos dejaría el rol en un
        estado que nadie pidió.

        Cada permiso debe estar **contenido en los del rol padre**
        (`RN-SEG-003`) y **en los permisos efectivos de quien ejecuta la
        operación** (`RN-SEG-010`). Lo segundo no lo concede `roles:update`:
        ese permiso habilita a modificar roles, no a decidir con qué alcance.

        **El rol raíz omite la primera comprobación** —no tiene cota superior—
        y conserva la segunda.

        **Es idempotente y nunca retira nada**: los permisos ya declarados se
        ignoran sin error, y si no queda ninguno por agregar no se registra
        evento. Hasta 100 por petición.

        **Los roles de sistema también reciben permisos** por aquí: `RN-SEG-012`
        protege su identidad y su posición, no lo que conceden. Los rangos de
        la fuerza comercial y `CLIENTE` nacen sin ninguno, y esta es su única
        vía. Para `AGENTE` hay que pasar antes por `MANAGER` y `DIRECTOR`,
        porque la contención se valida contra el padre inmediato.
      operationId: agregarPermisos
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RolePermissionsRequest"
        required: true
      responses:
        "200":
          description: Rol con sus permisos actualizados.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "400":
          description: Sin permisos (`VAL-001`) o más de 100 (`VAL-006`)
        "401":
          description: Token ausente o inválido (`AUTH-001`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "403":
          description: "Sin `roles:update`, o el rol está asignado al propio actor\
            \ (`RN-SEG-011`)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "404":
          description: El rol no existe o está eliminado (`EX-006`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "409":
          description: Permiso fuera del rol padre (`RN-SEG-003`) o fuera del alcance
            del actor (`RN-SEG-010`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "422":
          description: Uno o más permisos no existen en el catálogo (`EX-003`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "500":
          description: Fallo no controlado (`ERR-500`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
  /api/v1/roles/{id}/permissions/revocations:
    post:
      tags:
      - Roles
      summary: Retirar permisos de un rol
      description: |
        Desasocia permisos del rol, con **eliminación física** de la asociación
        y **sin exigir motivo**: es una asociación y no una entidad de negocio.

        **Se rechaza si un rol hijo directo declara alguno de los permisos que
        se retiran** (`RN-SEG-005`), y el error dice **qué rol** declara **qué
        permiso**: sin ese detalle no habría forma de saber qué corregir. Los
        hijos **inactivos cuentan igual** que los activos —el invariante vale
        siempre—, y los eliminados no.

        **No hay cascada**: nunca se retiran permisos de los descendientes.
        Usted decide en qué orden hacerlo.

        **Es idempotente**: los permisos que el rol no declaraba se ignoran sin
        error. Hasta 100 por petición, el mismo límite que al agregarlos.

        **`POST` sobre un subrecurso y no `DELETE`**: la operación recibe una
        lista en el cuerpo, y RFC 9110 no define semántica para el cuerpo de un
        `DELETE`.

        **Alcanza también a los roles de sistema**: lo que se les concede tiene
        que poder corregirse por el mismo camino.
      operationId: retirarPermisos
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RolePermissionsRequest"
        required: true
      responses:
        "200":
          description: Rol con sus permisos actualizados.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "400":
          description: Sin permisos (`VAL-001`) o más de 100 (`VAL-004`)
        "401":
          description: Token ausente o inválido (`AUTH-001`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "403":
          description: "Sin `roles:update`, o el rol está asignado al propio actor\
            \ (`RN-SEG-011`)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "404":
          description: El rol no existe o está eliminado (`EX-004`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "409":
          description: Un rol dependiente declara el permiso (`RN-SEG-005`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "500":
          description: Fallo no controlado (`ERR-500`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
  /api/v1/roles/{id}/deletion:
    post:
      tags:
      - Roles
      summary: Eliminar un rol
      description: |
        Elimina lógicamente el rol. **El motivo es obligatorio** y se verifica
        **antes de ejecutar nada** (Art. V.13); no se admite un valor generado
        por el sistema.

        **Se rechaza si el rol tiene roles hijos vigentes** —diciendo cuáles— o
        **personas asignadas** —diciendo cuántas— (`RN-SEG-008`). En el segundo
        caso la respuesta sugiere **desactivar** el rol, que suele ser lo que
        en realidad se quería: retirar el acceso sin perder el rol. El conteo
        incluye a las personas inactivas y bloqueadas, y excluye a las
        eliminadas.

        Tras eliminarlo, **su código y su nombre quedan libres** para un rol
        nuevo, y el rol deja de aparecer en el listado por defecto. La
        auditoría de eliminación conserva el motivo y el rol completo —con sus
        permisos por código— para poder reconstruir qué era.

        **`POST` sobre un subrecurso y no `DELETE`**: el motivo viaja en el
        cuerpo, y un intermediario puede descartar el cuerpo de un `DELETE`.
      operationId: eliminar_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteRoleRequest"
        required: true
      responses:
        "204":
          description: Rol eliminado. Sin cuerpo.
        "400":
          description: "Motivo ausente o vacío (`VAL-001`, `VAL-002`)"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: "Sin `roles:delete`, o el rol está asignado al propio actor\
            \ (`RN-SEG-011`)"
        "404":
          description: El rol no existe o ya está eliminado (`EX-006`)
        "409":
          description: "Rol de sistema (`RN-SEG-012`), rol raíz (`RN-SEG-007`), o\
            \ el rol tiene hijos o personas asignadas (`RN-SEG-008`)"
        "500":
          description: Fallo no controlado (`ERR-500`)
  /api/v1/products:
    get:
      tags:
      - Productos
      summary: Consultar el catálogo de productos
      description: |
        Devuelve el catálogo **paginado**, con el destino de cada upgrade y la
        moneda de cada precio ya resueltos: no hace falta una segunda consulta.

        **Los retirados quedan fuera salvo que se pidan** con `includeDeleted`.
        Al pedirlos se indica **desde cuándo** lo están; el **motivo** no viaja
        en el listado —uno a uno lo devuelve el detalle (`RF-PM-003`), en
        bloque sería una exportación de decisiones comerciales—. Verlos **no
        exige un permiso propio**: basta `products:read`.

        Cada fila trae **los dos precios**: `price` —el que se cobra— y
        `purchasePrice` —el **precio de compra**, lo que NEXUS paga por el
        producto—, este **presente y nulo** en los productos cuyo costo no se
        conoce. Este listado y el detalle son **los dos únicos sitios** donde
        se ven juntos: la oferta y el hotlink no devuelven el de compra
        (`RN-PM-024`, 12-09-2026).

        Y trae **`exchange`**, la conversión a la moneda por omisión con la
        tasa vigente hoy, calculada **sobre `price`** —el de compra nunca se
        convierte—. Llega **presente y nula** cuando el producto ya está en
        esa moneda o cuando nadie declaró una tasa: eso **no es un error** y
        el producto se devuelve igual.

        Cada fila trae también **`videoUrl`**, la dirección del video que
        presenta el producto, **tal cual se guardó** y **presente y nula**
        cuando no tiene (`RN-PM-032`). **No es un filtro.**

        Solo se puede ordenar por la lista blanca —`name`, `price`,
        `createdAt`—, con `,asc` o `,desc`. **`purchasePrice` no está en
        ella**: ordenar por una columna que admite nulos obligaría a decidir
        dónde van los productos sin costo conocido, y nadie lo ha decidido.
        **Un campo fuera de la lista se rechaza y no se ignora**:
        ignorarlo devolvería un orden distinto del pedido sin decirlo. Por omisión se ordena por **fecha de alta
        descendente**, y el orden aplicado viaja en la respuesta.

        **`targetMembershipId` no se valida contra el catálogo de membresías.**
        Filtrar por un destino inexistente devuelve la colección vacía y no es
        un error; combinarlo con `type=BOT` también, porque ningún
        bot tiene destino.

        La búsqueda va sobre el nombre, **sin distinguir acentos ni
        mayúsculas** y por fragmento. En blanco equivale a no filtrar.

        **`scope` e `implementation` filtran como `type` y `status`**: se
        admiten en cualquier caja y un valor fuera de dominio se rechaza junto
        al resto de parámetros inválidos, no en una vuelta aparte. El de
        alcance admite los cuatro valores —`TIENDA`, `HOTLINK`, `AMBOS`,
        `NINGUNO`— y **es la única lectura donde se ve un producto
        `NINGUNO`**, porque ninguna vista de venta lo ofrece.

        Un filtro sin coincidencias devuelve `200` con la colección vacía, y
        una página más allá de la última hace lo mismo **con el total real**.
        No hay `404` ni `422`.
      operationId: listar_3
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: sort
        in: query
        required: false
        schema:
          type: string
      - name: type
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: scope
        in: query
        required: false
        schema:
          type: string
      - name: implementation
        in: query
        required: false
        schema:
          type: string
      - name: sourceMembershipId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: targetMembershipId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: search
        in: query
        required: false
        schema:
          type: string
      - name: includeDeleted
        in: query
        required: false
        schema:
          type: boolean
      responses:
        "200":
          description: "Página del catálogo, con el orden aplicado."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductPageResponse"
        "400":
          description: "Paginación fuera de rango (`VAL-001`), tipo (`VAL-002`) o\
            \ estado (`VAL-003`) fuera de su dominio, identificador mal formado (`VAL-004`)\
            \ o campo de ordenamiento no admitido (`VAL-005`). Los cuatro primeros\
            \ se devuelven **juntos**"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: Autenticado sin el permiso `products:read` (`AUTH-002`)
        "500":
          description: Fallo no controlado (`ERR-500`)
    post:
      tags:
      - Productos
      summary: Registrar un producto
      description: |
        Registra un producto del catálogo, **siempre inactivo**: publicarlo es otra
        operación (`RF-PM-005`).

        El tipo decide qué campos son obligatorios: un `UPGRADE_MEMBRESIA` debe
        declarar **las dos** membresías —de qué nivel sale y a cuál lleva— y un
        `BOT` no puede declarar ninguna.

        **El origen no puede estar por encima del destino**: eso sería vender un
        descenso llamándolo upgrade, y se rechaza con `422` (`EX-006`). **Sí
        puede ser el MISMO**, y entonces el producto es una **renovación**: lo
        que vende es tiempo —su `validityDays`— y no un cambio de nivel.

        **Y no tiene por qué ser el inmediatamente inferior**: saltar niveles es
        legítimo, y es la razón de que el origen se declare en lugar de
        deducirse de la cadena.

        `icon` es el **nombre** del icono con el que el frontend pinta el producto
        —no una imagen—, en minúsculas y guion medio. Es **opcional**, y solo un
        `UPGRADE_MEMBRESIA` puede llevarlo: en un `BOT` se rechaza (`RN-PM-016`).

        `videoUrl` es **la dirección de un video** que presenta el producto —no
        el video—. Es **opcional y vale en los dos tipos**, sin la condición
        del icono. Se comprueba **solo la forma**: una URL absoluta `http` o
        `https`, sin espacios y de hasta 500 caracteres; lo demás se rechaza
        con `VAL-017`. **El sistema no sigue el enlace** —no comprueba que el
        video exista ni lo descarga—, y lo guarda **tal cual se escribió**,
        recortado y sin normalizar nada más. Ausente o nulo significan lo
        mismo: no tiene video. **Al revés que el precio de compra, sale en las
        cuatro lecturas**, el hotlink sin token incluido (`RN-PM-032`).

        La vigencia es opcional en los dos tipos: sin ella, lo adquirido no caduca.

        `scope` e `implementation` son **obligatorios y en los dos tipos**, y
        **no tienen valor por omisión**: `scope` dice **en qué vistas de venta**
        se ofrece el producto —`TIENDA` (solo la oferta), `HOTLINK` (solo el
        canal de hotlinks), `AMBOS`, o `NINGUNO` (en ninguna: solo lo ve
        administración, aunque esté activo)— e `implementation` dice si lo
        comprado se aplica solo (`AUTOMATICA`) o espera a que un funcionario
        lo autorice (`MANUAL`). **`HOTLINKS` dejó de existir el 15-09-2026**
        —lo que significaba se llama `AMBOS`— y se rechaza con `400` como
        cualquier valor fuera del dominio.

        **Un producto lleva DOS precios y solo uno se cobra.** `price` es el
        del sistema —el que copia la venta y sobre el que se comisiona— y
        `purchasePrice` es el **precio de compra**: lo que NEXUS paga por el
        producto cuando tiene que comprarlo, y donde se guarda lo que costó.
        Es **opcional**, no interviene en ningún cálculo, se expresa en la
        **misma moneda** y **no sale de administración**: la oferta y el
        hotlink no lo devuelven. Ausente o nulo significan lo mismo —no se
        conoce todavía—, y **eso no es «costó cero»** (`RN-PM-023`). Se llamó
        `publicPrice` hasta el 12-09-2026; ese nombre es hoy una propiedad
        desconocida y devuelve `400`.

        Los dos importes se validan igual: **no negativos** —el **cero se
        admite** desde que existe la renovación de una membresía gratuita— y
        con los decimales que declare su moneda. El rechazo **nombra el
        campo** que incumple.

        **Los dos solo se ven desde administración** (`RN-PM-024`): la oferta
        de un cliente y el hotlink público devuelven **uno**.
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterProductRequest"
        required: true
      responses:
        "201":
          description: "Producto registrado, en estado `INACTIVO`."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          description: Datos inválidos (serie `VAL-nnn`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "403":
          description: Autenticado sin el permiso `products:create` (`AUTH-002`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "409":
          description: "Código o nombre ya en uso (`EX-005`, `EX-001`)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "422":
          description: "Membresía inexistente, moneda inexistente o inactiva, o un\
            \ origen POR ENCIMA del destino (`EX-002`, `EX-003`, `EX-006`)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductResponse"
  /api/v1/products/{id}/deletion:
    post:
      tags:
      - Productos
      summary: Retirar un producto del catálogo
      description: |
        Retira el producto: **eliminación lógica y con motivo** (Art. V.13).
        La fila se conserva —lo vendido tiene que seguir resolviendo a lo que
        se vendió— y el producto deja de ofrecerse.

        **`POST` sobre un subrecurso y no `DELETE` con cuerpo**, igual que al
        eliminar un rol o una persona: RFC 9110 no define semántica para el
        cuerpo de un `DELETE` y un intermediario puede descartarlo, con lo que
        la petición se convertiría en un rechazo por motivo ausente que quien
        la envió no puede entender ni corregir. Y tampoco en la URL, donde el
        motivo quedaría escrito en los registros de acceso de cualquier proxy.

        **El motivo es obligatorio** y se comprueba lo primero de todo, antes
        de tocar la base.

        **El estado no se modifica al retirar.** El registro de eliminación
        conserva si el producto **estaba a la venta**: desactivarlo «de paso»
        haría que todos los registros dijeran «inactivo» y ese dato dejaría de
        significar nada.

        **Qué libera el retiro y qué no**: el **destino** del upgrade queda
        libre para que otro se active, y el **nombre** queda libre para otro
        producto. El **código no se libera nunca** — el día que una factura
        diga `UPGRADE_ORO` tiene que resolver a un solo producto para siempre.

        **No es idempotente a propósito**: retirar uno ya retirado devuelve
        `409`. Dos motivos sobre un solo hecho es evidencia contradictoria.

        No devuelve el producto: lo que se acaba de retirar no es algo que el
        sistema deba seguir ofreciendo a quien lo pidió.
      operationId: retirar_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteProductRequest"
      responses:
        "204":
          description: Producto retirado.
        "400":
          description: "Identificador sin forma canónica (`VAL-001`), motivo ausente\
            \ o en blanco (`VAL-002`) o demasiado largo (`VAL-003`)"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: Autenticado sin el permiso `products:delete` (`AUTH-002`)
        "404":
          description: No existe un producto con ese identificador (`EX-001`)
        "409":
          description: El producto ya estaba retirado (`EX-002`)
        "500":
          description: Fallo no controlado (`ERR-500`)
  /api/v1/products/{id}/comments:
    get:
      tags:
      - Reseñas
      summary: Consultar las reseñas de un producto
      description: |
        Devuelve, **sin token**, las reseñas vivas de un producto, paginadas y de la más
        reciente a la más antigua. **Es público por decisión** (`RF-PM-012`): la pantalla
        del hotlink las necesita y no tiene con qué autenticarse.

        **Del autor solo viaja su nombre y apellido** (`RN-PM-030`): ni identificador, ni
        nombre de usuario, ni correo, ni estado, ni roles. Es la segunda ruta pública del
        sistema que publica el nombre de una persona, después del hotlink, y hereda sus dos
        decisiones.

        **La misma respuesta con token que sin él.** No marca cuál reseña es la de quien
        llama; para eso está `GET .../comments/mine`.

        **El `404` es uniforme**: producto inexistente, inactivo, retirado o identificador
        mal formado responden **el mismo cuerpo** (`RN-PM-028`). Un anónimo no debe poder
        saber si un identificador corresponde a un producto en preparación.

        `updatedAt` distinto de `createdAt` significa «corregida»; no hay campo aparte.

        **El texto NO está saneado**: escápelo al pintarlo.

        Acotada por origen: 120 por minuto sobre la familia `/api/v1/products/*/comments`.
      operationId: list
      parameters:
      - name: id
        in: path
        description: Identificador del producto (UUID)
        required: true
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: Página de reseñas vivas del producto.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseProductCommentPublicItem"
        "400":
          description: Paginación inválida (`VAL-003` de `shared/pagination`)
        "404":
          description: "El producto no existe, está inactivo, está retirado o el identificador\
            \ está mal formado (`EX-001`) — el mismo cuerpo en los cuatro casos"
        "429":
          description: Límite de tasa por origen superado
      security: []
    post:
      tags:
      - Reseñas
      summary: Reseñar un producto
      description: |
        Registra **la** reseña de quien llama sobre un producto: una puntuación entera de
        1 a 5 y un texto de 1 a 1000 caracteres, **las dos obligatorias** (`RN-PM-025`).

        **El autor sale del token.** El cuerpo no admite campo de persona: un `userId`
        es un campo desconocido y se rechaza con `400`. No existe forma de reseñar en
        nombre de otro.

        **Una por persona y producto, entre las vivas** (`RN-PM-026`). La segunda sobre el
        mismo producto responde `409` mientras la primera siga viva; quien cambie de
        opinión la corrige (`PATCH .../comments/{commentId}`). Retirada la suya, puede
        escribir otra.

        **Solo se reseña lo que se puede comprar** (`RN-PM-028`): un producto activo y no
        retirado. **El `404` no distingue** entre inexistente, inactivo y retirado — quien
        reseña es un cliente y ve la oferta, que tampoco distingue.

        **Un decimal en la puntuación se rechaza, no se redondea**, y una cadena tampoco es
        una puntuación: los dos responden `400`.

        Desde la primera reseña escrita, las cuatro lecturas del producto publican
        `rating` con el promedio (dos decimales, **nulo** sin reseñas) y la cantidad de
        reseñas **vivas** (`RN-PM-031`).

        **El texto se guarda tal cual y NO se sanea.** La lista es pública: el front debe
        escaparlo al pintarlo.
      operationId: create
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductCommentRequest"
        required: true
      responses:
        "201":
          description: "Reseña registrada. Sin autor: quien la recibe es quien la\
            \ escribió."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductCommentResponse"
        "400":
          description: "Identificador mal formado (`VAL-001`), puntuación ausente\
            \ (`VAL-002`) o fuera de 1..5 (`VAL-003`), texto vacío (`VAL-004`) o de\
            \ más de 1000 caracteres (`VAL-005`), o campos no admitidos en el cuerpo\
            \ (`VAL-006`)"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: Autenticado sin el permiso `products:comment` (`AUTH-002`)
        "404":
          description: "El producto no existe, está inactivo o está retirado (`EX-001`)"
        "409":
          description: Quien llama ya tiene una reseña viva sobre este producto (`EX-002`)
  /api/v1/packages:
    get:
      tags:
      - Paquetes
      summary: Consultar los paquetes
      description: |
        La lista de administración de los paquetes, paginada, **con la cuenta hecha
        por fila**: cada paquete con `itemCount`, `listPrice`, `price`, `savings`,
        `exchange` y `offerable`, y sin sus líneas — para eso está el detalle. Los
        importes salen de la misma cuenta que el detalle y cuadran con él.

        Filtra por `status`, `scope`, `currencyId` y `q` —búsqueda por nombre, sin
        distinguir mayúsculas ni acentos—, y se combinan. **Excluye los retirados**
        salvo `includeDeleted=true`, y entonces los trae con `deletedAt`.
        **`offerable` no es filtro**: quien administra quiere ver precisamente los
        que no se ofrecen; se queda como columna, y el motivo lo da el detalle.
        **Tampoco lo es la vigencia**: cada fila trae `validFrom` y `validTo`
        (`RN-PM-047`), y un paquete que empieza mañana o terminó ayer sale con
        `offerable: false` y **sigue listado con su estado**, como uno con un
        producto inactivo — no hay proceso que lo desactive al vencer.

        Orden: `createdAt` (omisión, descendente), `name` y `price`, con
        `,asc`/`,desc`. **El orden por `price` ordena por el precio calculado**: el
        precio no está en ninguna columna, de modo que un paquete cuyo producto
        cambió de precio cambia de posición en la siguiente lectura. Se ordena con
        la suma sin redondear; la diferencia con el importe que viaja cabe en un
        céntimo por producto y puede alterar el orden entre paquetes casi iguales.

        Los filtros inválidos se devuelven **juntos** con `400`. Exige
        `packages:read`; `products:read` no habilita.
      operationId: listar_4
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: sort
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: scope
        in: query
        required: false
        schema:
          type: string
      - name: currencyId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: includeDeleted
        in: query
        required: false
        schema:
          type: boolean
      responses:
        "200":
          description: La página de paquetes.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PackagePageResponse"
        "400":
          description: "Filtros, orden o paginación inválidos, juntos (`VAL-001` a\
            \ `VAL-005`)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PackagePageResponse"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PackagePageResponse"
        "403":
          description: Autenticado sin el permiso `packages:read` (`AUTH-002`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PackagePageResponse"
    post:
      tags:
      - Paquetes
      summary: Registrar un paquete
      description: |
        Registra un paquete de productos, **vacío e inactivo**: los productos entran
        uno a uno después (`POST /packages/{id}/products`) y publicarlo es otra
        operación (`PATCH /packages/{id}/status`), que exige descripción y al menos
        dos productos.

        **El paquete no declara precio: se calcula.** Su `price` es la suma de sus
        productos con su descuento, `listPrice` la suma sin descuentos y `savings` la
        diferencia, todo con el precio de catálogo **de hoy** y redondeado por
        producto a los decimales de la moneda. No se guarda en ninguna columna: si un
        producto cambia de precio, el paquete cambia solo. Enviar `price` —o `products`,
        o `status`— responde `400`.

        **La moneda es obligatoria e inmutable**, y solo se le asocian productos en
        esa moneda: un paquete recién creado no tiene productos y aun así sabe en qué
        se expresa. `scope` dice en qué vistas se publica —`TIENDA`, `HOTLINK`, `AMBOS`
        o `NINGUNO`, que existe y se activa pero no se ofrece en ninguna— y es del
        paquete: el alcance de sus productos no filtra dentro de él.

        **Y declara su vigencia** (`RN-PM-047`, desde el 16-09-2026): `validFrom`,
        **obligatorio**, es el primer día en que se ofrece, y `validTo`, opcional, el
        **último** —nulo es indefinidamente; un fin anterior al inicio responde
        `400`—. **No hay regla contra el pasado**: un inicio futuro programa el
        paquete y un fin de ayer lo deja cerrado, que es raro pero no es un error.
        Fuera de esas fechas el paquete **se oculta** de la oferta y del hotlink
        y **no cambia de estado**; el detalle lo dice en `offerableReason`.

        La respuesta es la misma forma que el detalle: `items` vacío, los tres
        importes en cero, `exchange` nulo, `validFrom` y `validTo` tal como se
        declararon, y `offerable: false` con su motivo — «menos de dos productos».
        `offerable` y `offerableReason` viajan **siempre**.

        Exige `packages:create`. **Los `products:` no habilitan**: un actor con los
        cuatro permisos del catálogo y ninguno de paquetes recibe `403`.
      operationId: register_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterPackageRequest"
        required: true
      responses:
        "201":
          description: "Paquete registrado, vacío y en estado `INACTIVO`."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PackageDetailResponse"
        "400":
          description: "Datos inválidos, juntos (`VAL-001` a `VAL-004`), o un cuerpo\
            \ con `price`, `products` o `status` (`VAL-005`)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PackageDetailResponse"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PackageDetailResponse"
        "403":
          description: Autenticado sin el permiso `packages:create` (`AUTH-002`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PackageDetailResponse"
        "409":
          description: "Código ya en uso —también por un paquete retirado— o nombre\
            \ ya en uso por un paquete vivo (`EX-001`, `EX-002`)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PackageDetailResponse"
        "422":
          description: Moneda inexistente o inactiva (`EX-003`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PackageDetailResponse"
  /api/v1/packages/{id}/products:
    post:
      tags:
      - Paquetes
      summary: Asociar un producto al paquete
      description: |
        Mete un producto en el paquete con su descuento, y devuelve **el paquete
        entero** con el producto nuevo, su `priceInPackage` y los totales rehechos.
        Es la operación que define al paquete: siete verificaciones en fila, cada
        una con su código.

        **Forma y valor van juntos y son obligatorios.** `PORCENTAJE` de `0` a
        `100` con hasta dos decimales; `FIJO` de `0` al precio del producto, con los
        decimales de la moneda del paquete. **El cero se admite**: es un producto que
        entra al paquete a su precio.

        **La cota se comprueba contra el precio de hoy, y nadie la vuelve a
        mirar.** Un fijo mayor que el precio del producto responde `409` (`EX-006`,
        nombrando el precio); sobre un producto **gratuito** solo se admite cero. Si
        después el precio del producto baja por debajo de su fijo, el producto
        cuenta **cero** dentro del paquete — nunca negativo — y nada avisa.

        **Qué significa cada `409`**: `EX-003` el producto existe pero está inactivo
        o retirado — se distingue del inexistente, que es `422` (`EX-002`), porque
        quien llama ve el catálogo entero—; `EX-004` el producto está en otra
        moneda, y el mensaje nombra las dos; `EX-005` el producto ya está en el
        paquete — corrija su descuento en lugar de asociarlo de nuevo—; `EX-006` el
        descuento deja al producto por debajo de cero; `EX-007` **el paquete ya
        tiene un upgrade** (`RN-PM-046`, desde el 16-09-2026): un paquete lleva **un
        solo `UPGRADE_MEMBRESIA`** —del origen y el destino que sea, y aunque hoy esté
        inactivo: el sitio lo ocupa la fila— y cuantos bots se quiera. El mensaje
        **nombra el código** del upgrade que ya está, y el sitio se libera al
        desasociarlo. Hasta el 16-09-2026 este código significaba «el upgrade no
        comparte origen con los ya dentro»; con uno solo no hay orígenes que
        comparar. Los bots entran sin mirar cuántos upgrades hay.

        Se asocia **a un paquete inactivo** —es el estado en el que un paquete se
        arma— y no a uno retirado (`404`). El producto no cambia: la fila es del
        paquete, y el mismo producto puede estar en otros paquetes con otro
        descuento. Exige `packages:update`.
      operationId: associate
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssociatePackageProductRequest"
        required: true
      responses:
        "201":
          description: Producto asociado; el paquete entero con su precio recalculado.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PackageDetailResponse"
        "400":
          description: "Identificador inválido, campos ausentes o forma del descuento\
            \ inválida (`VAL-001` a `VAL-005`)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PackageDetailResponse"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PackageDetailResponse"
        "403":
          description: Autenticado sin el permiso `packages:update` (`AUTH-002`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PackageDetailResponse"
        "404":
          description: El paquete no existe o está retirado (`EX-001`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PackageDetailResponse"
        "409":
          description: "Producto inactivo o retirado, en otra moneda, ya en el paquete,\
            \ descuento por encima del precio, o el paquete ya tiene un upgrade (`EX-003`\
            \ a `EX-007`)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PackageDetailResponse"
        "422":
          description: El producto no existe (`EX-002`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PackageDetailResponse"
  /api/v1/packages/{id}/deletion:
    post:
      tags:
      - Paquetes
      summary: Retirar un paquete
      description: |
        Retira el paquete con **eliminación lógica y motivo obligatorio** (Art. V.13):
        la fila permanece con su `status` y **sus filas de asociación**, y el detalle
        sigue devolviéndolo con `deletedAt` y `deletionReason`. Sale de la oferta y
        del hotlink en el acto; **sus productos no cambian** — eran suyos antes del
        paquete y lo siguen siendo después, en el catálogo y en los demás paquetes.

        El motivo se valida **antes de cualquier consulta**. El paquete inexistente
        es `404` y el **ya retirado es `409`**, y se distinguen a propósito: el
        catálogo devuelve los retirados a quien tiene `packages:read`, y quien
        retira dos veces merece saber que la primera funcionó.

        **El código de un paquete retirado no se libera**: un alta con ese código
        responde `409`. El nombre sí. Exige `packages:delete`.
      operationId: retirar_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeletePackageRequest"
      responses:
        "204":
          description: Paquete retirado.
        "400":
          description: "Identificador inválido o motivo ausente, vacío o de más de\
            \ 500 (`VAL-001` a `VAL-003`)"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: Autenticado sin el permiso `packages:delete` (`AUTH-002`)
        "404":
          description: El paquete no existe (`EX-001`)
        "409":
          description: El paquete ya está retirado (`EX-002`)
  /api/v1/packages/{code}/purchases:
    post:
      tags:
      - Movimientos
      summary: Comprar un paquete para uno mismo
      description: |
        **Usted se compra el paquete entero** que su oferta le muestra, pagando **lo que ese
        paquete vale** —la suma de sus productos rebajados, el mismo `price` que publica la
        oferta— y recibiendo **cada producto** con el descuento que el paquete le declara,
        congelado.

        **El cuerpo lleva el método de pago y nada más.** El paquete va en la ruta **por su
        código** —el que publica la oferta—, sin distinguir mayúsculas. **No se
        admiten** productos, cantidades, precios ni descuentos: el paquete se compra
        **entero** —no se elige qué llevarse—, **uno** —no hay cantidad— y **solo** —sin
        productos sueltos ni un segundo paquete; quien quiera dos cosas hace dos compras—.
        El descuento es el que el paquete declara, y un descuento enviado no tiene dónde
        caer. Tampoco viajan el cliente —es usted— ni la fecha —es ahora—.

        **`paymentMethodId` es condicional en los dos sentidos.** Obligatorio si el paquete
        tiene importe; **prohibido** si vale cero, que se registra como gratuita: envíe `{}`.

        **La venta nace `PENDIENTE`, y eso significa que no concede nada.** No sube de
        nivel, no habilita nada y no comisiona hasta que se confirme el pago. Se registra
        **una línea por producto del paquete**, cantidad uno, cada una con lo copiado del
        catálogo —nombre, descripción, precio unitario, vigencia— y **su rebaja explicada**:
        `discounts[]` dice cómo se pactó (`type`, `value`) y cuánto valió en dinero
        (`discountValue`), y `lineDiscount` es lo que se restó. `payableAmount` es la suma de
        las líneas rebajadas; `totalAmount` lo que valdrían sin rebaja; `discountAmount` la
        diferencia. El paquete queda anotado en `packageId`.

        **Lo copiado queda congelado.** Corregir después el descuento del paquete, el precio
        de un producto o quitar un producto del paquete no cambia esta venta.

        **Se compra tal como está hoy.** Al registrar se vuelve a comprobar todo lo que la
        oferta ya miró: que el paquete esté activo, publicado en la tienda, con sus
        productos, **dentro de su vigencia**, y que le corresponda a usted por su membresía.
        **Y se compra entero**: si un producto del paquete no procede —inactivo, retirado,
        fuera de su oferta, o un upgrade que baja de nivel— se rechaza la compra completa
        nombrando el producto, y **no se registra nada**.

        **La respuesta no lleva el vendedor**: se atribuye a su superior comercial vigente
        —o a usted mismo si no cuelga de nadie— y se congela en cada línea, pero a quien
        compra no se le enseña. Es la misma forma que devuelve `GET /api/v1/movements/mine/{id}`
        sin `seller`.
      operationId: comprar
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuyPackageRequest"
      responses:
        "201":
          description: "Venta registrada, pendiente de pago."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PurchaseResponse"
        "400":
          description: "Un campo que el cuerpo no admite: productos, cantidad, precio\
            \ o descuento."
        "401":
          description: Token ausente o inválido (`AUTH-001`). Comprar exige sesión.
        "409":
          description: "Lo que solo se sabe después de resolver: el paquete no se\
            \ ofrece hoy —inactivo, vencido, sin descripción, con menos de dos productos,\
            \ fuera de la tienda o con un producto inactivo o retirado— (`EX-002`,\
            \ con el mismo motivo que publica el catálogo); no le corresponde a usted\
            \ por su membresía (`EX-003`); un producto no está en su oferta (`EX-004`);\
            \ el upgrade BAJA de nivel —renovar el mismo sí se admite— (`EX-005`);\
            \ su cuenta no puede operar todavía (`EX-006`); el método de pago no cuadra\
            \ con el importe (`RN-MV-022`) o está desactivado (`EX-010`)."
        "422":
          description: "Una referencia que no resuelve: ningún paquete tiene ese có\
            digo, o está retirado (`EX-001`); o el método de pago no existe (`EX-010`)."
        "500":
          description: Fallo no controlado (`ERR-500`)
  /api/v1/movements:
    get:
      tags:
      - Movimientos
      summary: Consultar todos los movimientos
      description: |
        Devuelve **todos los movimientos del libro**, de quien sean, paginados y del más
        reciente al más antiguo. Es la lectura de administración: exige `movements:read`,
        y con él se ve todo — quien no lo tiene recibe `403` aunque tenga movimientos
        propios, que se consultan por `/mine`.

        **Los filtros se combinan** y responden una pregunta de operación cada uno:
        `status` (qué está pendiente de confirmar), `userId` (qué compró esta persona —el
        SUJETO, a nombre de quién es—), `sellerId` (qué vendió esta persona, como vendedora
        de **alguna de sus líneas**; una venta con varias líneas suyas aparece **una vez**),
        `paymentMethodId` (qué entró por un medio de pago), `code` (un comprobante exacto,
        sin distinguir mayúsculas) y `from`/`to` sobre **cuándo ocurrió**. `from` y `to` son
        instantes con zona horaria y el rango es **semiabierto** —incluye `from`, excluye
        `to`—. Un `userId`, `sellerId` o `paymentMethodId` que no exista da una página vacía;
        un `status` que no exista es `400`.

        **Cada fila lleva el tipo de movimiento** (`type`, hoy siempre `VENTA`), el sujeto
        (`user`), los vendedores de sus líneas sin repetir (`sellers`, lista nunca nula y
        vacía cuando no hay ninguno), y **cuándo se confirmó** (`confirmedAt`): presente en
        las confirmadas y **nulo** en las demás. No lleva `role` —quien administra no
        participa en lo que mira— ni las líneas, que son del detalle.

        **El total puede no ser exacto.** El libro crece sin límite, y por encima del techo
        de conteo `totalElements` vale el techo y `totalIsExact` es `false`: hay «más de N»
        y conviene acotar. El orden es fijo y no se puede cambiar.
      operationId: todos
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: userId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: sellerId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: paymentMethodId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: code
        in: query
        required: false
        schema:
          type: string
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
      responses:
        "200":
          description: La página de movimientos.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseMovementSummary"
        "400":
          description: "Paginación inválida, estado no admitido (`VAL-002`), identificador\
            \ malformado (`VAL-001`) o `from` posterior a `to` (`VAL-004`). Los problemas\
            \ se devuelven juntos."
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: "Sin el permiso `movements:read`, tenga o no movimientos propios."
        "500":
          description: Fallo no controlado (`ERR-500`)
    post:
      tags:
      - Movimientos
      summary: Registrar una venta a nombre de un cliente
      description: |
        Deja constancia de **qué le vendió la empresa a alguien**, como un hecho que
        **todavía no está pagado**. `userId` es **a nombre de quién** es la venta —quien
        compra—, nunca quien la registra desde oficina.

        **La venta nace `PENDIENTE`, y eso significa que no concede nada.** No sube de
        nivel a nadie, no habilita ninguna cuenta y no comisiona: registrar una venta
        **no cambia absolutamente nada fuera de este módulo**. Confirmarla es otra
        operación.

        **El precio no se envía: se toma del catálogo.** Se indica qué productos y
        cuántos, nunca cuánto cuestan — un precio que llegara en la petición sería un
        descuento sin autorización y sin rastro. Tampoco se envían la moneda, la
        vigencia ni el vendedor: la moneda y la vigencia salen del producto, y **el
        vendedor sale de quien compra** —su superior vigente, o **él mismo** si no cuelga
        de nadie— y se congela **en cada línea** (`lines[].seller`). En una venta ninguna
        línea viene sin vendedor.

        **Lo copiado queda congelado.** Corregir mañana el precio de un producto, o
        reasignar al comprador a otro agente, no cambia lo que se vendió hoy.

        **Esta entrada no aplica descuentos.** Cada línea trae su descuento (`lineDiscount`,
        hoy cero), las rebajas que lo explican (`discounts`, hoy vacía) y el paquete del que
        salió (`packageId`, hoy nulo); la cabecera es la suma de las líneas en las tres
        cifras. La primera entrada que rebaje será la compra de paquetes.

        Reglas de composición: **como mucho un upgrade** por venta y con cantidad uno,
        sin productos repetidos y todas las líneas en la misma moneda.
      operationId: registrar_3
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterSaleRequest"
        required: true
      responses:
        "201":
          description: "Venta registrada, pendiente de pago."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SaleResponse"
        "400":
          description: "Lo que se ve mirando la petición: falta el comprador o el\
            \ método de pago, no hay líneas, la cantidad no es positiva, un producto\
            \ se repite, o la fecha del hecho está en el futuro."
        "403":
          description: Sin el permiso `movements:create`.
        "409":
          description: "Lo que solo se sabe después de resolver: la cuenta no puede\
            \ operar todavía, un producto no está en su oferta, el upgrade BAJA de\
            \ nivel —renovar el mismo sí se admite—, hay dos upgrades, las monedas\
            \ difieren, o el método de pago está desactivado."
        "422":
          description: "Un dato bien formado que no resuelve: el comprador, un producto\
            \ o el método de pago no existen."
  /api/v1/memberships:
    get:
      tags:
