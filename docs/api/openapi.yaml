openapi: 3.1.0
info:
  title: NEXUS — API del Sistema Principal
  description: |
    API del módulo `SP`. **Toda operación exige un token de acceso**
    salvo el inicio, la renovación y el cierre de sesión.

    Para probar cualquier endpoint: obtenga el token con
    `POST /api/v1/auth/login`, pulse **Authorize** y pegue el valor de
    `accessToken` — sin el prefijo `Bearer`, que Swagger añade solo.

    El token vive **quince minutos** y no es revocable: cuando expire,
    renuévelo con `POST /api/v1/auth/refresh` y vuelva a autorizar.
  version: v1
servers:
- url: /
  description: Este mismo servidor
security:
- bearerAuth: []
tags:
- name: Tipos de documento
  description: "Catálogo de documentos de identidad admitidos. Solo lectura: su contenido\
    \ es la validación de mayoría de edad (RN-SP-036)."
- name: Productos
  description: "Catálogo de venta: upgrades de membresía y bots."
- name: Roles
  description: Registro y administración de los roles del sistema.
- name: Movimientos
  description: "El libro de hechos económicos: qué se vendió, a quién y a quién se\
    \ le atribuye."
- name: Auditoría
  description: "Los cuatro registros de auditoría del sistema. Solo lectura, y cada\
    \ uno con su permiso."
- name: Comisiones
  description: Tasas de comisión por rol y su asociación con los productos.
- name: Países
  description: Catálogo de países. Inmutable salvo su estado.
- name: Comisiones
  description: "Tasas de comisión personalizadas: la excepción por persona."
- name: Cuentas de broker
  description: "Todas las cuentas de broker del sistema, para quien administra. Las\
    \ del propio equipo se consultan sin permiso en GET /api/v1/users/me/team/broker-accounts."
- name: Brokers
  description: "Catálogo de los brokers con los que opera la plataforma. Solo lectura:\
    \ se puebla por migración (RN-SP-039)."
- name: Membresías
  description: Cadena lineal de niveles de consumidor. Inmutable salvo el reordenamiento.
- name: Usuarios
  description: Alta y administración de las personas del sistema.
- name: Permisos
  description: Catálogo de permisos del sistema. Solo lectura.
- name: Tasas de cambio
  description: A cuánto se cambia una moneda por otra
- name: Hotlinks
  description: El enlace público que un vendedor reparte
- name: Métodos de pago
  description: "Con qué se puede pagar, y en qué países no vale cada medio."
- name: Comisiones
  description: Resolución de la comisión efectiva de una persona sobre un producto.
- name: Monedas
  description: Catálogo de monedas. Inmutable por API salvo su estado.
- name: Sesión
  description: "Inicio, renovación y cierre de sesión."
- name: Registro por enlace
  description: Alta de un cliente desde el enlace de un vendedor. Público (RF-SP-045).
paths:
  /api/v1/users/{id}/membership:
    put:
      tags:
      - Usuarios
      summary: Fijar la membresía de una persona
      description: |
        **`PUT` y no `POST`**, al revés que la asignación de roles, y la
        diferencia no es de gusto: aquí el cuerpo **sí** representa el estado
        final. La persona tiene siempre exactamente una, de modo que enviar una
        la deja como la única — y de ahí sale gratis la idempotencia.

        `endsAt` es opcional. **Ausente significa indefinida**: enviarlo ausente
        sobre una membresía que tenía fecha la convierte en indefinida, y es un
        caso normal, no un olvido que haya que interpretar. Presente, la
        membresía deja de estar vigente **al llegar** ese instante, no después.

        Repetir la petición idéntica no escribe ni deja auditoría. Cambiar solo
        la fecha sí es un cambio y sí se registra.

        Devuelve `200` incluso la primera vez: `PUT` sobre una ruta fija no crea
        un recurso direccionable nuevo.
      operationId: fijarMembresia
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignMembershipRequest"
        required: true
      responses:
        "200":
          description: "La membresía, con su nivel y su vigencia."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserMembershipResponse"
        "400":
          description: "Membresía ausente o malformada (`VAL-001`), o fecha de fin\
            \ igual o anterior al momento de la asignación (`VAL-005`)"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: Autenticado sin `users:assign-membership` (`AUTH-002`)
        "404":
          description: La persona no existe o está eliminada (`VAL-004`)
        "422":
          description: La membresía indicada no existe en la cadena (`VAL-002`)
        "500":
          description: Fallo no controlado (`ERR-500`)
    delete:
      tags:
      - Usuarios
      summary: Devolver la membresía de una persona al suelo
      description: |
        **Devuelve al nivel de arranque, y no deja a nadie sin nivel.** Desde el
        05-09-2026 `RN-SP-018` exige que **toda** persona tenga membresía, de
        modo que esta operación cierra la que tenga y le abre una `BECA`.

        Existe para **corregir un nivel concedido por error**. Bajar a alguien a
        un nivel intermedio es la operación de membresía, que admite indicar
        cuál.

        **Responde `200` con la membresía resultante**, no `204`: devolver un
        cuerpo vacío diría que no queda nada, y queda el nivel de arranque —
        quien llama necesita saber en qué quedó la persona sin volver a
        preguntar.

        **Es idempotente.** Aplicada sobre quien ya está en el suelo no escribe
        ni audita, y devuelve lo mismo.

        **Ya no rechaza a los consumidores.** Hasta el 05-09-2026 exigía que la
        persona **no** portara ningún rol de consumidor, porque la regla de
        entonces no admitía consumidores sin nivel; retirada `RN-SP-013`, esa
        precondición no protege nada.

        **Conserva el `DELETE`** y no le alcanza la enmienda del retiro de
        roles: esta operación no lleva cuerpo, de modo que el problema que
        aquella evitaba no existe aquí.
      operationId: devolverMembresiaAlSuelo
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: "La persona queda en el nivel de arranque, que se devuelve."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserMembershipResponse"
        "400":
          description: Identificador malformado (`VAL-001`)
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: Autenticado sin `users:assign-membership` (`AUTH-002`)
        "404":
          description: La persona no existe o está eliminada (`VAL-002`)
        "500":
          description: Fallo no controlado (`ERR-500`)
  /api/v1/users:
    get:
      tags:
      - Usuarios
      summary: Consultar personas
      description: |
        Listado paginado con filtros, búsqueda y ordenamiento.

        **El orden por defecto es `lastName,asc`** y no el nombre de usuario:
        esta es la lista desde la que se administra el acceso, y quien la mira
        busca a alguien por su apellido.

        Solo se puede ordenar por la lista blanca —`username`, `email`,
        `firstName`, `lastName`, `status`, `createdAt`, `updatedAt`—. **No se
        admite ordenar por ningún campo de la credencial**: ordenar por la marca
        de cambio obligatorio produciría la lista de quien no ha cambiado su
        contraseña inicial.

        **`roleId`, `membershipId` y `countryId` no se validan contra su
        catálogo.** Un filtro por algo inexistente devuelve la colección vacía y
        no es un error.

        **`countryId` NO se acota a países activos**, y va contra la intuición:
        filtrar solo por los activos convertiría desactivar un país en una forma
        de **esconder a su gente**, y este listado es justamente la herramienta
        con la que se busca a quien quedó dentro para moverlo. Quien esté en un
        país retirado aparece con normalidad.

        Cada fila trae su `country` **resuelto y nunca nulo** — es el único
        objeto anidado de la fila del que se puede decir eso: `roles` puede venir
        vacía y `membership` y `deletedAt` pueden venir nulos.

        **El listado NO publica el documento ni los datos de contacto**, y no se
        puede buscar por ellos. Es deliberado: exponer un documento en un listado
        paginado alcanza a mucha más gente que devolverlo en un detalle. Quien
        necesite el documento de una persona usa `GET /api/v1/users/{id}`.

        La búsqueda va sobre nombre de usuario, correo y nombre completo,
        **sin distinguir acentos ni mayúsculas**, y por fragmento.

        `membership` **no es nula cuando está vencida**: vencer no es lo mismo
        que no tener. `current` dice cuál de los dos casos es.

        Un filtro sin coincidencias devuelve `200` con la colección vacía. No
        hay `404` ni `422`.
      operationId: listar
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: sort
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: roleId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: membershipId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: countryId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: search
        in: query
        required: false
        schema:
          type: string
      - name: includeDeleted
        in: query
        required: false
        schema:
          type: boolean
      responses:
        "200":
          description: Página de personas.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponse"
        "400":
          description: "Paginación fuera de límites (`VAL-001`, `VAL-002`), campo\
            \ de ordenamiento no admitido (`VAL-003`), o estado fuera de su dominio\
            \ (`VAL-004`). Se devuelven **juntos**"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: Autenticado sin `users:read` (`AUTH-002`)
        "500":
          description: Fallo no controlado (`ERR-500`)
    post:
      tags:
      - Usuarios
      summary: Registrar una persona
      description: |
        Registra una persona con sus roles iniciales.

        La cuenta nace **activa** y **marcada para cambio obligatorio de
        contraseña**: quien prepara el alta conoce la credencial, y esa ventana
        se cierra en el primer inicio de sesión. Ni el estado ni la marca se
        envían; enviarlos devuelve `400`.
        **`membershipId` es OPCIONAL, y el superior es condicional.** Desde el
        05-09-2026 toda persona nace con nivel: si no se indica ninguno, se le
        concede el de arranque (`BECA`). Ya no hay rechazo por indicarlo sin rol
        de consumidor ni por omitirlo teniéndolo — esa exigencia murió con
        `RN-SP-013`.

        El rol de vendedor y el superior comercial **sí siguen siendo
        condicionales en los dos sentidos**: indicar uno sin el otro devuelve
        `409`, no se ignora.

        El superior debe portar el **rol padre inmediato** del rol vendedor de
        mayor rango de la persona, y estar activo.

        ## Identidad, contacto y país

        **`countryId`, `documentTypeId`, `documentNumber` y `phone` son
        obligatorios**, y a diferencia de la membresía y el superior **no
        dependen de qué roles se concedan**: su ausencia es `400`, nunca un
        `409` condicional.

        **`companyPhone`, `addressLine1`, `addressLine2` y `city` son
        opcionales.** Exigir una dirección postal a un funcionario interno
        bloquearía su alta sin que nadie la necesite. `city` es **texto
        libre**: no hay catálogo de ciudades.

        **El tipo de documento sale de `GET /api/v1/document-types`, y ese
        catálogo contiene SOLO documentos de persona mayor de edad.** Ahí está
        la validación de mayoría de edad del sistema entero: no hay ninguna
        marca que diga cuáles acreditan y cuáles no, porque **los que no
        acreditan no están**. Registrar a un menor no se rechaza — no se puede
        expresar, porque no hay identificador que enviar. Un desplegable
        alimentado por ese catálogo no puede ofrecer una opción que el alta vaya
        a rechazar.

        **El par tipo + número es único entre TODAS las personas, incluidas las
        eliminadas** (`RN-SP-035`), igual que el nombre de usuario y el correo.
        El `409` que produce **no dice de quién es** el documento, ni si esa
        persona sigue vigente.

        El número de documento se guarda **recortado y en mayúsculas**, y
        los **dos teléfonos** —`phone`, el personal, y `companyPhone`, el de la
        empresa— **normalizados a dígitos con un `+` opcional**, fuera espacios,
        guiones y paréntesis. La dirección y la ciudad solo se recortan.

        **`companyPhone` es OPCIONAL y `phone` no** (`RN-SP-037`): exigir un
        teléfono de empresa bloquearía el alta de todo el que no tenga una. Sale
        **presente y en nulo** cuando no se declara, nunca ausente.

        **Ningún teléfono se valida contra el país**: eso exigiría un catálogo de
        prefijos que no existe.

        La respuesta agrupa `country`, `document` y `contact` en tres objetos, y
        devuelve el **tipo de documento resuelto** —abreviación y nombre— para
        que no haga falta una segunda llamada al catálogo, que además exige otro
        permiso.

        La contraseña no se recorta: un espacio al principio o al final es parte
        de ella.
      operationId: registrar
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterUserRequest"
        required: true
      responses:
        "201":
          description: Persona registrada. `Location` apunta a su detalle.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: "Formato u obligatoriedad incumplidos —incluidos país, tipo\
            \ y número de documento y teléfono, que son obligatorios (`VAL-014` a\
            \ `VAL-017`)—, contraseña que no cumple la política, o campo no admitido\
            \ en el cuerpo"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: Autenticado sin el permiso de creación de usuarios (`AUTH-002`)
        "409":
          description: "Identidad ya en uso (`RN-SP-016`), documento ya registrado\
            \ por otra persona —vigente o eliminada— o tipo de documento inactivo\
            \ (`RN-SP-035`), país inactivo (`RN-SP-034`), rol que excede los privilegios\
            \ del actor (`RN-SEG-010`), vendedor sin superior o al revés (`RN-SP-019`),\
            \ o superior que no porta el rol padre (`RN-SP-020`)"
        "422":
          description: "Algún rol no existe o no está activo (`EX-003`), el país no\
            \ existe (`EX-009`) o el tipo de documento no existe (`EX-010`) — referencias\
            \ que no resuelven, frente al `409` de las que resuelven y una regla rechaza"
        "500":
          description: Fallo no controlado (`ERR-500`)
  /api/v1/users/{id}/roles:
    post:
      tags:
      - Usuarios
      summary: Asignar roles a una persona
      description: |
        Agrega roles. **No reemplaza la lista**: por eso es un `POST` sobre un
        subrecurso y no un `PUT`. Un reemplazo haría retiros implícitos que se
        saltarían tres reglas cuyo incumplimiento nadie vería.

        Pedir un rol que la persona ya tiene no es un error: no cambia nada y
        no deja rastro en la auditoría.

        **Esta operación no toca la membresía**, y desde el 05-09-2026 tampoco
        la admite: `membershipId` y `membershipEndsAt` se retiraron del cuerpo.
        Toda persona tiene nivel desde el alta, de modo que cuando llega esta
        petición ya lo tiene; cambiarlo es la operación de membresía, que tiene
        su propio permiso.

        `supervisorId` es **condicional**: obligatorio exactamente cuando la
        operación cambia el rango comercial de la persona, y no admitido en
        cualquier otro caso. Su admisibilidad depende del estado de la persona
        y no del cuerpo, de modo que su incumplimiento es `422` y nunca `400`.

        Un **ascenso** —que cambia el rol vendedor de mayor rango— exige
        declarar de nuevo el superior: el anterior puede haber dejado de ser
        admisible sin que nadie tocara esa fila.
      operationId: asignarRoles
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignRolesRequest"
        required: true
      responses:
        "200":
          description: La persona con su estructura actualizada.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: "Lista vacía, identificador malformado o más de 100 elementos"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: Autenticado sin `users:assign-roles` (`AUTH-002`)
        "404":
          description: La persona no existe o está eliminada (`VAL-006`)
        "409":
          description: Algún rol concede permisos que el actor no posee (`RN-SEG-010`).
            El cuerpo enumera cuáles
        "422":
          description: "Rol inexistente (`EX-002`), rol inactivo (`EX-003`), vendedor\
            \ sin superior (`RN-SP-019`), o superior inadmisible (`VAL-007`, `RN-SP-020`)"
        "500":
          description: Fallo no controlado (`ERR-500`)
  /api/v1/users/{id}/roles/revocations:
    post:
      tags:
      - Usuarios
      summary: Retirar roles de una persona
      description: |
        Retira roles y **arrastra UNA cascada**: quedarse sin ningún rol de
        vendedor cierra la asignación de superior comercial —cerrarla, nunca
        borrarla: esa fila dice a quién se atribuía cada resultado—.

        **La membresía ya no se arrastra** (05-09-2026). Quien deja de ser
        consumidor **conserva el nivel que tenía**, incluido uno comprado: toda
        persona debe tener membresía, y bajarla al suelo sería quitarle algo
        que pagó.

        **Revoca todas las sesiones de la persona.** Asignar no lo hace;
        retirar sí, porque el refresh token sobrevive al cambio de permisos y
        dejaría vivo hasta siete días el acceso que se acaba de quitar.

        Es un `POST` sobre un subrecurso y no un `DELETE`: la lista viaja en el
        cuerpo, y RFC 9110 no define semántica para el cuerpo de un `DELETE` —
        un intermediario puede descartarlo sin avisar, y el retiro llegaría sin
        roles.

        **No se pide motivo** y **no se comprueba que los roles existan**:
        retirar un rol eliminado del catálogo es legítimo, porque la asignación
        sigue ahí y debe poder soltarse.
      operationId: retirarRoles
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeRolesRequest"
        required: true
      responses:
        "200":
          description: La persona con su estructura actualizada.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: "Lista vacía, identificador malformado o más de 100 elementos"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: Autenticado sin `users:assign-roles` (`AUTH-002`)
        "404":
          description: La persona no existe o está eliminada (`VAL-006`)
        "409":
          description: "El retiro dejaría al sistema sin superadministrador activo\
            \ (`RN-SP-001`), algún rol excede los permisos del actor (`RN-SEG-010`),\
            \ o la persona tiene equipo a cargo (`RN-SP-022`) — este último informa\
            \ cuántas personas, nunca quiénes"
        "500":
          description: Fallo no controlado (`ERR-500`)
  /api/v1/users/{id}/password-reset:
    post:
      tags:
      - Usuarios
      summary: Restablecer la contraseña de una persona
      description: |
        Fija una credencial **provisional** sobre la cuenta indicada. `POST`
        sobre un subrecurso y no `PATCH` sobre el usuario: cada petición **crea**
        un restablecimiento, que es un hecho con fecha y con caducidad propia.

        **La credencial CADUCA.** Sin plazo, una cuenta restablecida y nunca
        usada conserva indefinidamente una contraseña que otra persona conoce, y
        nadie se entera porque no falla nada. Quien comprueba el plazo es el
        inicio de sesión.

        La cuenta queda marcada para **cambio obligatorio**: la ventana en que
        dos personas conocen la misma contraseña se cierra en el primer inicio
        de sesión.

        **No toca el estado ni el bloqueo**: restablecer no es reactivar. Una
        cuenta desactivada sigue desactivada.

        **La contraseña asignada no se devuelve**: la conoce quien la escribió, y
        repetirla la expondría a cualquier registro de la operación. Tampoco la
        fecha de caducidad — quien la necesite consulta el detalle.

        Revoca **todas** las sesiones de la persona.
      operationId: restablecerContrasena
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
        required: true
      responses:
        "204":
          description: Credencial fijada.
        "400":
          description: Contraseña ausente (`VAL-001`) o que no cumple la política
            (`VAL-002`)
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: Autenticado sin `users:reset-password` (`AUTH-002`)
        "404":
          description: La persona no existe o está eliminada (`VAL-004`)
        "409":
          description: "Es la cuenta del propio actor (`RN-SP-017`). El mensaje indica\
            \ cuál es la operación correcta: cambiar la propia contraseña, que exige\
            \ conocer la actual"
        "500":
          description: Fallo no controlado (`ERR-500`)
  /api/v1/users/{id}/deletion:
    post:
      tags:
      - Usuarios
      summary: Eliminar a una persona
      description: |
        Eliminación **lógica** y con motivo declarado. `POST` sobre un
        subrecurso y no `DELETE` con cuerpo: RFC 9110 no define semántica para
        el cuerpo de un `DELETE` y un intermediario puede descartarlo,
        convirtiendo la petición en un rechazo por motivo ausente que el actor
        no puede entender. Y tampoco por *query string*, o el motivo acabaría en
        los registros de acceso de los proxies.

        **El motivo se verifica el primero de todo**, antes incluso de saber si
        la persona existe.

        La operación **retira sus roles y su membresía**, **cierra** su
        asignación de superior —cerrarla, nunca borrarla: es historial de
        mando— y **revoca sus sesiones**, todo en la misma transacción y con la
        misma marca de tiempo.

        **El estado NO se toca**: se conserva como estaba para que el registro
        de eliminación diga en qué situación estaba la persona cuando se la
        eliminó.

        El `404` **no distingue** «nunca existió» de «ya estaba eliminada».
      operationId: eliminar
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteUserRequest"
        required: true
      responses:
        "204":
          description: Persona eliminada.
        "400":
          description: "Motivo ausente o vacío (`VAL-001`), o campo desconocido"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: "Autenticado sin `users:delete` (`AUTH-002`), o es la cuenta\
            \ del propio actor (`RN-SP-017`)"
        "404":
          description: "No existe, o ya estaba eliminada (`EX-004`)"
        "409":
          description: "Es el último superadministrador activo (`RN-SP-001`), o tiene\
            \ personas a cargo (`RN-SP-022`)"
        "500":
          description: Fallo no controlado (`ERR-500`)
  /api/v1/user-commission-rates:
    get:
      tags:
      - Comisiones
      summary: Consultar las tasas personalizadas
      description: |
        Devuelve las tasas **tal como se declararon**, y no resuelve cuál se
        aplica: para eso está `GET /api/v1/commissions/effective`.

        **Incluye el historial**: las vencidas viajan junto a la vigente salvo que
        se filtre por fecha con `onDate`. Y es **el único historial que le queda al
        módulo** — las tasas de rol perdieron la vigencia.

        **Filtrar por persona devuelve las declaradas PARA esa persona**, no la que
        le aplica hoy sobre un producto.
      operationId: listar_1
      parameters:
      - name: filtros
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/ListUserCommissionRatesRequest"
      responses:
        "200":
          description: Página de tasas personalizadas
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserCommissionRatePageResponse"
        "400":
          description: Parámetros inválidos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserCommissionRatePageResponse"
        "403":
          description: Sin permiso
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserCommissionRatePageResponse"
    post:
      tags:
      - Comisiones
      summary: Registrar la tasa personalizada de una persona
      description: |
        Declara que **esta persona** gana este porcentaje, y **deja la tasa
        creada sin que rija todavía en ninguna parte**.

        **Para ponerla en vigor hay que asociarla a productos**, con
        `POST /api/v1/user-commission-rates/{id}/products`. Es exactamente el
        mismo mecanismo que las tasas de rol, y desde el 11-09-2026 sin
        excepción: `RN-CM-012` dice que **ninguna tasa rige hasta que se
        asocia**, y esta era la única que se saltaba la regla — pagaba desde el
        primer día sobre **todo el catálogo**.

        **Lo que eso cuesta conviene saberlo**: una tasa creada y no asociada
        **parece configurada y no paga nada**, y eso no falla — se descubre
        liquidando.

        **No lleva rol, y eso tiene una consecuencia que conviene conocer**: la
        tasa sigue rigiendo aunque su titular pase a un rol que no comisiona.
        Hasta el 01-09-2026 el rol era obligatorio precisamente para impedirlo.

        **Aquí NO se comprueba el solapamiento**, y es deliberado: sin producto
        no hay solapamiento posible. Dos tasas de la misma persona con fechas que
        se pisan son legítimas mientras rijan en productos distintos, y
        `RN-CM-006` se verifica **al asociar**.

        **Tampoco se acota el `fixedAmount`**: una tasa sin asociar no conoce el
        precio de nada (`RN-CM-018`). El tope lo pone `RN-CM-019` al asociarla.

        `validFrom` es obligatorio; sin `validTo`, rige indefinidamente.
      operationId: registrar_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterUserCommissionRateRequest"
        required: true
      responses:
        "201":
          description: Tasa registrada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserCommissionRateResponse"
        "400":
          description: Datos inválidos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserCommissionRateResponse"
        "403":
          description: Sin permiso
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserCommissionRateResponse"
        "422":
          description: La persona no existe
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserCommissionRateResponse"
  /api/v1/user-commission-rates/{id}/products:
    post:
      tags:
      - Comisiones
      summary: Asociar una tasa personalizada a un producto
      description: |
        **Es la operación que pone la tasa en vigor.** Hasta que se asocia no
        paga nada a nadie (`RN-CM-012`) — igual que una tasa de rol, y desde el
        11-09-2026 sin excepción: hasta esa fecha la personalizada pagaba desde
        el primer día sobre **todo el catálogo**.

        **Un producto por petición, y admite varios en llamadas sucesivas.**
        Donde esté asociada gana sobre la tasa del rol de esa persona; donde no,
        esa persona cobra por su rol como cualquier otra.

        **Devuelve la lista COMPLETA de productos** tras la operación, no solo el
        que se acaba de añadir: quien asocia el tercero tiene que poder ver los
        tres sin una segunda llamada.

        **`RN-CM-006` se comprueba aquí**: esa persona no puede tener dos tasas
        vivas que cubran el mismo día **sobre el mismo producto**. Sobre
        productos distintos sí, y es lo normal. La comprobación se hace **al
        asociar y no al registrar**, porque sin producto no hay solapamiento
        posible.

        **Un `fixedAmount` no puede superar el precio del producto**
        (`RN-CM-019`). Es el mismo tope que las de rol, y es **individual, no una
        suma**: las personalizadas de personas distintas sobre el mismo producto
        son alternativas entre sí, no cosas que se paguen a la vez.

        El producto debe existir y **no estar retirado**: configurar lo que nadie
        puede vender no falla nunca y no sirve nunca.
      operationId: asociar
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssociateUserProductRequest"
        required: true
      responses:
        "201":
          description: "Asociada, con la lista completa"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserRateProductsResponse"
        "400":
          description: Producto ausente
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserRateProductsResponse"
        "403":
          description: Sin permiso
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserRateProductsResponse"
        "404":
          description: La tasa no existe o está retirada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserRateProductsResponse"
        "409":
          description: "Ya estaba asociada, se solapa con otra tasa viva de esa persona\
            \ en ese producto, el producto está retirado, o pagaría más del precio\
            \ del producto"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserRateProductsResponse"
        "422":
          description: El producto no existe
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserRateProductsResponse"
  /api/v1/user-commission-rates/{id}/products/{productId}/deletion:
    post:
      tags:
      - Comisiones
      summary: Retirar la asociación de una tasa personalizada con un producto
      description: |
        **Deja de regir ahí, y la tasa sigue viva.** Puede volver a asociarse a
        ese producto o a otro; retirarla es otra operación.

        **El motivo es obligatorio.** La fila se borra de verdad —una asociación
        es configuración vigente, no un hecho del pasado— de modo que este texto
        es **el único sitio** donde quedará escrito por qué esa persona dejó de
        tener su excepción en ese producto.

        **`404` y no `409` si ya no estaba**: con el borrado físico no queda nada
        que distinga «nunca existió» de «ya se borró», y un `409` afirmaría algo
        que no se sabe.
      operationId: desasociar
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: productId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DissociateProductRequest"
      responses:
        "204":
          description: Desasociada
        "400":
          description: "Motivo ausente, en blanco o demasiado largo"
        "403":
          description: Sin permiso
        "404":
          description: Esa tasa no está asociada a ese producto
  /api/v1/user-commission-rates/{id}/deletion:
    post:
      tags:
      - Comisiones
      summary: Retirar una tasa personalizada
      description: |
        Retira una tasa que **no debió existir**, con **motivo obligatorio**.

        **Retirar no es cerrar la vigencia**: se cierra lo que dejó de regir, se
        retira lo que fue un error. Por eso el retiro **no toca la vigencia** — el
        registro de eliminación debe poder decir qué periodo cubría lo retirado.

        Los días que ocupaba **quedan libres**, de modo que puede declararse otra
        tasa que los cubra.

        **No es idempotente**: retirar dos veces devuelve `409`.
      operationId: retirar
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteCommissionRateRequest"
      responses:
        "204":
          description: Tasa retirada
        "400":
          description: "Motivo ausente, en blanco o demasiado largo"
        "403":
          description: Sin permiso
        "404":
          description: La tasa no existe
        "409":
          description: Ya estaba retirada
  /api/v1/roles:
    get:
      tags:
      - Roles
      summary: Consultar roles
      description: |
        Listado paginado con filtros, búsqueda y ordenamiento. Es la entrada
        natural a la administración de accesos: de aquí se navega al detalle de
        cada rol.

        **El orden por defecto es `code,asc`**: el código es el identificador
        con el que se habla de un rol en la documentación y en la auditoría.
        Solo se puede ordenar por la lista blanca —`code`, `name`, `roleType`,
        `status`, `createdAt`, `updatedAt`—; cualquier otro campo devuelve
        `400` y **no llega a la base de datos**.

        **No incluye los permisos de cada rol** ni el número de usuarios
        asignados: la primera pregunta la responde el detalle
        (`GET /api/v1/roles/{id}`) y la segunda se hace sobre un rol concreto,
        no sobre la lista.

        **`parentRoleId` no se valida contra el catálogo.** Filtra por el padre
        **directo** —no por el subárbol— y uno inexistente devuelve la
        colección vacía, que no es un error.

        La búsqueda va sobre código y nombre, **sin distinguir acentos ni
        mayúsculas**, y por fragmento: `ministracion` encuentra
        `ADMINISTRACION`. Un término en blanco equivale a no filtrar.

        **Los eliminados quedan fuera salvo que se pidan** con
        `includeDeleted=true`; cuando se piden, `deletedAt` es lo que permite
        distinguirlos.
      operationId: listar_2
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: sort
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: roleType
        in: query
        required: false
        schema:
          type: string
      - name: parentRoleId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: search
        in: query
        required: false
        schema:
          type: string
      - name: includeDeleted
        in: query
        required: false
        schema:
          type: boolean
      responses:
        "200":
          description: Página de roles.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponse"
        "400":
          description: "Paginación fuera de límites, campo de ordenamiento no admitido\
            \ (`VAL-003`), o `status`/`roleType` fuera de su dominio (`VAL-004`).\
            \ Se evalúan y se devuelven **juntos** en `errors`"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: Autenticado sin `roles:read` (`AUTH-002`)
        "500":
          description: Fallo no controlado (`ERR-500`)
    post:
      tags:
      - Roles
      summary: Registrar un rol
      description: |
        Registra un rol bajo un rol padre existente y activo, con los permisos que
        se declaren.

        Los permisos deben estar contenidos en los del rol padre (`RN-SEG-003`) y en
        los permisos efectivos de quien ejecuta el alta (`RN-SEG-010`). Declararlos es
        opcional: sin ellos el rol queda registrado y a la espera de `RF-SP-005`.

        El rol nace siempre **activo** y nunca de sistema. Ni `status` ni `isSystem`
        se admiten en el cuerpo: enviarlos devuelve `400`.
      operationId: registrar_2
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleRequest"
        required: true
      responses:
        "201":
          description: Rol registrado. La cabecera `Location` lleva su dirección.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "400":
          description: "Formato u obligatoriedad incumplidos (`VAL-001` a `VAL-004`,\
            \ `VAL-007`, `VAL-008`), o el cuerpo trae un campo que este endpoint no\
            \ admite"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: Autenticado sin `roles:create` (`AUTH-002`)
        "409":
          description: "Código o nombre ya en uso (`RN-SEG-001`), permiso fuera del\
            \ rol padre (`RN-SEG-003`) o fuera del alcance del actor (`RN-SEG-010`)"
        "422":
          description: "El rol padre no existe o no está activo (`EX-002`), o algú\
            n permiso no está en el catálogo (`EX-005`)"
        "500":
          description: Fallo no controlado (`ERR-500`)
  /api/v1/roles/{id}/permissions:
    post:
      tags:
      - Roles
      summary: Agregar permisos a un rol
      description: |
        Asocia permisos al rol. **La operación se aplica entera o no se
        aplica**: un solo permiso que incumpla la contención rechaza la
        petición completa, porque aplicar los válidos dejaría el rol en un
        estado que nadie pidió.

        Cada permiso debe estar **contenido en los del rol padre**
        (`RN-SEG-003`) y **en los permisos efectivos de quien ejecuta la
        operación** (`RN-SEG-010`). Lo segundo no lo concede `roles:update`:
        ese permiso habilita a modificar roles, no a decidir con qué alcance.

        **El rol raíz omite la primera comprobación** —no tiene cota superior—
        y conserva la segunda.

        **Es idempotente y nunca retira nada**: los permisos ya declarados se
        ignoran sin error, y si no queda ninguno por agregar no se registra
        evento. Hasta 100 por petición.
      operationId: agregarPermisos
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RolePermissionsRequest"
        required: true
      responses:
        "200":
          description: Rol con sus permisos actualizados.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "400":
          description: Sin permisos (`VAL-001`) o más de 100 (`VAL-006`)
        "401":
          description: Token ausente o inválido (`AUTH-001`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "403":
          description: "Sin `roles:update`, o el rol está asignado al propio actor\
            \ (`RN-SEG-011`)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "404":
          description: El rol no existe o está eliminado (`EX-006`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "409":
          description: "Rol de sistema (`RN-SEG-012`), permiso fuera del rol padre\
            \ (`RN-SEG-003`) o fuera del alcance del actor (`RN-SEG-010`)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "422":
          description: Uno o más permisos no existen en el catálogo (`EX-003`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "500":
          description: Fallo no controlado (`ERR-500`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
  /api/v1/roles/{id}/permissions/revocations:
    post:
      tags:
      - Roles
      summary: Retirar permisos de un rol
      description: |
        Desasocia permisos del rol, con **eliminación física** de la asociación
        y **sin exigir motivo**: es una asociación y no una entidad de negocio.

        **Se rechaza si un rol hijo directo declara alguno de los permisos que
        se retiran** (`RN-SEG-005`), y el error dice **qué rol** declara **qué
        permiso**: sin ese detalle no habría forma de saber qué corregir. Los
        hijos **inactivos cuentan igual** que los activos —el invariante vale
        siempre—, y los eliminados no.

        **No hay cascada**: nunca se retiran permisos de los descendientes.
        Usted decide en qué orden hacerlo.

        **Es idempotente**: los permisos que el rol no declaraba se ignoran sin
        error. Hasta 100 por petición, el mismo límite que al agregarlos.

        **`POST` sobre un subrecurso y no `DELETE`**: la operación recibe una
        lista en el cuerpo, y RFC 9110 no define semántica para el cuerpo de un
        `DELETE`.
      operationId: retirarPermisos
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RolePermissionsRequest"
        required: true
      responses:
        "200":
          description: Rol con sus permisos actualizados.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "400":
          description: Sin permisos (`VAL-001`) o más de 100 (`VAL-004`)
        "401":
          description: Token ausente o inválido (`AUTH-001`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "403":
          description: "Sin `roles:update`, o el rol está asignado al propio actor\
            \ (`RN-SEG-011`)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "404":
          description: El rol no existe o está eliminado (`EX-004`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "409":
          description: "Rol de sistema (`RN-SEG-012`), o un rol dependiente declara\
            \ el permiso (`RN-SEG-005`)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "500":
          description: Fallo no controlado (`ERR-500`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
  /api/v1/roles/{id}/deletion:
    post:
      tags:
      - Roles
      summary: Eliminar un rol
      description: |
        Elimina lógicamente el rol. **El motivo es obligatorio** y se verifica
        **antes de ejecutar nada** (Art. V.13); no se admite un valor generado
        por el sistema.

        **Se rechaza si el rol tiene roles hijos vigentes** —diciendo cuáles— o
        **personas asignadas** —diciendo cuántas— (`RN-SEG-008`). En el segundo
        caso la respuesta sugiere **desactivar** el rol, que suele ser lo que
        en realidad se quería: retirar el acceso sin perder el rol. El conteo
        incluye a las personas inactivas y bloqueadas, y excluye a las
        eliminadas.

        Tras eliminarlo, **su código y su nombre quedan libres** para un rol
        nuevo, y el rol deja de aparecer en el listado por defecto. La
        auditoría de eliminación conserva el motivo y el rol completo —con sus
        permisos por código— para poder reconstruir qué era.

        **`POST` sobre un subrecurso y no `DELETE`**: el motivo viaja en el
        cuerpo, y un intermediario puede descartar el cuerpo de un `DELETE`.
      operationId: eliminar_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteRoleRequest"
        required: true
      responses:
        "204":
          description: Rol eliminado. Sin cuerpo.
        "400":
          description: "Motivo ausente o vacío (`VAL-001`, `VAL-002`)"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: "Sin `roles:delete`, o el rol está asignado al propio actor\
            \ (`RN-SEG-011`)"
        "404":
          description: El rol no existe o ya está eliminado (`EX-006`)
        "409":
          description: "Rol de sistema (`RN-SEG-012`), rol raíz (`RN-SEG-007`), o\
            \ el rol tiene hijos o personas asignadas (`RN-SEG-008`)"
        "500":
          description: Fallo no controlado (`ERR-500`)
  /api/v1/products:
    get:
      tags:
      - Productos
      summary: Consultar el catálogo de productos
      description: |
        Devuelve el catálogo **paginado**, con el destino de cada upgrade y la
        moneda de cada precio ya resueltos: no hace falta una segunda consulta.

        **Los retirados quedan fuera salvo que se pidan** con `includeDeleted`.
        Al pedirlos se indica **desde cuándo** lo están; el **motivo** no viaja
        en el listado —uno a uno lo devuelve el detalle (`RF-PM-003`), en
        bloque sería una exportación de decisiones comerciales—. Verlos **no
        exige un permiso propio**: basta `products:read`.

        Cada fila trae **los dos precios**: `price` —el que se cobra— y
        `publicPrice` —el que se anuncia—, este **presente y nulo** en los
        productos que no lo declaran. Desde el 08-09-2026 los devuelven **las
        cuatro lecturas** del módulo y no solo esta (`RN-PM-024`).

        Y trae **`exchange`**, la conversión a la moneda por omisión con la
        tasa vigente hoy, calculada sobre el importe **que se muestra** —el
        público si existe y el del sistema si no—. Llega **presente y nula**
        cuando el producto ya está en esa moneda o cuando nadie declaró una
        tasa: eso **no es un error** y el producto se devuelve igual.

        Solo se puede ordenar por la lista blanca —`name`, `price`,
        `createdAt`—, con `,asc` o `,desc`. **`publicPrice` no está en ella**:
        ordenar por lo que se anuncia no responde ninguna pregunta de quien
        administra. **Un campo fuera de la lista se rechaza y no se ignora**:
        ignorarlo devolvería un orden distinto del pedido sin decirlo. Por omisión se ordena por **fecha de alta
        descendente**, y el orden aplicado viaja en la respuesta.

        **`targetMembershipId` no se valida contra el catálogo de membresías.**
        Filtrar por un destino inexistente devuelve la colección vacía y no es
        un error; combinarlo con `type=BOT` también, porque ningún
        bot tiene destino.

        La búsqueda va sobre el nombre, **sin distinguir acentos ni
        mayúsculas** y por fragmento. En blanco equivale a no filtrar.

        **`scope` e `implementation` filtran como `type` y `status`**: se
        admiten en cualquier caja y un valor fuera de dominio se rechaza junto
        al resto de parámetros inválidos, no en una vuelta aparte. El de
        alcance es **el único sitio donde ese dato se consulta hoy** — la
        oferta de `RF-PM-007` no filtra por él.

        Un filtro sin coincidencias devuelve `200` con la colección vacía, y
        una página más allá de la última hace lo mismo **con el total real**.
        No hay `404` ni `422`.
      operationId: listar_3
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: sort
        in: query
        required: false
        schema:
          type: string
      - name: type
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: scope
        in: query
        required: false
        schema:
          type: string
      - name: implementation
        in: query
        required: false
        schema:
          type: string
      - name: sourceMembershipId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: targetMembershipId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: search
        in: query
        required: false
        schema:
          type: string
      - name: includeDeleted
        in: query
        required: false
        schema:
          type: boolean
      responses:
        "200":
          description: "Página del catálogo, con el orden aplicado."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductPageResponse"
        "400":
          description: "Paginación fuera de rango (`VAL-001`), tipo (`VAL-002`) o\
            \ estado (`VAL-003`) fuera de su dominio, identificador mal formado (`VAL-004`)\
            \ o campo de ordenamiento no admitido (`VAL-005`). Los cuatro primeros\
            \ se devuelven **juntos**"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: Autenticado sin el permiso `products:read` (`AUTH-002`)
        "500":
          description: Fallo no controlado (`ERR-500`)
    post:
      tags:
      - Productos
      summary: Registrar un producto
      description: |
        Registra un producto del catálogo, **siempre inactivo**: publicarlo es otra
        operación (`RF-PM-005`).

        El tipo decide qué campos son obligatorios: un `UPGRADE_MEMBRESIA` debe
        declarar **las dos** membresías —de qué nivel sale y a cuál lleva— y un
        `BOT` no puede declarar ninguna.

        **El origen no puede estar por encima del destino**: eso sería vender un
        descenso llamándolo upgrade, y se rechaza con `422` (`EX-006`). **Sí
        puede ser el MISMO**, y entonces el producto es una **renovación**: lo
        que vende es tiempo —su `validityDays`— y no un cambio de nivel.

        **Y no tiene por qué ser el inmediatamente inferior**: saltar niveles es
        legítimo, y es la razón de que el origen se declare en lugar de
        deducirse de la cadena.

        `icon` es el **nombre** del icono con el que el frontend pinta el producto
        —no una imagen—, en minúsculas y guion medio. Es **opcional**, y solo un
        `UPGRADE_MEMBRESIA` puede llevarlo: en un `BOT` se rechaza (`RN-PM-016`).

        La vigencia es opcional en los dos tipos: sin ella, lo adquirido no caduca.

        `scope` e `implementation` son **obligatorios y en los dos tipos**, y
        **no tienen valor por omisión**: `scope` dice hasta dónde se muestra el
        producto —`HOTLINKS` **incluye** `TIENDA`, no la sustituye— e
        `implementation` dice si lo comprado se aplica solo (`AUTOMATICA`) o
        espera a que un funcionario lo autorice (`MANUAL`).

        **Un producto lleva DOS precios y solo uno se cobra.** `price` es el
        del sistema —el que copia la venta y sobre el que se comisiona— y
        `publicPrice` es con el que **se anuncia**: es **opcional**, no
        interviene en ningún cálculo y se expresa en la **misma moneda**.
        Ausente o nulo significan lo mismo —el producto se anuncia con el del
        sistema—, y **eso no es «vale cero»** (`RN-PM-023`).

        Los dos importes se validan igual: **no negativos** —el **cero se
        admite** desde que existe la renovación de una membresía gratuita— y
        con los decimales que declare su moneda. El rechazo **nombra el
        campo** que incumple.

        **Los dos solo se ven desde administración** (`RN-PM-024`): la oferta
        de un cliente y el hotlink público devuelven **uno**.
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterProductRequest"
        required: true
      responses:
        "201":
          description: "Producto registrado, en estado `INACTIVO`."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          description: Datos inválidos (serie `VAL-nnn`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "403":
          description: Autenticado sin el permiso `products:create` (`AUTH-002`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "409":
          description: "Código o nombre ya en uso (`EX-005`, `EX-001`)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "422":
          description: "Membresía inexistente, moneda inexistente o inactiva, o un\
            \ origen POR ENCIMA del destino (`EX-002`, `EX-003`, `EX-006`)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductResponse"
  /api/v1/products/{id}/deletion:
    post:
      tags:
      - Productos
      summary: Retirar un producto del catálogo
      description: |
        Retira el producto: **eliminación lógica y con motivo** (Art. V.13).
        La fila se conserva —lo vendido tiene que seguir resolviendo a lo que
        se vendió— y el producto deja de ofrecerse.

        **`POST` sobre un subrecurso y no `DELETE` con cuerpo**, igual que al
        eliminar un rol o una persona: RFC 9110 no define semántica para el
        cuerpo de un `DELETE` y un intermediario puede descartarlo, con lo que
        la petición se convertiría en un rechazo por motivo ausente que quien
        la envió no puede entender ni corregir. Y tampoco en la URL, donde el
        motivo quedaría escrito en los registros de acceso de cualquier proxy.

        **El motivo es obligatorio** y se comprueba lo primero de todo, antes
        de tocar la base.

        **El estado no se modifica al retirar.** El registro de eliminación
        conserva si el producto **estaba a la venta**: desactivarlo «de paso»
        haría que todos los registros dijeran «inactivo» y ese dato dejaría de
        significar nada.

        **Qué libera el retiro y qué no**: el **destino** del upgrade queda
        libre para que otro se active, y el **nombre** queda libre para otro
        producto. El **código no se libera nunca** — el día que una factura
        diga `UPGRADE_ORO` tiene que resolver a un solo producto para siempre.

        **No es idempotente a propósito**: retirar uno ya retirado devuelve
        `409`. Dos motivos sobre un solo hecho es evidencia contradictoria.

        No devuelve el producto: lo que se acaba de retirar no es algo que el
        sistema deba seguir ofreciendo a quien lo pidió.
      operationId: retirar_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteProductRequest"
      responses:
        "204":
          description: Producto retirado.
        "400":
          description: "Identificador sin forma canónica (`VAL-001`), motivo ausente\
            \ o en blanco (`VAL-002`) o demasiado largo (`VAL-003`)"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: Autenticado sin el permiso `products:delete` (`AUTH-002`)
        "404":
          description: No existe un producto con ese identificador (`EX-001`)
        "409":
          description: El producto ya estaba retirado (`EX-002`)
        "500":
          description: Fallo no controlado (`ERR-500`)
  /api/v1/movements:
    post:
      tags:
      - Movimientos
      summary: Registrar una venta a nombre de un cliente
      description: |
        Deja constancia de **qué le vendió la empresa a un cliente**, como un hecho que
        **todavía no está pagado**.

        **La venta nace `PENDIENTE`, y eso significa que no concede nada.** No sube de
        nivel a nadie, no habilita ninguna cuenta y no comisiona: registrar una venta
        **no cambia absolutamente nada fuera de este módulo**. Confirmarla es otra
        operación.

        **El precio no se envía: se toma del catálogo.** Se indica qué productos y
        cuántos, nunca cuánto cuestan — un precio que llegara en la petición sería un
        descuento sin autorización y sin rastro. Tampoco se envían la moneda, la
        vigencia ni el vendedor: la moneda y la vigencia salen del producto, y **el
        vendedor sale del cliente** y se congela en la venta.

        **Lo copiado queda congelado.** Corregir mañana el precio de un producto, o
        reasignar el cliente a otro agente, no cambia lo que se vendió hoy.

        Reglas de composición: **como mucho un upgrade** por venta y con cantidad uno,
        sin productos repetidos y todas las líneas en la misma moneda.
      operationId: registrar_3
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterSaleRequest"
        required: true
      responses:
        "201":
          description: "Venta registrada, pendiente de pago."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SaleResponse"
        "400":
          description: "Lo que se ve mirando la petición: falta el cliente o el mé\
            todo de pago, no hay líneas, la cantidad no es positiva, un producto se\
            \ repite, o la fecha del hecho está en el futuro."
        "403":
          description: Sin el permiso `movements:create`.
        "409":
          description: "Lo que solo se sabe después de resolver: la cuenta no puede\
            \ operar todavía, el cliente no cuelga de ningún vendedor, un producto\
            \ no está en su oferta, el upgrade BAJA de nivel —renovar el mismo sí\
            \ se admite—, hay dos upgrades, las monedas difieren, o el método de pago\
            \ está desactivado."
        "422":
          description: "Un dato bien formado que no resuelve: el cliente, un producto\
            \ o el método de pago no existen."
  /api/v1/memberships:
    get:
      tags:
      - Membresías
      summary: Consultar la cadena de membresías
      description: |
        Devuelve la cadena completa, de la superior al extremo inferior, sin paginar.

        `level` es la distancia hasta la cima: `1` es la superior. El orden de la
        colección lo refleja.

        No se admite paginación ni ordenamiento: el orden **es** la información.
        Los parámetros de paginación se ignoran y devuelven la cadena entera.
      operationId: consultar
      parameters:
      - name: peticion
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/ListMembershipsRequest"
      responses:
        "200":
          description: Cadena devuelta. Puede venir vacía si aún no hay membresías.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MembershipChainResponse"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: Autenticado sin `memberships:read` (`AUTH-002`)
        "500":
          description: Fallo no controlado (`ERR-500`)
    post:
      tags:
      - Membresías
      summary: Registrar una membresía
      description: |
        Inserta una membresía en la cadena, por encima de la hija indicada.

        Si no se indica hija, la membresía queda en el extremo inferior y no se
        reordena nada. Si se indica, la nueva ocupa su nivel, hereda su superior
        y todo lo que estaba en ese nivel o por debajo baja uno.

        El nivel y la superior **no se envían**: los calcula el sistema. Enviar
        `level` o `parentMembershipId` devuelve `400`.
      operationId: registrar_4
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterMembershipRequest"
        required: true
      responses:
        "201":
          description: "Membresía registrada, con la posición que ocupó."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MembershipResponse"
        "400":
          description: "Formato u obligatoriedad incumplidos, o campo no admitido\
            \ en el cuerpo"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: Autenticado sin `memberships:create` (`AUTH-002`)
        "409":
          description: "Código o nombre ya en uso (`EX-001`), o la cadena cambió durante\
            \ la operación (`EX-003`) y debe reintentarse"
        "422":
          description: La membresía hija indicada no existe (`EX-002`)
        "500":
          description: Fallo no controlado (`ERR-500`)
  /api/v1/exchange-rates:
    post:
      tags:
      - Tasas de cambio
      summary: Registrar una tasa de cambio
      description: |
        Declara **a cuánto se cambia una moneda por otra y desde cuándo**.

        `price` es **cuántas unidades de la moneda de destino da UNA de la de
        origen**: `USD → COP` a `4150` significa que un dólar da cuatro mil
        ciento cincuenta pesos. **La dirección contraria no se deduce** — la
        inversa aritmética casi nunca es la tasa real, y calcularla produciría
        un número plausible y falso. Quien necesite las dos declara **dos
        tasas**.

        **Ocho decimales**, y no los de ninguna moneda: una tasa **no es un
        importe**, es un cociente entre dos monedas. Con cuatro, `COP → USD`
        se guardaría redondeada y una moneda más devaluada, como cero.

        **`validFrom` es obligatoria y `validTo` no**: sin ella la tasa es
        **vitalicia**. Ausente y `null` significan lo mismo. Una vigencia que
        empieza y termina el mismo día es legítima, y una que **empieza en el
        futuro** también — es lo que hace innecesario un estado «programada».

        **`isActive` es opcional y por omisión verdadero.**

        **Dos tasas activas del mismo par no pueden solaparse** (`RN-SP-032`),
        y los **dos extremos de la vigencia cuentan**: una que termina el 30 de
        junio choca con otra que empieza el 30 de junio. El choque devuelve
        `409` y **no registra nada**: el sistema **no** cierra ni recorta la
        tasa anterior, porque resolver el conflicto es una decisión de quien
        administra, no del servidor.
      operationId: registrar_5
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterExchangeRateRequest"
        required: true
      responses:
        "201":
          description: Tasa registrada.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExchangeRateResponse"
        "400":
          description: Datos inválidos (serie `VAL-nnn`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExchangeRateResponse"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExchangeRateResponse"
        "403":
          description: Autenticado sin el permiso `exchange-rates:create` (`AUTH-002`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExchangeRateResponse"
        "409":
          description: Se solapa con una tasa vigente del mismo par (`EX-002`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExchangeRateResponse"
        "422":
          description: Moneda inexistente o desactivada (`EX-001`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExchangeRateResponse"
  /api/v1/countries:
    get:
      tags:
      - Países
      summary: Consultar el catálogo de países
      description: |
        Devuelve el catálogo completo, sin paginar, **ordenado alfabéticamente
        por nombre** según la intercalación del español — no por orden de bytes.

        La búsqueda actúa sobre código y nombre, ignorando mayúsculas y acentos.
        Sin coincidencias devuelve una colección vacía, no un error.

        Los países inactivos no aparecen salvo que se pidan, y entonces se
        **añaden** a los activos. La búsqueda y el estado son independientes.
      operationId: consultar_1
      parameters:
      - name: peticion
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/ListCountriesRequest"
      responses:
        "200":
          description: Catálogo devuelto. Puede venir vacío.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CountryCatalogResponse"
        "400":
          description: El parámetro de inclusión no es booleano
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: Autenticado sin el permiso de lectura de países (`AUTH-002`)
        "500":
          description: Fallo no controlado (`ERR-500`)
    post:
      tags:
      - Países
      summary: Registrar un país
      description: |
        Registra un país en el catálogo. Queda **activo** siempre: el estado no
        se envía y enviarlo devuelve `400`.

        El código se normaliza a mayúsculas y se recorta, porque lo fija
        ISO 3166-1 alfa-3 y no lo inventa nadie: `col`, ` COL` y `COL` son el
        mismo país. Son tres letras y no dos.

        El nombre admite acentos y caracteres no latinos sin transformación
        alguna, pero **no puede coincidir** con otro ya registrado ignorando
        mayúsculas y acentos: el catálogo no se edita, y el duplicado sería
        permanente.
      operationId: registrar_6
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterCountryRequest"
        required: true
      responses:
        "201":
          description: "País registrado, con su código ya normalizado."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CountryResponse"
        "400":
          description: "Código o nombre inválidos, o campo no admitido en el cuerpo"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: Autenticado sin el permiso de creación de países (`AUTH-002`)
        "409":
          description: Código o nombre ya presentes en el catálogo (`EX-001`)
        "500":
          description: Fallo no controlado (`ERR-500`)
  /api/v1/commission-rates:
    get:
      tags:
      - Comisiones
      summary: Consultar el catálogo de tasas por rol
      description: |
        Devuelve el **catálogo**, no lo que rige.

        **`associatedProducts` es el campo que hay que mirar**: una tasa con cero
        asociaciones aparece aquí con su porcentaje y **no paga nada a nadie**.

        Las tasas **personalizadas** no salen en este listado: están en
        `GET /api/v1/user-commission-rates`.

        **No hay filtro por fecha**, porque las tasas de rol no tienen vigencia:
        el catálogo solo sabe lo que dice hoy.
      operationId: listar_4
      parameters:
      - name: filtros
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/ListCommissionRatesRequest"
      responses:
        "200":
          description: Página de tasas
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommissionRatePageResponse"
        "400":
          description: Parámetros inválidos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommissionRatePageResponse"
        "403":
          description: Sin permiso
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommissionRatePageResponse"
    post:
      tags:
      - Comisiones
      summary: Registrar una tasa de comisión por rol
      description: |
        Declara cuánto gana un rol de tipo **vendedor** por vender.

        **Registrar una tasa NO la pone en vigor.** Hasta que se asocie a un
        producto con `POST /{id}/products`, **no paga nada a nadie**. La respuesta
        lleva `associatedProducts`, que aquí vale siempre cero.

        Esto es lo contrario de lo que ocurría antes del 01-09-2026, cuando una
        tarifa sin producto regía sobre **todo el catálogo**.

        **Varias tasas por rol son legítimas**: el catálogo puede ofrecer
        `AGENTE 10 %` y `AGENTE 15 %` para asociarlas a productos distintos.

        **El porcentaje cero es válido** y significa «esto no comisiona», que **no
        es lo mismo** que no declarar la tasa.
      operationId: registrar_7
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterCommissionRateRequest"
        required: true
      responses:
        "201":
          description: "Tasa registrada, y todavía sin regir"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommissionRateResponse"
        "400":
          description: "Datos inválidos, o el rol no es vendedor"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommissionRateResponse"
        "403":
          description: Sin permiso
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommissionRateResponse"
        "422":
          description: El rol no existe
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommissionRateResponse"
  /api/v1/commission-rates/{id}/products:
    get:
      tags:
      - Comisiones
      summary: Consultar sobre qué productos rige la tasa
      description: |
        **Una lista vacía significa que la tasa no paga nada a nadie**, por mucho
        que tenga porcentaje.

        No se pagina: una tasa se asocia a un puñado de productos.
      operationId: productosDeLaTasa
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Las asociaciones de la tasa
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductAssociationResponse"
        "403":
          description: Sin permiso
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductAssociationResponse"
    post:
      tags:
      - Comisiones
      summary: Asociar la tasa a un producto
      description: |
        **Es lo único que pone una tasa en vigor** (`RN-CM-012`). Sin esto, la tasa
        existe en el catálogo y no paga nada a nadie.

        **El rol no se envía**: se toma de la tasa que nombra la ruta, y el esquema
        hace imposible que diverja del que ella declara.

        **Un solo porcentaje por rol y producto** (`RN-CM-013`): si ese rol ya
        tiene otra tasa asociada a ese producto, devuelve `409`. Retire la
        asociación existente antes de declarar otra.

        **No se asocia a un producto retirado** ni desde una tasa retirada.

        **El producto no puede quedar pagando más del 100 % de sí mismo**
        (`RN-CM-019`): suma el porcentaje de sus tasas de rol ya asociadas
        —convirtiendo cada valor fijo contra el precio del producto— más el de
        esta, y devuelve `409` si pasa de cien.

        Devuelve **todas** las asociaciones de la tasa, no solo la nueva.
      operationId: asociar_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssociateProductRequest"
        required: true
      responses:
        "201":
          description: Asociada. Devuelve todas sus asociaciones
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductAssociationResponse"
        "400":
          description: Datos inválidos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductAssociationResponse"
        "403":
          description: Sin permiso
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductAssociationResponse"
        "404":
          description: La tasa no existe o está retirada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductAssociationResponse"
        "409":
          description: "Ese rol ya paga por ese producto, el producto está retirado,\
            \ o la suma pasaría de cien"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductAssociationResponse"
        "422":
          description: El producto no existe
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductAssociationResponse"
  /api/v1/commission-rates/{id}/products/{productId}/deletion:
    post:
      tags:
      - Comisiones
      summary: Retirar la asociación de la tasa con un producto
      description: |
        **Es la única forma de dejar de pagar sin retirar la tasa**: sigue en el
        catálogo y disponible para otros productos.

        **El borrado es físico** y la tabla no tiene retiro lógico, de modo que
        **el registro de eliminación es lo único que queda** de que esa tasa rigió
        alguna vez sobre ese producto. De ahí el **motivo obligatorio**.

        Si esa tasa no está asociada a ese producto devuelve `404` — y no `409`,
        porque al no quedar rastro no puede distinguirse «nunca existió» de «ya se
        borró».
      operationId: desasociar_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: productId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DissociateProductRequest"
      responses:
        "204":
          description: Asociación retirada
        "400":
          description: "Motivo ausente, en blanco o demasiado largo"
        "403":
          description: Sin permiso
        "404":
          description: Esa tasa no está asociada a ese producto
  /api/v1/commission-rates/{id}/deletion:
    post:
      tags:
      - Comisiones
      summary: Retirar una tasa de comisión por rol
      description: |
        Retira una tasa que **no debió existir**, con **motivo obligatorio**.

        **Una tasa asociada a algún producto no se retira** y devuelve `409`.
        Retire primero esas asociaciones: si no, el producto dejaría de comisionar
        **sin que nada lo indicara**, porque la asociación sobreviviría apuntando a
        una fila muerta.

        **Para dejar de pagar sin destruir la tasa**, use la desasociación
        (`POST /{id}/products/{productId}/deletion`): la tasa sigue en el catálogo
        y disponible para otros productos.

        **No es idempotente**: retirar dos veces devuelve `409`.
      operationId: retirar_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteCommissionRateRequest"
      responses:
        "204":
          description: Tasa retirada
        "400":
          description: "Motivo ausente, en blanco o demasiado largo"
        "403":
          description: Sin permiso
        "404":
          description: La tasa no existe
        "409":
          description: "Ya estaba retirada, o sigue asociada a algún producto"
  /api/v1/auth/registration:
    post:
      tags:
      - Registro por enlace
      summary: Registrarse desde el enlace de un vendedor
      description: |
        Crea una cuenta de cliente **sin autenticación**, a partir del enlace
        que un vendedor reparte. Es el **primer endpoint público del sistema
        que escribe**.

        El enlace lleva dos datos y **ninguno es un secreto**: el producto y el
        vendedor. **Los dos viajan dentro de `movement`** (`productId` y
        `sellerUsername`) y no en el primer nivel: hasta el 09-09-2026 estaban
        además duplicados como `product` y `referrer`, y dos campos para un
        dato son dos valores que pueden discrepar.

        `countryCode` va en alfa-3 y `documentType` por abreviación, porque es
        un formulario público al que no se le puede pedir que conozca los
        identificadores del sistema. Los que sí son UUID son los de lo que el
        formulario **acaba de leer de un catálogo**: el broker de cada cuenta y
        el producto.

        **`companyPhone` NO se admite aquí**, y enviarlo devuelve `400` por
        propiedad desconocida. El resto del sistema lo declara desde el
        10-09-2026, pero quien se registra por un enlace es un cliente y
        preguntarle por el teléfono de una empresa que no tiene añadiría un
        campo que nadie rellenaría. Puede ponerlo después desde su propio perfil
        (`PATCH /api/v1/users/me`). **Ignorarlo en silencio sería peor que
        rechazarlo**: haría creer a quien lo manda que quedó guardado.

        **El registro anota una venta** (`RN-SP-043`), siempre — también en el
        enlace gratuito. Nace `PENDIENTE`, de modo que registrarse **no paga
        nada**, y su código se devuelve en `sale`.

        **`brokerAccounts` es una LISTA: se declaran UNA O MÁS cuentas** en el
        mismo registro, porque una persona puede operar con varios brokers y
        esta es hoy la única vía para declararlos.

        **Es obligatoria —al menos una— cuando el producto del enlace es una
        membresía `BECA → BECA`** (`RN-SP-042`), y solo entonces. El motivo es
        el estado en el que nace la cuenta: sin cuenta de broker declarada,
        nadie podrá atribuirle el depósito que la saca de `FTD_PENDIENTE`. Con
        otro producto **se admiten igualmente** las que se envíen.

        **El nombre de usuario en el broker no se pide**: lo rellena después el
        webhook del propio broker.

        **Dos cuentas iguales en la misma petición se rechazan** con `VAL-014`,
        y no con el `409` del índice: ese mensaje diría «ya está declarada por
        otra persona», y la otra persona sería ella misma.

        **El estado en que nace la cuenta depende del producto**
        (`RN-SP-044`). Con un enlace `BECA → BECA` nace en `FTD_PENDIENTE`, que
        **autentica y no opera**: quien se registra puede iniciar sesión y ver
        lo suyo, y lo que le falta para operar es el primer depósito. Con un
        producto **de pago** nace **`ACTIVO`** —no hay ningún depósito que
        esperar— y recibe la membresía **del suelo**, no la comprada: esa la
        concede **confirmar la venta**, y no registrarse.

        **La contraseña la elige la persona**, y por eso la cuenta **no** queda
        marcada para cambio obligatorio — se marca lo que fijó otro, no lo que
        uno fijó.

        **No devuelve credenciales de sesión**: registrarse no es iniciar
        sesión. Quien acaba de crear su cuenta pasa por el inicio de sesión
        como todo el mundo.

        **Los rechazos no dicen qué pasó, salvo dos.** Producto inexistente,
        inactivo o retirado comparten respuesta, y lo mismo el vendedor que no
        existe y el que no es fuerza comercial: distinguirlos convertiría este
        endpoint en una forma de enumerar el catálogo y la plantilla. **Sí
        dicen** cuál de las dos identidades —nombre de usuario o correo— está
        en uso, y que la cuenta de broker ya está declarada por otra persona:
        los dos los necesita quien se registra para poder corregir.
      operationId: registrar_8
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelfRegistrationRequest"
        required: true
      responses:
        "201":
          description: "Cuenta creada —`FTD_PENDIENTE` con el enlace gratuito, `ACTIVO`\
            \ con uno de pago— y venta anotada en estado `PENDIENTE`"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SelfRegistrationResponse"
        "400":
          description: Datos inválidos (serie `VAL-nnn`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SelfRegistrationResponse"
        "409":
          description: "Nombre de usuario o correo en uso (`EX-005`), cuenta de broker\
            \ ya declarada (`EX-009`), o la venta no procede — método de pago en una\
            \ venta gratuita, o ausente en una con importe (`RN-MV-022`)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SelfRegistrationResponse"
        "422":
          description: "El enlace no procede (`EX-001`, `EX-002`, `EX-003`, `EX-006`,\
            \ `EX-007`, `EX-008`) o el movimiento no procede (`EX-010`)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SelfRegistrationResponse"
        "429":
          description: Demasiadas peticiones desde este origen
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SelfRegistrationResponse"
  /api/v1/auth/refresh:
    post:
      tags:
      - Sesión
      summary: Renovar la sesión
      description: |
        Rota el refresh token y entrega credenciales nuevas.

        **La rotación es la defensa:** el token entregado deja de servir, de
        modo que presentarlo de nuevo significa que existe una copia. En ese
        caso se revoca la **familia entera** de la sesión y se emite la alarma.

        Las cinco condiciones de rechazo devuelven la **misma** respuesta: el
        cliente no debe poder deducir si el token fue robado, si expiró o si la
        cuenta fue desactivada.
      operationId: refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
        required: true
      responses:
        "200":
          description: Credenciales renovadas.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          description: Refresh token ausente
        "401":
          description: "La sesión no es válida — cinco causas posibles, una sola respuesta"
        "500":
          description: Fallo no controlado (`ERR-500`)
      security: []
  /api/v1/auth/password:
    post:
      tags:
      - Sesión
      summary: Cambiar la propia contraseña
      description: |
        Sustituye la contraseña de **quien porta el token**.

        **No lleva identificador de usuario**, y esa ausencia es la
        implementación de la regla: no hay campo por el que dirigir la
        operación a un tercero. Restablecer la contraseña de otra persona es
        otra operación, con su propio permiso.

        La contraseña actual se comprueba **la última**, después del formato, de
        que la nueva sea distinta y de la política. Es el único paso que consume
        el contador de intentos: ponerlo antes haría que cinco peticiones
        descuidadas de un cliente propio bloquearan la cuenta de su titular.

        La contraseña actual incorrecta devuelve `422` y **no `401`**: un `401`
        le diría al cliente que su sesión ya no vale y lo mandaría a iniciar
        sesión, cuando lo único que ocurrió es que escribió mal su contraseña.

        **Aquí sí se dice qué falló**, al revés que al iniciar sesión: quien
        hace esta petición ya está autenticado y no se le revela nada que no
        supiera.

        Al cambiarla, **todas las sesiones se revocan**, incluida la que ejecutó
        el cambio.
      operationId: cambiarContrasena
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
        required: true
      responses:
        "204":
          description: Contraseña sustituida.
        "400":
          description: "Falta alguna de las dos (`VAL-001`, `VAL-002`), la nueva no\
            \ cumple la política (`VAL-004`) o es igual a la actual (`VAL-005`)"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "422":
          description: La contraseña actual no es correcta (`VAL-003`). Consume un
            intento
        "423":
          description: La cuenta quedó bloqueada al alcanzar el umbral de fallos
        "500":
          description: Fallo no controlado (`ERR-500`)
      security:
      - bearerAuth: []
  /api/v1/auth/password-recovery:
    post:
      tags:
      - Sesión
      summary: Solicitar la recuperación de la propia contraseña
      description: |
        Emite un permiso temporal de un solo uso y lo envía al correo de la
        cuenta. Público: quien olvidó su contraseña no puede autenticarse.

        **La respuesta es idéntica exista o no la identidad**, en el cuerpo y
        en el estado. No hay forma de usar este endpoint para averiguar qué
        cuentas existen, que es exactamente para lo que se usaría si
        distinguiera.

        Y lo es **también en el tiempo**: el envío ocurre después de responder
        y por otro camino. Igualar solo el mensaje dejaría la defensa
        declarada y no real — emitir y enviar cuesta cientos de milisegundos
        que se miden desde fuera con un cronómetro.

        **Tampoco rechaza nada más.** Ni la cuenta bloqueada, ni la inactiva:
        cualquiera de esos rechazos diría algo. El `202` es además el estado
        honesto — el sistema no puede afirmar que algo se entregó.

        **Emitir uno invalida el anterior**, de modo que nunca hay dos puertas
        abiertas a la vez sobre la misma cuenta.
      operationId: solicitarRecuperacion
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordRecoveryRequest"
        required: true
      responses:
        "202":
          description: Solicitud aceptada. **La misma respuesta exista o no la identidad**
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PasswordRecoveryResponse"
        "400":
          description: Falta el identificador (`VAL-001`)
        "429":
          description: "Demasiadas solicitudes, por identidad o por origen (`ERR-429`)"
        "500":
          description: Fallo no controlado (`ERR-500`)
      security: []
  /api/v1/auth/password-recovery/confirmation:
    post:
      tags:
      - Sesión
      summary: Confirmar la recuperación con el permiso recibido
      description: |
        Consume el permiso y fija la contraseña nueva. Público: lo que
        autoriza es el permiso, no un token.

        **La política se comprueba antes de tocar el permiso.** Una contraseña
        que no la cumple es un error de la persona legítima, y consumir su
        permiso por ello la obligaría a pedir otro —y a esperar otro correo—
        por haber escrito una contraseña corta.

        **El `422` no distingue sus cuatro causas** —permiso inexistente,
        caducado, ya usado o sustituido—: hacerlo le diría a quien prueba
        permisos al azar cuál estuvo a punto de acertar.

        La contraseña que se fija aquí **no es provisional**: la eligió su
        titular y nadie más la conoce, de modo que la cuenta no queda marcada
        para cambio obligatorio. Es la diferencia deliberada con el
        restablecimiento por un administrador.

        **No levanta el bloqueo ni cambia el estado de la cuenta.** Recuperar
        la contraseña prueba que se tiene el correo, no que alguien decidiera
        devolver el acceso.

        Al completarse, **todas las sesiones se revocan** y los tokens de
        acceso ya emitidos dejan de admitirse.
      operationId: confirmarRecuperacion
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordRecoveryConfirmation"
        required: true
      responses:
        "204":
          description: Contraseña sustituida.
        "400":
          description: "Falta el permiso (`VAL-002`) o la contraseña (`VAL-003`),\
            \ o esta no cumple la política (`VAL-004`). **No consume el permiso**"
        "422":
          description: "El permiso no es válido (`VAL-005`): inexistente, caducado,\
            \ ya usado o sustituido. **Los cuatro casos comparten respuesta**"
        "429":
          description: Demasiadas confirmaciones desde el mismo origen (`ERR-429`)
        "500":
          description: Fallo no controlado (`ERR-500`)
      security: []
  /api/v1/auth/logout:
    post:
      tags:
      - Sesión
      summary: Cerrar sesión
      description: |
        Revoca el refresh token de la sesión, o **todos** los de la persona si
        se pide.

        Responde `204` para **cualquier** token sintácticamente válido, exista o
        no, esté vigente o revocado. Distinguirlos permitiría comprobar con dos
        peticiones si una cadena de texto es un refresh token del sistema, y el
        resultado prometido —que ese token no sirva— se cumple igual.
      operationId: logout
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
        required: true
      responses:
        "204":
          description: Sesión cerrada.
        "400":
          description: Refresh token ausente o con formato imposible
        "500":
          description: Fallo no controlado (`ERR-500`)
      security: []
  /api/v1/auth/login:
    post:
      tags:
      - Sesión
      summary: Iniciar sesión
      description: |
        Autentica con **nombre de usuario o correo** —el mismo campo para los
        dos— y entrega las credenciales de sesión.

        El rechazo por credenciales lleva `remainingAttempts`: **cuántos
        intentos quedan** antes del bloqueo. El identificador que no
        corresponde a ninguna cuenta los gasta igual, de modo que el número no
        permite averiguar qué cuentas existen.

        La cuenta bloqueada recibe `423` y un mensaje que la identifica como
        tal: es una excepción consciente al mensaje genérico, porque quien
        provocó el bloqueo ya sabe que la cuenta existe. Si el bloqueo es
        **automático**, la respuesta añade `unlockAt` —el instante en que se
        levanta— y `retryAfterSeconds` —lo que falta—. El bloqueo **manual**
        no los lleva: esa cuenta no se desbloquea sola.

        **La espera no va escrita en el mensaje, y es deliberado.** Un texto
        con «vuelva en dos minutos» es cierto al serializarse y deja de serlo
        enseguida. Con `retryAfterSeconds` el cliente **descuenta** —una
        cuenta regresiva no envejece— sin depender de que su reloj coincida
        con el del servidor, que es lo que sí ocurriría calculándola a partir
        de `unlockAt`.

        Si la contraseña la fijó otra persona, la respuesta autentica **y
        advierte** con `mustChangePassword`: hace falta una sesión para poder
        cambiarla.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: Credenciales de sesión.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          description: Identificador o contraseña ausentes
        "401":
          description: "Credenciales inválidas, cuenta inexistente, inactiva o eliminada\
            \ — los cuatro casos comparten cuerpo y mensaje, sin una sola diferencia\
            \ observable. Lleva `remainingAttempts`; el intento que agota el contador\
            \ añade además `unlockAt` y `retryAfterSeconds`"
        "423":
          description: "Cuenta bloqueada. El bloqueo automático lleva `unlockAt` y\
            \ `retryAfterSeconds`; el manual no los lleva, porque no expira solo"
        "500":
          description: Fallo no controlado (`ERR-500`)
      security: []
  /api/v1/users/{id}:
    get:
      tags:
      - Usuarios
      summary: Consultar el detalle de una persona
      description: |
        Sus roles **con el estado de cada uno**, sus permisos efectivos, su
        membresía y el contexto de su acceso.

        Las dos primeras juntas son lo único que explica por qué una persona
        **con roles** no puede hacer nada: porque todos están inactivos y la
        lista de permisos llega vacía.

        Los permisos efectivos salen del **mismo componente que autoriza**, de
        modo que esta respuesta no puede contradecir a lo que el sistema hará
        con la siguiente petición de esa persona.

        `lockedUntil` nulo significa dos cosas distintas y eso es información:
        la cuenta no está bloqueada, o lo está **por decisión de un actor** y
        por tanto sin expiración. El estado desambigua.

        Trae el `country`, el `document` y el `contact` de la persona. El
        contacto lleva **dos teléfonos**: `phone`, el personal, y `companyPhone`,
        el de la empresa — este último **opcional**, de modo que llega presente y
        en nulo cuando la persona no lo declaró.

        **`country` nunca es nulo y `document` sí puede serlo**: quienes se
        registraron antes de que el documento fuera obligatorio no lo tienen, y
        **esta pantalla es donde esa ausencia se ve** — es la que sirve para
        saber a quién hay que completar.

        **El país y el tipo de documento se devuelven aunque estén inactivos.**
        Retirarlos del catálogo los quita de los desplegables del alta; no
        cambia dónde está ni con qué se identifica quien ya los tenía, ni lo
        oculta a quien administra.

        **No devuelve intentos fallidos** —diría cuántos le quedan a una cuenta
        antes de bloquearse—, **ni dato alguno de la credencial**, **ni el
        superior comercial**, que tiene su propio endpoint.

        Una persona eliminada devuelve el **mismo** `404` que una inexistente,
        sin ninguna pista de que existió.
      operationId: detalle
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: La persona.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserDetailResponse"
        "400":
          description: El identificador no es un UUID en forma canónica (`VAL-001`)
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: Autenticado sin `users:read` (`AUTH-002`)
        "404":
          description: "No existe, o está eliminada (`EX-001`)"
        "500":
          description: Fallo no controlado (`ERR-500`)
    patch:
      tags:
      - Usuarios
      summary: Editar los datos de una persona
      description: |
        Modifica el nombre, los apellidos, el correo, el país, la **identidad
        documental** y los **datos de contacto**. `PATCH` y no `PUT`:
        `PUT` obligaría a enviar el recurso completo —incluidos el nombre de
        usuario, el estado y los roles, que esta operación **no** puede
        modificar— y habría que decidir qué hacer si llegaran con otros valores.

        **Todos los campos son opcionales, y el nulo explícito NO significa lo
        mismo en todos.** El campo ausente nunca se toca; con el nulo hay **dos
        familias**, y la línea que las separa es la de lo obligatorio y lo
        opcional:

        - **Lo rechazan con `400`**: `firstName`, `lastName`, `email`,
          `countryId`, `documentTypeId`, `documentNumber` y `phone`. Su columna
          no admite ausencia, y aceptarlo produciría un `500` en lugar del `400`
          que corresponde.
        - **Lo aceptan y VACÍAN el campo**: `addressLine1`, `addressLine2`,
          `city` y `companyPhone`. Son opcionales, y «ya no vive ahí» —o «ya no
          tiene ese número»— es un hecho que hay que poder registrar.

        **`companyPhone` cae del lado que vacía aunque sea un teléfono**, y es la
        comprobación de que la línea está bien trazada: comparte forma y
        validación con `phone` y aun así va del otro lado, porque lo que decide
        no es qué dato es sino si `RN-SP-037` lo exige.

        **El tipo y el número de documento se envían juntos o no se envían.**
        Enviar uno solo devuelve `400`: un número sin decir de qué documento es
        no significa nada.

        **Esta es la ÚNICA operación que cambia el documento y el país.** El
        titular no puede tocarlos desde `PATCH /api/v1/users/me`.

        **Se comprueba el destino, nunca el actual.** Un país o un tipo de
        documento inactivos se rechazan **como destino**; que los vigentes de
        la persona lo estén no impide editarla — es justamente para eso que
        existe esta operación.

        **Corregir el documento no libera el anterior.** Es la diferencia
        deliberada con el correo, que sí queda libre: un documento identifica a
        alguien en el mundo real, y liberarlo permitiría que otra ficha lo
        tomara.

        **El nombre de usuario no se puede cambiar**, y enviarlo devuelve `400`
        por propiedad desconocida en lugar de ignorarse en silencio. Lo mismo
        con el estado, los roles, la membresía y la contraseña: cada uno tiene
        su operación.

        El correo se normaliza —recorte y minúsculas— **antes** de compararse,
        de modo que reenviar el propio en mayúsculas es un cambio sin efecto y
        no un conflicto consigo mismo.

        **El actor sí puede editarse a sí mismo**: corregir el propio apellido
        no concede ningún privilegio.
      operationId: editar
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
        required: true
      responses:
        "200":
          description: "La persona, con los datos actualizados."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: "Ningún campo informado (`VAL-001`), campo vaciado que no admite\
            \ vaciarse (`VAL-002`, `VAL-006` país, `VAL-007` documento, `VAL-008`\
            \ teléfono), tipo y número de documento sin su pareja (`VAL-007`), correo\
            \ inválido (`VAL-003`), longitud excedida (`VAL-005`) o campo desconocido\
            \ —incluidos el nombre de usuario, el estado, los roles y la contraseñ\
            a"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: Autenticado sin `users:update` (`AUTH-002`)
        "404":
          description: "No existe, o está eliminada (`EX-002`)"
        "409":
          description: "El correo ya está en uso (`RN-SP-016`). **El mensaje no dice\
            \ de quién es**: puede ser de alguien eliminado, y decirlo revelaría una\
            \ cuenta"
        "500":
          description: Fallo no controlado (`ERR-500`)
  /api/v1/users/{id}/supervisor:
    patch:
      tags:
      - Usuarios
      summary: Establecer o cambiar el superior comercial
      description: |
        `PATCH` sobre el subrecurso y no `PUT`: el cuerpo no representa el
        estado completo —falta el periodo, que lo fija el sistema— y `PUT`
        invitaría a pensar que se puede enviar.

        **No admite fecha de inicio.** La asignación rige desde que se ejecuta,
        siempre. Declararla obligaría a especificar solapamientos, huecos entre
        tramos y correcciones retroactivas sobre periodos ya liquidados.

        **No admite retirar el superior.** El estado «vendedor sin superior» no
        existe: la única salida es dejar de portar rol comercial retirándolo.

        Cada cambio **cierra** el tramo vigente con su fecha y **abre** otro:
        nunca se sobrescribe el superior de una fila. La respuesta devuelve el
        **anterior con su fecha de cierre**, que es lo que permite confirmar de
        un vistazo que se cerró el tramo que se creía cerrar.

        **El equipo se mueve con el reasignado**: sus subordinados conservan su
        superior y solo cambia de quién depende la rama.

        Repetir la operación con el mismo superior no cierra ni abre nada y no
        deja auditoría — pero el motivo se exige igual, antes de saberlo.
      operationId: asignarSuperior
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignSupervisorRequest"
        required: true
      responses:
        "200":
          description: "La estructura, con el superior nuevo y el anterior."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommercialStructureResponse"
        "400":
          description: "Identificador malformado, o motivo ausente o vacío (`VAL-001`,\
            \ `VAL-008`)"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: Autenticado sin `users:assign-supervisor` (`AUTH-002`)
        "404":
          description: Alguna de las dos personas no existe o está eliminada (`VAL-002`)
        "409":
          description: "El actor es el propio subordinado (`RN-SP-017`), el subordinado\
            \ no pertenece a la fuerza comercial (`VAL-003`) o es la cúspide (`VAL-004`),\
            \ el superior no porta el rol que exige el orden de mando (`RN-SP-020`)\
            \ —el mensaje dice cuál—, no está activo (`VAL-006`), o sería su propio\
            \ superior (`VAL-007`)"
        "500":
          description: Fallo no controlado (`ERR-500`)
  /api/v1/users/{id}/status:
    patch:
      tags:
      - Usuarios
      summary: Retirar o devolver el acceso de una persona
      description: |
        Subrecurso propio y no un campo de la edición: el estado tiene reglas de
        rechazo que la edición no tiene y exige un motivo que la edición no
        admite.

        **Se envía el estado destino y no una acción**, lo que hace la operación
        idempotente por construcción. Pedir el estado que ya se tiene no cambia
        nada y no deja evento.

        **Salvo en un caso, y es el que da sentido al requerimiento:** pasar de
        bloqueo **automático** a bloqueo **manual** sí es un cambio aunque el
        estado sea el mismo — `lockedUntil` pasa de informado a nulo, y con ello
        el bloqueo deja de levantarse solo.

        **El motivo es condicional en los dos sentidos:** obligatorio al retirar
        el acceso, **rechazado** al devolverlo.

        **`PENDIENTE` no se admite**, aunque el esquema lo acepte: ningún
        requerimiento lo produce y sería el único camino hacia un estado del que
        nadie sabe salir.

        **Reactivar nunca falla por regla.** Devolver el acceso no puede dejar a
        nadie sin administración ni a ningún equipo huérfano.

        Retirar el acceso **revoca todas las sesiones** de la persona.
      operationId: cambiarEstado
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeUserStatusRequest"
        required: true
      responses:
        "200":
          description: El estado resultante. `lockedUntil` nulo con BLOQUEADO significa
            manual.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserStatusResponse"
        "400":
          description: "Estado ausente, fuera del dominio o `PENDIENTE` (`VAL-001`);\
            \ motivo ausente al retirar (`VAL-005`) o presente al devolver (`VAL-006`)"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: "Autenticado sin `users:update` (`AUTH-002`), o es la cuenta\
            \ del propio actor (`RN-SP-017`) — dos casos distintos con `error_code`\
            \ distinto"
        "404":
          description: "No existe, o está eliminada (`EX-005`)"
        "409":
          description: "Es el último superadministrador activo (`RN-SP-001`), o tiene\
            \ personas a cargo (`RN-SP-022`) — este último dice **cuántas**, nunca\
            \ quiénes"
        "500":
          description: Fallo no controlado (`ERR-500`)
  /api/v1/users/me:
    get:
      tags:
      - Usuarios
      summary: Consultar el propio perfil
      description: |
        Devuelve el perfil de **quien porta el token**, con sus **permisos
        efectivos**.

        Su `contact` lleva **dos teléfonos** —`phone`, el personal, y
        `companyPhone`, el de la empresa, este último **opcional** y por tanto
        presente y en nulo cuando no se declaró— junto a la dirección. Es lo que
        permite precargar el formulario de `PATCH /api/v1/users/me` sin
        reescribir nada de memoria.

        `me` es un **literal**, no un identificador: no se admite pedir el
        propio detalle por la ruta con identificador, que es otra operación y
        exige permiso de lectura de usuarios.

        **Sin parámetros de ningún tipo** — ni de ruta, ni de consulta, ni de
        cuerpo.

        Los permisos salen del **mismo componente que autoriza**, de modo que lo
        que esta pantalla dice que la persona puede hacer es exactamente lo que
        el sistema le dejará hacer. Es lo que permite a una interfaz decidir qué
        mostrar sin duplicar en el navegador una regla que vive en el servidor.

        **No exige permiso alguno**, solo estar autenticado: no hay recurso
        ajeno que proteger.

        Devuelve **solo el superior comercial, nunca el equipo**: a quién
        reporta uno es un dato del actor; quiénes dependen de uno es un conjunto
        de terceros.

        Trae además el `country`, el `document` y el `contact` del actor.
        **`country` nunca falta y `document` sí puede faltar**: las personas
        registradas antes de que el documento fuera obligatorio no lo tienen, y
        el campo llega ausente. El navegador tiene que contemplarlo.

        **El `contact` se publica aquí para que la pantalla de edición pueda
        precargarse**: es exactamente lo que `PATCH /api/v1/users/me` deja
        corregir. El `document` viaja en la misma respuesta y **no** es
        editable por el titular — esa diferencia es la razón de que los dos
        vayan en objetos separados en lugar de como campos sueltos.

        `lastLoginAt` es un dato **informativo de la sesión en curso**, no una
        señal de intrusión: el inicio de sesión sobrescribe ese valor al entrar.
      operationId: miPerfil
      responses:
        "200":
          description: El perfil.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OwnProfileResponse"
        "401":
          description: "Sin credencial válida, o la cuenta fue eliminada tras emitirse\
            \ el token (`AUTH-001`) — lo que dejó de valer es la sesión, no la ruta,\
            \ y por eso no es `404`"
        "500":
          description: Fallo no controlado (`ERR-500`)
    patch:
      tags:
      - Usuarios
      summary: Editar el propio perfil
      description: |
        Corrige el **propio** nombre, apellidos, correo y **datos de contacto**
        —los **dos teléfonos**, dirección, complemento y ciudad—. Autenticado y **sin
        ningún permiso**: `RF-SP-027` hace el mismo cambio pero exige
        `users:update`, que es un permiso de administración, de modo que
        concedérselo a alguien para que arregle su propio apellido le daría de
        paso la capacidad de editar el de cualquiera.

        `me` es un **literal**, no un identificador, y el cuerpo **no admite
        ninguno**: la operación no se puede desviar hacia otra persona.

        **`currentPassword` es obligatorio si y solo si se envía `email`.**
        Desde `RF-SP-040` el correo es la vía por la que se recupera una
        contraseña olvidada, así que cambiarlo es cambiar **quién puede
        recuperar la cuenta**. Una sesión robada no lleva la contraseña, y
        exigirla convierte el robo de sesión en algo que **caduca** en lugar de
        en una apropiación permanente. Cambiar solo el nombre no la pide,
        porque equivocar un apellido no abre ninguna puerta.

        **Enviar el correo que ya se tiene sigue exigiendo la contraseña.** Que
        el valor no cambie se sabe después de mirarlo, y condicionar la
        exigencia a eso daría una forma de averiguar el correo vigente probando
        valores.

        ## Qué se puede cambiar aquí y qué no

        **El contacto sí; la identidad no.** El tipo y el número de documento y
        el país **no están en este cuerpo**: son identidad, no contacto, y los
        corrige un administrador por `PATCH /api/v1/users/{id}`. Enviarlos
        devuelve `400` por propiedad desconocida, no se ignoran.

        La línea no es técnica: un teléfono nuevo o una mudanza son hechos que
        la persona conoce mejor que nadie y no deberían costar un ticket; el
        documento es con lo que figura en la auditoría, y el país decide qué
        medios de pago se le ofrecen.

        **Ningún teléfono exige `currentPassword`**, al contrario que el correo.
        La contraseña se pide cuando el campo **es una vía de acceso**, y el
        teléfono hoy no lo es. El día que exista verificación por SMS o segundo
        factor telefónico, esta decisión se revisa.

        **El nulo explícito no significa lo mismo en todo el cuerpo.**
        `addressLine1`, `addressLine2`, `city` y `companyPhone` **lo aceptan y vacían**
        —«ya no vivo ahí» es un hecho que hay que poder registrar—; el nombre,
        los apellidos, el correo y el **teléfono personal** lo rechazan con `400`.

        **`companyPhone` cae del lado que vacía aunque sea un teléfono**, y ahí
        está toda la diferencia: lo que decide no es qué dato es, sino si
        `RN-SP-037` lo exige. «Ya no tengo teléfono de empresa» es un hecho que
        hay que poder registrar.

        Devuelve el perfil ya actualizado, con **la misma forma** que
        `GET /api/v1/users/me`.
      operationId: editarMiPerfil
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOwnProfileRequest"
        required: true
      responses:
        "200":
          description: El perfil actualizado.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OwnProfileResponse"
        "400":
          description: "Ningún campo informado (`VAL-001`), campo vaciado (`VAL-002`),\
            \ correo inválido (`VAL-003`), longitud excedida (`VAL-005`), falta la\
            \ contraseña actual habiendo correo (`VAL-006`) o campo desconocido"
        "401":
          description: "Sin credencial válida, o la cuenta fue eliminada tras emitirse\
            \ el token"
        "403":
          description: "Hay un cambio obligatorio de contraseña pendiente: se atiende\
            \ primero. Esta ruta **no** figura entre las alcanzables con esa marca"
        "409":
          description: Ese correo ya está en uso por otra persona (`RN-SP-016`)
        "422":
          description: La contraseña actual no es correcta (`VAL-007`)
        "500":
          description: Fallo no controlado (`ERR-500`)
  /api/v1/user-commission-rates/{id}:
    patch:
      tags:
      - Comisiones
      summary: Corregir una tasa personalizada
      description: |
        Corrige el **porcentaje** y el **fin de vigencia**. Se aplica lo que llega
        y se deja intacto lo que no.

        **Corregir no es cambiar**, y aquí la distinción sigue viva: corregir
        arregla un error y reescribe lo que esa tasa dice que rigió; cambiar lo que
        gana alguien a partir de una fecha es **cerrar la vigente y registrar
        otra**.

        `validTo: null` **vacía** el fin de vigencia y la tasa vuelve a regir
        indefinidamente; `percentage: null` se **rechaza**.

        **La persona y el inicio de vigencia no se corrigen**, y enviarlos devuelve
        `400`.
      operationId: corregir
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserCommissionRateRequest"
        required: true
      responses:
        "200":
          description: Tasa corregida
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserCommissionRateResponse"
        "400":
          description: Datos inválidos o campos no corregibles
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserCommissionRateResponse"
        "403":
          description: Sin permiso
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserCommissionRateResponse"
        "404":
          description: "No existe, o está retirada"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserCommissionRateResponse"
        "409":
          description: La vigencia resultante se solapa
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserCommissionRateResponse"
  /api/v1/roles/{id}:
    get:
      tags:
      - Roles
      summary: Consultar el detalle de un rol
      description: |
        Devuelve el alcance exacto de un rol: **la lista completa de los
        permisos que declara**, su rol padre, **cuántos** roles cuelgan de él y
        **cuántas** personas lo tienen asignado.

        **Los permisos son los declarados, sin recorrer la cadena de
        ancestros** (`RN-SEG-004`): el modelo no usa herencia, y esa decisión
        existe precisamente para que esta pregunta se responda leyendo una sola
        lista. Van completos y sin paginar, ordenados por código.

        **`childRoleCount` es un número, nunca una lista**: el listado de hijos
        se obtiene con `GET /api/v1/roles?parentRoleId={id}`, que ya está
        paginado. Así el tamaño de la respuesta no depende de cuántos hijos
        tenga el rol.

        **`assignedUserCount` cuenta personas distintas**, en cualquier estado
        —incluidas las inactivas y las bloqueadas— y **excluyendo las
        eliminadas**: alguien bloqueado sigue portando el rol, y su existencia
        es lo que impide borrarlo. Cero es un dato, no una ausencia. **No exige
        `users:read`**: es un agregado sin identidad, y quien quiera saber
        quiénes son usa `GET /api/v1/users?roleId={id}`.

        Un rol **eliminado devuelve el mismo `404`** que uno inexistente, sin
        ninguna pista de que existió.
      operationId: detalle_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Detalle del rol.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleDetailResponse"
        "400":
          description: El identificador no es un UUID en forma canónica (`VAL-001`)
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: Autenticado sin `roles:read` (`AUTH-002`)
        "404":
          description: "No existe el rol, o está eliminado lógicamente (`EX-001`)"
        "500":
          description: Fallo no controlado (`ERR-500`)
    patch:
      tags:
      - Roles
      summary: Editar un rol
      description: |
        Modifica el **nombre** y la **descripción**. Nada más: el código es
        estable por diseño —cambiarlo rompería cualquier referencia externa— y
        la clasificación es **inmutable**, porque determina si el rol puede
        llevar membresía y cambiarla dejaría membresías colgando de un rol que
        ya no es consumidor. Los permisos, el estado y el rol padre tienen cada
        uno su operación.

        Al menos uno de los dos campos debe venir informado. `description`
        admite `null` explícito —borrarla es una orden legítima—; `name` no,
        porque un rol sin nombre no existe.

        **Reenviar los valores actuales no es un error ni registra evento**: si
        nada cambió, no hay nada que auditar.

        **Un rol de sistema devuelve `409` y un rol que usted tiene asignado,
        `403`**. Lo segundo impide ampliar el alcance del rol con el que se
        está entrando; alcanza solo a los roles asignados **directamente**, de
        modo que un ancestro del propio sí puede editarse.
      operationId: editar_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleRequest"
        required: true
      responses:
        "200":
          description: Rol actualizado.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "400":
          description: "Ningún campo informado (`VAL-001`), nombre vacío (`VAL-002`)\
            \ o longitud excedida (`VAL-004`)"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "403":
          description: "Sin `roles:update` (`AUTH-002`), o el rol está asignado al\
            \ propio actor (`RN-SEG-011`)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "404":
          description: El rol no existe o está eliminado (`EX-004`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "409":
          description: Rol de sistema (`RN-SEG-012`) o nombre ya en uso (`RN-SEG-001`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "500":
          description: Fallo no controlado (`ERR-500`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
  /api/v1/roles/{id}/status:
    patch:
      tags:
      - Roles
      summary: Activar o desactivar un rol
      description: |
        **Desactivar no es retirar.** Las asignaciones a personas se conservan
        intactas; lo que cambia es que el rol **deja de conceder permisos de
        inmediato**, sin esperar a que ningún token expire.

        Se pide el **estado destino** —`ACTIVO` o `INACTIVO`— y no una acción,
        de modo que repetir la petición deja el mismo resultado y no registra
        evento.

        **El rol raíz no admite esta operación**, aparte de la prohibición
        general sobre los roles de sistema: un rol raíz inactivo no concede
        nada, y eso dejaría al sistema sin su última vía de administración.

        El cuerpo no admite motivo: el Art. V.13 lo exige solo en las
        eliminaciones.
      operationId: cambiarEstado_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeRoleStatusRequest"
        required: true
      responses:
        "200":
          description: Rol con su estado actualizado.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "400":
          description: Estado ausente o fuera del dominio (`VAL-001`)
        "401":
          description: Token ausente o inválido (`AUTH-001`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "403":
          description: "Sin `roles:update`, o el rol está asignado al propio actor\
            \ (`RN-SEG-011`)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "404":
          description: El rol no existe o está eliminado (`EX-003`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "409":
          description: Rol de sistema (`RN-SEG-012`) o rol raíz (`RN-SEG-007`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "500":
          description: Fallo no controlado (`ERR-500`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
  /api/v1/roles/{id}/parent:
    patch:
      tags:
      - Roles
      summary: Cambiar el rol padre
      description: |
        Reubica el rol bajo otro padre y **revalida la contención contra el
        nuevo** (`RN-SEG-013`): si el rol declara permisos que el nuevo padre
        no posee, la operación se rechaza **entera** enumerándolos, para que
        usted decida cuáles retirar. **Nunca se recorta nada en silencio.**

        **Los hijos acompañan al rol** y no hay que revisarlos: si este cabe en
        el nuevo padre, ellos caben en este por transitividad.

        El nuevo padre debe existir y estar **activo**, y no puede ser el
        propio rol ni uno de sus descendientes —eso formaría un ciclo—. Su
        clasificación es indiferente: un rol comercial puede colgar de uno
        funcionario, porque el padre acota privilegios, no clasifica.

        **El rol raíz no admite padre** y ningún rol puede quedarse sin él:
        `RN-SEG-007` exige exactamente una cima.
      operationId: cambiarPadre
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeRoleParentRequest"
        required: true
      responses:
        "200":
          description: Rol con su nuevo rol padre.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "400":
          description: Rol padre ausente o mal formado (`VAL-001`)
        "401":
          description: Token ausente o inválido (`AUTH-001`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "403":
          description: "Sin `roles:update`, o el rol está asignado al propio actor\
            \ (`RN-SEG-011`)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "404":
          description: El rol no existe o está eliminado (`EX-006`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "409":
          description: "Rol de sistema (`RN-SEG-012`), rol raíz (`RN-SEG-007`), ciclo\
            \ en la jerarquía (`RN-SEG-006`) o permisos que el nuevo padre no concede\
            \ (`RN-SEG-013`)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "422":
          description: El rol padre indicado no existe o no está activo (`EX-004`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "500":
          description: Fallo no controlado (`ERR-500`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
  /api/v1/products/{id}:
    get:
      tags:
      - Productos
      summary: Consultar el detalle de un producto
      description: |
        Devuelve el producto con su membresía destino y su moneda **resueltas**,
        sin exigir una segunda consulta.

        Trae **los dos precios** —`price`, el que se cobra, y `publicPrice`,
        el que se anuncia y llega **nulo y presente** si no se declara— y
        **`exchange`**, la conversión a la moneda por omisión con la tasa
        vigente hoy, calculada sobre el importe **que se muestra**. La
        conversión llega **presente y nula** cuando el producto ya está en esa
        moneda o cuando nadie declaró una tasa (`RN-PM-024`, 08-09-2026).

        **Un producto retirado se devuelve marcado como tal**, no como
        inexistente: `deletedAt` dice desde cuándo y `deletionReason` **por
        qué**. Los dos campos **solo aparecen si el producto está retirado** —
        su ausencia significa que sigue vivo—. El motivo llega con
        `products:read` y **sin exigir permiso de auditoría**; es la
        contrapartida asumida de que el detalle lo devuelva.

        **No devuelve autoría en ninguna forma**: ni quién lo creó, ni quién lo
        corrigió, ni quién lo retiró. Eso vive en la auditoría y tiene su
        propio permiso.

        `targetMembership` y `validityDays` viajan **presentes en nulo** cuando
        no aplican: un bot no tiene destino y un producto puede no
        caducar, y un campo ausente es indistinguible de uno que el cliente no
        conoce.

        El **nivel** del destino es el **actual**, no el que tenía cuando se
        creó el producto: la cadena de membresías se reordena al insertar un
        eslabón.

        Un identificador con forma laxa se rechaza como **dato inválido**
        (`400`), no como recurso no encontrado.
      operationId: detalle_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: "El producto, con su destino y su moneda resueltos."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductDetailResponse"
        "400":
          description: Identificador sin forma canónica (`VAL-001`)
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: Autenticado sin el permiso `products:read` (`AUTH-002`)
        "404":
          description: No existe un producto con ese identificador (`EX-001`)
        "500":
          description: Fallo no controlado (`ERR-500`)
    patch:
      tags:
      - Productos
      summary: Corregir un producto
      description: |
        Corrige el **nombre**, la **descripción**, el **icono**, **los dos
        precios**, la **moneda**, la **vigencia**, el **alcance** y la
        **implementación**. Se aplica lo que llega y se deja intacto lo que
        no.

        **Distingue el campo ausente del enviado vacío**, y de ahí salen dos
        comportamientos opuestos: `description: null`, `icon: null`,
        `validityDays: null` y `publicPrice: null` **vacían** el campo,
        mientras que `name: null` y `price: null` se **rechazan**, porque un
        producto sin nombre o sin precio del sistema no puede existir.

        **Vaciar `publicPrice` NO es ponerlo a cero**: con nulo el producto
        vuelve a anunciarse con el precio del sistema, y con cero se anuncia
        gratis. Son dos estados distintos y los dos se alcanzan desde aquí.

        **`scope: null` e `implementation: null` también se rechazan**, y ahí
        van con el nombre y no con la descripción: son obligatorios en la
        columna, de modo que «bórralo» no tiene ningún estado al que llevar el
        producto. Devuelven `400` con `VAL-007` y `VAL-008`.

        **El alcance y la implementación SÍ se corrigen, aunque el tipo y las
        membresías no**: ninguna de las dos define qué derecho otorga el
        producto —una dice hasta dónde se muestra y la otra quién lo aplica—,
        de modo que corregirlas no reescribe lo que compró quien lo compró.

        **El icono sí se corrige, aunque el tipo no**: es el aspecto del
        producto y no lo que otorga. En un `BOT`, cualquier valor distinto de
        nulo se rechaza con `VAL-013` (`RN-PM-016`).

        **El tipo, el código y la membresía destino NO se pueden corregir**, y
        enviarlos devuelve `400` con `VAL-006`. Se rechazan y no se ignoran:
        ignorarlos haría creer que el cambio se aplicó. Definen qué derecho
        otorga el producto, y cambiarlos convertiría lo comprado en otra cosa.

        **Los DOS importes se validan contra la moneda que va a quedar**, y no
        solo el que llega en la petición: cambiar **solo** la moneda puede
        dejar sin caber a un precio que nadie tocó, y el rechazo **nombra el
        campo** que no cabe. Y el importe **no se convierte**: el sistema no
        hace conversión de divisa — cambiar de moneda es declarar que ese
        número siempre estuvo en la otra.

        **Un producto retirado no se corrige**: lo que se retiró debe quedar
        como estaba para que lo que lo referencie siga diciendo la verdad.

        **No se exige motivo**, ni siquiera al cambiar el precio. Una petición
        que no cambia nada devuelve `200` y **no registra evento**.
      operationId: corregir_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductRequest"
        required: true
      responses:
        "200":
          description: "El producto, ya corregido."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductDetailResponse"
        "400":
          description: "Identificador sin forma canónica (`VAL-001`), nombre vací\
            o o ningún campo informado (`VAL-002`), longitud excedida (`VAL-003`),\
            \ precio negativo o precio del sistema vaciado (`VAL-004`), decimales\
            \ que la moneda no admite (`VAL-005`), campos inmutables en la petició\
            n (`VAL-006`) o vigencia no positiva (`VAL-011`)"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: Autenticado sin el permiso `products:update` (`AUTH-002`)
        "404":
          description: No existe un producto vivo con ese identificador (`EX-001`)
        "409":
          description: El nombre ya lo tiene otro producto vivo (`EX-002`)
        "422":
          description: La moneda no existe o está desactivada (`EX-003`)
        "500":
          description: Fallo no controlado (`ERR-500`)
  /api/v1/products/{id}/status:
    patch:
      tags:
      - Productos
      summary: Publicar o retirar de la oferta un producto
      description: |
        Cambia el estado del producto entre `ACTIVO` e `INACTIVO`. **Es un
        recurso propio y no un campo de la edición**: publicar y corregir son
        decisiones distintas, y mezclarlas haría que una corrección de texto
        pudiera poner algo a la venta.

        **Pedir el estado que el producto ya tiene devuelve `200` sin cambiar
        nada y sin registrar evento.** No es un error: quien pulsa dos veces el
        mismo botón no ha hecho nada malo.

        **No se publica un producto sin descripción** (`RN-PM-014`). Sí se
        permite **desactivarlo** sin ella: la regla acota lo que se ofrece, no
        lo que se retira.

        **Solo puede haber un upgrade activo hacia cada membresía destino**
        (`RN-PM-004`). Al activar uno cuyo destino ya está ocupado, el rechazo
        **nombra el producto que lo ocupa**, para que se sepa cuál desactivar.
        Desactivar no comprueba nada: liberar un destino nunca produce
        conflicto.

        **Un producto retirado no vuelve a la venta por aquí**: responde que no
        existe.

        No se exige motivo para activar ni para desactivar.
      operationId: cambiarEstado_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeProductStatusRequest"
        required: true
      responses:
        "200":
          description: "El producto, con su estado ya aplicado."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductDetailResponse"
        "400":
          description: "Identificador sin forma canónica (`VAL-001`), estado ausente\
            \ o fuera de su dominio (`VAL-002`), o activación de un producto sin descripció\
            n (`VAL-003`)"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: Autenticado sin el permiso `products:update` (`AUTH-002`)
        "404":
          description: No existe un producto vivo con ese identificador (`EX-001`)
        "409":
          description: Ya hay otro upgrade activo hacia esa membresía destino (`EX-002`)
        "500":
          description: Fallo no controlado (`ERR-500`)
  /api/v1/currencies/{id}/status:
    patch:
      tags:
      - Monedas
      summary: Activar o desactivar una moneda
      description: |
        Cambia el estado de una moneda del catálogo. Es lo **único** que la API
        puede modificar de una moneda.

        Se envía el estado destino, no una acción: pedir dos veces lo mismo deja
        el mismo estado y **no** registra un segundo evento.

        La moneda por defecto **no puede desactivarse**: los importes del sistema
        quedarían sin referencia válida. Cambiar cuál es la moneda por defecto es
        una operación de migración, no de API.

        El cuerpo no admite ningún otro campo ni motivo alguno.
      operationId: cambiarEstado_3
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeCurrencyStatusRequest"
        required: true
      responses:
        "200":
          description: "Estado aplicado. Devuelve la moneda completa, con su definició\
            n sin cambios."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CurrencyResponse"
        "400":
          description: "Identificador o cuerpo inválidos, o campo no admitido (`VAL-001`)"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: Autenticado sin el permiso de modificación de monedas (`AUTH-002`)
        "404":
          description: No existe moneda con ese identificador (`EX-002`)
        "409":
          description: Se intenta desactivar la moneda por defecto (`RN-SP-010`)
        "500":
          description: Fallo no controlado (`ERR-500`)
  /api/v1/countries/{id}/status:
    patch:
      tags:
      - Países
      summary: Activar o desactivar un país
      description: |
        Cambia el estado de un país. Es lo **único** que la API puede modificar
        de un país.

        Se envía el estado destino, no una acción: pedir dos veces lo mismo deja
        el mismo estado y **no** registra un segundo evento.

        **Desactivar no es corregir**: el código y el nombre permanecen, y los
        datos que ya los referencian siguen resolviéndolos. Evita que el error se
        propague desde ese momento, no lo repara.

        El cuerpo no admite ningún otro campo ni motivo alguno.
      operationId: cambiarEstado_4
      parameters:
