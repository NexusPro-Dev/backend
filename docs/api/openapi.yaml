  /api/v1/commission-rates/{id}:
    patch:
      tags:
      - Comisiones
      summary: Corregir el valor de una tasa de rol
      description: |
        Corrige el **valor** —la forma y la cifra—, que es lo único corregible.

        **Esta operación borra el pasado.** Las tasas de rol no tienen vigencia:
        pasar un `AGENTE` de 10 a 12 **borra el 10**. No hay dos filas contando
        cada una su parte; hay una que ahora dice otra cosa.

        Lo único que preserva lo ya pagado es que la liquidación haya copiado el
        porcentaje que aplicó — y esa liquidación **todavía no existe**.

        `rateType: null` se **rechaza**. **Ni el rol ni el producto se corrigen**:
        enviar `roleId` devuelve `400` con `VAL-009`, y `productId` es un campo
        desconocido que también responde `400`. Se rechazan y no se ignoran,
        porque ignorarlos haría creer que el cambio se aplicó.

        **El tope se revisa contra su producto** (`RN-CM-019`): si el nuevo valor
        dejaría al producto pagando más del 100 % de sí mismo entre sus tasas de
        rol, la corrección se rechaza con `409`. **Un producto GRATUITO solo
        admite importe fijo** (`RN-CM-020`): corregir a porcentaje una tasa de un
        producto de precio cero se rechaza con `409` (`EX-008`). Y un importe
        fijo tiene que **caber en los decimales de la moneda del producto**
        (`VAL-013`).
      operationId: corregir_3
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCommissionRateRequest"
        required: true
      responses:
        "200":
          description: Tasa corregida
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommissionRateResponse"
        "400":
          description: Datos inválidos o campos no corregibles
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommissionRateResponse"
        "403":
          description: Sin permiso
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommissionRateResponse"
        "404":
          description: "No existe, o está retirada"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommissionRateResponse"
        "409":
          description: "El nuevo valor dejaría al producto pagando más de cien (`EX-006`),\
            \ o dejaría de porcentaje la tasa de un producto gratuito (`EX-008`)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommissionRateResponse"
  /api/v1/users/{id}/team:
    get:
      tags:
      - Usuarios
      summary: Consultar el superior y el equipo a cargo
      description: |
        Devuelve el superior inmediato y el **equipo directo** de la persona,
        paginado.

        **Un solo nivel, nunca el árbol descendente**, y **sin conteo
        indirecto**: `totalElements` cuenta a quienes reportan directamente.
        Devolver la rama completa publicaría de una vez la estructura de la
        empresa por un permiso de lectura de usuarios.

        **Cada persona lleva `roles`: TODOS los que porta**, con `id`, `code`
        y `name`, ordenados por código y **presentes aunque la lista vaya
        vacía**. Es el mismo objeto que devuelve `GET /api/v1/users` en cada
        fila. **Sustituye a `roleCode`** (10-09-2026), que traía uno solo y
        únicamente si era de la fuerza comercial: la cartera de clientes
        llegaba con el rol en nulo y era indistinguible de un vendedor sin rol.

        **`roles` es además el único filtro**, y acota **el equipo**. Se pasan
        **códigos**, varios admitidos —`?roles=AGENTE,CLIENTE` o repitiendo el
        parámetro—, y entra quien porte **alguno** de ellos. `totalElements`
        **cuenta lo filtrado**. Un código que no existe devuelve el equipo
        vacío con `200`, **no un error**: es el mismo criterio que el filtro
        por rol de `GET /api/v1/users`.

        **El filtro NO toca al superior ni a la persona consultada.** Los dos
        se devuelven igual aunque no porten ninguno de los roles pedidos, y eso
        es contrato: `supervisor` va **ausente**, no en nulo, **solo** cuando
        la persona es la cúspide comercial, que es lo que distingue «no depende
        de nadie» de «no se pudo resolver».

        **Ningún otro filtro.** Ni búsqueda por nombre, ni estado, ni país: el
        listado general de usuarios ya los tiene, y replicarlos aquí obligaría
        a mantener dos semánticas sincronizadas.

        **Sin historial de superiores.**

        Quien no pertenece a la fuerza comercial recibe `200` con la estructura
        vacía, no `404` ni `409` — **con sus roles a la vista**: no tener
        estructura comercial no es no tener roles.

        **El alcance es global** mientras la decisión D-22 siga abierta: quien
        posea el permiso ve el equipo de cualquiera, no solo el suyo.
      operationId: equipo
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: roles
        in: query
        description: "Códigos de rol que acotan el equipo. Varios admitidos, con semá\
          ntica O."
        required: false
        schema:
          type: array
          items:
            type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: "La estructura, con el equipo paginado y los roles de cada\
            \ persona. El filtro por roles acota el equipo y su total, nunca al superior."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommercialStructureResponse"
        "400":
          description: Identificador malformado o paginación fuera de límites (`VAL-003`)
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: Autenticado sin `users:read` (`AUTH-002`)
        "404":
          description: La persona no existe o está eliminada (`VAL-002`)
        "500":
          description: Fallo no controlado (`ERR-500`)
  /api/v1/users/{id}/broker-accounts:
    get:
      tags:
      - Usuarios
      summary: Consultar las cuentas de broker de una persona
      description: |
        Devuelve las cuentas de broker de esa persona: **broker, identificador
        de cuenta, nombre de usuario en el broker y estado**, ordenadas por
        nombre de broker e identificador de cuenta.

        **Quién puede consultarlas** (`RN-SP-046`): **su superior comercial
        vigente**, sin ningún permiso, o quien traiga **`broker-accounts:read`**
        sobre cualquiera. Es la primera lectura del sistema cuyo alcance sale
        de la estructura comercial, y **solo alcanza a esta**.

        **Quien no es ninguna de las dos cosas recibe `404`, no `403`**, y es
        deliberado: el mismo `404` que si la persona no existiera. Un `403`
        dejaría a cualquier vendedor recorrer identificadores y averiguar
        cuáles corresponden a personas reales. Los dos cuerpos son idénticos.

        **Quien FUE su superior y ya no lo es recibe `404`**: el historial de
        la estructura no concede lectura.

        **El titular NO ve aquí sus propias cuentas** salvo que traiga el
        permiso: esta lectura se definió sobre el equipo.

        **Una persona sin cuentas devuelve `200` con la colección vacía**, no
        `404`: solo el registro por un enlace de beca obliga a declararlas.

        **Hoy el estado es siempre `REGISTER`**, y no es un fallo: quien mueve
        una cuenta a `FIRST_DEPOSIT` es el webhook del broker, que todavía no
        existe.

        **`brokerUsername` llega en nulo** mientras el broker no lo haya
        confirmado, y el campo **está presente**: su nulo significa «aún no
        confirmado», no «sin nombre».

        **No se pagina**: una persona tiene unas pocas cuentas. El listado
        paginado es `GET /api/v1/users/me/team/broker-accounts`.
      operationId: cuentasDeBrokerDe
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: "Las cuentas de la persona, ordenadas. Vacía si no declaró\
            \ ninguna."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BrokerAccountsResponse"
        "400":
          description: Identificador malformado (`VAL-001`)
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "404":
          description: "La persona no existe, está eliminada, **o el actor no es su\
            \ superior vigente ni posee `broker-accounts:read`** (`VAL-002`). Los\
            \ tres casos responden lo mismo, a propósito."
        "500":
          description: Fallo no controlado (`ERR-500`)
  /api/v1/users/me/team/broker-accounts:
    get:
      tags:
      - Usuarios
      summary: Consultar las cuentas de broker de mi equipo
      description: |
        Devuelve, **paginadas**, las cuentas de broker de todas las personas
        que dependen **directamente** del actor, **cada fila con su titular**.

        **No hay identificador en la ruta y no lo habrá**: el conjunto de datos
        lo determina el sistema a partir de quién pregunta. Quien deba ver las
        cuentas de otra persona usa `GET /api/v1/users/{id}/broker-accounts`
        con `broker-accounts:read`.

        **No exige ningún permiso**, solo estar autenticado: el alcance lo pone
        la estructura comercial (`RN-SP-046`). Quien **no tiene equipo** recibe
        `200` con la página vacía, no `404` ni `403`.

        **Un solo nivel**, el equipo directo. Las cuentas de quien depende de
        un subordinado del actor **no aparecen**: devolver la rama completa
        publicaría de una vez la estructura de la empresa.

        **Es un listado de CUENTAS y no de personas.** Quien está en el equipo
        y no declaró ninguna cuenta **no aparece**, y quien declaró dos aparece
        **dos veces**. Quién hay en el equipo lo responde
        `GET /api/v1/users/{id}/team`.

        **Filtros, ambos opcionales y combinables con Y:**

        - `status` — `REGISTER` o `FIRST_DEPOSIT`. **Cualquier otro valor es
          `400`**, no una página vacía: una página vacía sería indistinguible
          de «nadie está en ese estado».
        - `brokerId` — un broker del catálogo. **Un identificador inexistente
          devuelve la página vacía sin error**, al revés que `status`: es una
          pregunta legítima con respuesta vacía.

        `totalElements` **cuenta lo filtrado**.

        **Hoy todas las cuentas están en `REGISTER`**, y no es un fallo de esta
        consulta: quien mueve una cuenta a `FIRST_DEPOSIT` es el webhook del
        broker, que todavía no existe. Mientras no exista, ninguna cuenta tiene
        depósito confirmado.

        **`brokerUsername` llega en nulo** mientras el broker no lo haya
        confirmado, y el campo **está presente**: su nulo significa «aún no
        confirmado», no «sin nombre».
      operationId: cuentasDeBrokerDelEquipo
      parameters:
      - name: status
        in: query
        description: "Estado de la cuenta: `REGISTER` o `FIRST_DEPOSIT`."
        required: false
        schema:
          type: string
      - name: brokerId
        in: query
        description: Broker del catálogo. Uno inexistente devuelve la página vacía.
        required: false
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: "Página de cuentas del equipo directo, ordenada por titular,\
            \ broker e identificador de cuenta. Vacía si el actor no tiene equipo."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseTeamBrokerAccountItem"
        "400":
          description: "`status` fuera de `REGISTER`/`FIRST_DEPOSIT` (`VAL-001`),\
            \ `brokerId` malformado o paginación fuera de límites (`VAL-003`)"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "500":
          description: Fallo no controlado (`ERR-500`)
  /api/v1/products/{id}/comments/mine:
    get:
      tags:
      - Reseñas
      summary: Consultar la reseña propia sobre un producto
      description: |
        Devuelve **la** reseña viva de quien llama sobre el producto, con su identificador —
        que es lo que la corrección y el retiro reciben en la ruta—. **No admite parámetro
        de persona**: responde sobre quien llama y sobre nadie más.

        **El `404` no dice nada del producto**: responde igual si quien llama no ha
        reseñado, si retiró la suya o si el producto no existe. Y **sí responde** sobre un
        producto inactivo o retirado cuando la reseña existe: el autor tiene que poder
        llegar a la suya para corregirla o retirarla (`RN-PM-028`).
      operationId: mine
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: La reseña de quien llama.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductCommentResponse"
        "400":
          description: Identificador mal formado (`VAL-001`)
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: Autenticado sin el permiso `products:comment` (`AUTH-002`)
        "404":
          description: Quien llama no tiene reseña viva sobre este producto (`EX-001`)
  /api/v1/products/hotlinks:
    get:
      tags:
      - Productos
      summary: Consultar el catálogo de hotlinks
      description: |
        **Lo que un vendedor puede repartir**: los productos **activos y de
        alcance `HOTLINK` o `AMBOS`**, de los dos tipos, en `upgrades` y `services`
        — exactamente el conjunto que `GET /api/v1/hotlinks/{username}/{code}`
        resuelve enlace a enlace (`RN-PM-021`), visto entero y con token.

        **No mira la membresía de quien llama**, y ahí se aparta de la oferta
        (`GET /api/v1/products/available`): el vendedor no compra lo que
        reparte, de modo que un `BECA → ORO` le interesa aunque él esté en
        `ORO`. Por eso la respuesta no trae `currentMembership`. Cada producto
        va en la forma de venta —`price`, `exchange`, `videoUrl`,
        `coverImageUrl`, `rating`— y **sin `purchasePrice`** (`RN-PM-024`).

        **No trae el enlace armado.** El cliente lo compone con el `username`
        de `GET /api/v1/users/me` y el `code` de cada producto:
        `/api/v1/hotlinks/{username}/{code}`. Que ese enlace resuelva exige
        además que quien lo reparte sea fuerza comercial (`RN-PM-022`); esta
        lista dice qué se publica, no quién puede publicarlo. **Sin
        parámetros y sin paginar**: es el catálogo publicable, entero. Los
        paquetes llegarán a esta misma respuesta con `RF-PM-026`.
      operationId: catalogoDeHotlinks
      responses:
        "200":
          description: "El catálogo de hotlinks: upgrades y bots publicables."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/HotlinkCatalogResponse"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: Autenticado sin el permiso `products:hotlink` (`AUTH-002`)
        "500":
          description: Fallo no controlado (`ERR-500`)
  /api/v1/products/available:
    get:
      tags:
      - Productos
      summary: Consultar la oferta disponible para uno mismo
      description: |
        Devuelve lo que **quien llama** puede comprar hoy, y no el catálogo.

        **No admite ningún parámetro**: ni de persona, ni de filtro, ni de
        paginación. El actor sale del token, de modo que no hay forma de
        preguntar qué puede comprar otra persona.

        **Exige `products:sale`**, un permiso propio de esta vista y no
        `products:read` — ese abre el catálogo administrativo entero, lo
        inactivo, lo retirado y el motivo del retiro, para que alguien pudiera
        ver tres líneas.

        **Solo lo activo.** Ni lo inactivo ni lo retirado aparecen aquí,
        aunque el catálogo de `RF-PM-002` sí los muestre a quien administra.

        **Upgrades: los declarados DESDE la membresía vigente de quien mira**,
        y ninguno más. La coincidencia es exacta: no se comparan niveles ni se
        recorre la cadena. Quien registró el producto ya decidió a quién va
        dirigido.

        Eso incluye **todos** los declarados desde ahí y no solo el inmediato
        —quien está en el peldaño más bajo elige cuánto saltar, y el precio de
        cada uno ya expresa el salto—, y llegan ordenados **del salto más
        corto al más largo**.

        **La RENOVACIÓN entra aquí**, y va primera: un producto `X → X`
        declarado desde su propia membresía es el salto de longitud cero. Lo
        que vende es **tiempo** —su `validityDays`— y no un cambio de nivel.

        **Un upgrade hacia el nivel que ya se tiene NO se ofrece cuando su
        origen no es el suyo**: sería el salto de otra persona que acaba donde
        quien mira ya está. Y **ninguna bajada** llega hasta aquí, aunque este
        filtro ya no la mire: lo impide `RN-PM-017` **al registrar**, porque un
        producto declarado desde mi membresía no puede apuntar por debajo.

        **Bots: todos los activos, para cualquiera.** No dependen del nivel de
        quien mira ni de que tenga uno.

        **Cada producto trae `videoUrl`**, la dirección del video que lo
        presenta, tal cual se guardó y **presente y nula** cuando no tiene
        (`RN-PM-032`). Es lo contrario del precio de compra: material de
        venta, que existe para que lo vea quien compra, y por eso **sí** viaja
        por aquí.

        **Publica `scope` e `implementation` de cada producto, y filtra por el
        primero**: solo `TIENDA` y `AMBOS` (`RN-PM-019`, desde el 15-09-2026).
        Un producto `HOTLINK` o `NINGUNO` no es de la tienda y no aparece
        aquí aunque esté activo y sea de la membresía de quien llama. La
        implementación viaja para que quien compra sepa **antes de pagar** si
        lo que se lleva se le entrega en el acto.

        **Quien no tiene membresía vigente —incluida la vencida— no ve ningún
        upgrade**, y sí todos los bots. No hay nivel desde el que subir, y
        ofrecerle el primero sería venderle una membresía, que no es lo que un
        upgrade hace.

        **Quien está en la cima recibe la lista de upgrades vacía.** No es un
        error ni un mensaje especial: es una lista vacía.

        **El precio es igual para todos**: un importe distinto según quién
        mira sería un descuento, y los descuentos son promociones, que están
        fuera de alcance.

        **Viene UN importe** (`RN-PM-024`, reescrita el 12-09-2026): `price`,
        el que la venta cobra. **El precio de compra no viaja por aquí**: es
        lo que NEXUS paga por el producto, y quien compra no tiene por qué
        conocer el margen. Entre el 08-09-2026 y el 12-09-2026 esta respuesta
        traía también `publicPrice`, cuando ese importe era lo que se
        anunciaba; ese campo **ya no existe**.

        Y viene **`exchange`**, la conversión de `price` a la moneda por
        omisión con la tasa vigente hoy. **Presente y nula** cuando no hay
        nada que convertir.

        **Quien construya la pantalla de compra tiene que saberlo**: el
        importe que confirma la venta es `price`, el mismo que se enseña.

        **Y `packages`**: los paquetes que hoy se pueden ofrecer a quien mira,
        con su cuenta hecha y cada producto en la forma de esta misma oferta.
        Un paquete aparece si está activo, vivo, con descripción y dos productos
        al menos, todos activos y vivos, **dentro de su vigencia** —`validFrom` y
        `validTo` viajan, el fin nulo cuando es indefinido; uno que empieza mañana
        o terminó ayer **no aparece**, y nada lo dice (`RN-PM-047`)— y si su
        upgrade, cuando lo tiene, sale de la membresía de quien mira.

        Las colecciones viajan **envueltas en un objeto** y no como
        arreglos en la raíz: hoy la oferta no se pagina, y así el día que
        haya que paginarla no romperá a ningún cliente.
      operationId: oferta
      responses:
        "200":
          description: "La oferta del actor, con el nivel desde el que mira."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OfferResponse"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "403":
          description: Autenticado sin el permiso `products:sale` (`AUTH-002`)
        "500":
          description: Fallo no controlado (`ERR-500`)
  /api/v1/product-images/{imageId}:
    get:
      tags:
      - Productos
      summary: "Obtener la imagen de una portada, sin autenticación"
      description: |
        Devuelve **los bytes** de la imagen de portada de un producto, con el
        `Content-Type` real —el detectado al subirla— y **sin token**: la
        dirección la dan las cuatro lecturas del producto en `coverImageUrl`,
        y una de ellas —el hotlink— es pública, de modo que un `<img>` tiene
        que poder pintarla sin credencial. Con token responde lo mismo.

        **La dirección señala una imagen concreta y no «la portada de un
        producto»**: cada subida estrena identificador y la reemplazada se
        borra, de modo que una dirección **nunca cambia de contenido** — o
        sirve siempre la misma imagen, o responde `404`. Por eso se sirve con
        `Cache-Control: public, max-age=31536000, immutable`: el navegador la
        guarda un año y no vuelve a preguntar, y una portada nueva es otra
        dirección.

        **No mira el producto**: sirve la imagen aunque el producto esté
        inactivo, retirado o sea de alcance `TIENDA` (`requirements/pm.md`
        §5.2.9). El identificador no se lista en ningún sitio sin token para
        lo que no se publica. `404` con el mismo cuerpo para un identificador
        inexistente, reemplazado o quitado. Solo `JPEG`, `PNG` y `WebP`, con
        `X-Content-Type-Options: nosniff`.
      operationId: imagen
      parameters:
      - name: imageId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: "Los bytes de la imagen, con su tipo real y caché inmutable\
            \ de un año."
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "400":
          description: Identificador sin forma canónica (`VAL-001`)
          content:
            application/problem+json: {}
        "404":
          description: "La imagen no existe — nunca existió, se reemplazó o se quitó\
            \ (`EX-001`)"
          content:
            application/problem+json: {}
        "429":
          description: Demasiadas peticiones desde ese origen
          content:
            application/problem+json: {}
        "500":
          description: Fallo no controlado (`ERR-500`)
          content:
            application/problem+json: {}
      security: []
  /api/v1/product-commission-rates:
    get:
      tags:
      - Comisiones
      summary: "Consultar qué comisiona un producto, y a qué rol"
      description: |
        Devuelve una entrada **por cada rol** que cobra comisión por ese producto,
        con el valor ya resuelto: las tasas de rol **vivas** de ese producto
        (`RN-CM-021`). Es lo mismo que `GET /api/v1/commission-rates?productId=`,
        sin paginar y con la forma de siempre.

        **Una lista vacía significa que ese producto no paga comisión a nadie**
        — nadie registró una tasa sobre él (`RN-CM-012`).

        **Esto no resuelve la comisión de una persona, y solo devuelve roles.** Las
        tasas personalizadas también se asocian a productos desde el 11-09-2026 y
        ganan sobre estas, pero **no aparecen aquí**: qué personas tienen excepción
        en este producto lo responde `GET /api/v1/user-commission-rates?productId=`,
        paginado y con su historial. Para saber qué cobra alguien concreto, use
        `GET /api/v1/commissions/effective`.
      operationId: porProducto
      parameters:
      - name: productId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Las asociaciones del producto
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductAssociationResponse"
        "400":
          description: Parámetros inválidos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductAssociationResponse"
        "403":
          description: Sin permiso
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductAssociationResponse"
  /api/v1/permissions:
    get:
      tags:
      - Permisos
      summary: Consultar el catálogo de permisos
      description: |
        Devuelve el catálogo completo, sin paginar, ordenado por recurso y acción.

        Los tres filtros son opcionales y ninguno se valida: un valor que no
        corresponda a ningún permiso produce una colección vacía, no un error.
        Los parámetros de paginación no se admiten y se ignoran.
      operationId: list_1
      parameters:
      - name: request
        in: query
        description: Filtro por recurso. Coincidencia exacta.
        required: true
        schema:
          $ref: "#/components/schemas/ListPermissionsRequest"
      responses:
        "200":
          description: Catálogo devuelto. La colección puede venir vacía.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PermissionCatalogResponse"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PermissionCatalogResponse"
        "403":
          description: Autenticado sin el permiso `permissions:read` (`AUTH-002`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PermissionCatalogResponse"
        "500":
          description: Fallo no controlado (`ERR-500`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PermissionCatalogResponse"
  /api/v1/permissions/{id}:
    get:
      tags:
      - Permisos
      summary: Consultar el detalle de un permiso
      description: |
        Devuelve qué habilita un permiso concreto: código, recurso, acción,
        nombre y descripción. Es la consulta de apoyo a la asignación de
        permisos a un rol, y se llega a ella desde el catálogo.

        **Se accede solo por identificador, nunca por código**: admitir dos
        formas de direccionar el mismo recurso obliga a distinguir en cada
        petición cuál llegó. El código es la vía para *encontrar* el permiso, y
        para eso está el filtro del catálogo.

        **No devuelve los roles que lo declaran** —es el recorrido inverso y
        corresponde a una consulta propia— ni marcas temporales: en una tabla
        que solo cambia por migración, esas fechas dicen cuándo se desplegó una
        migración y no cuándo ocurrió algo de negocio.

        `description` puede venir vacía, y entonces se devuelve como `null`,
        nunca omitida.
      operationId: detail
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Detalle del permiso.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PermissionResponse"
        "400":
          description: El identificador no es un UUID en forma canónica (`VAL-001`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PermissionResponse"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PermissionResponse"
        "403":
          description: Autenticado sin el permiso `permissions:read` (`AUTH-002`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PermissionResponse"
        "404":
          description: No existe un permiso con ese identificador (`EX-001`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PermissionResponse"
        "500":
          description: Fallo no controlado (`ERR-500`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PermissionResponse"
  /api/v1/payment-methods:
    get:
      tags:
      - Métodos de pago
      summary: Consultar los métodos de pago
      description: |
        Devuelve los métodos de pago **activos y de visibilidad `PUBLICO`**, sin
        paginar y ordenados por código.

        **Es una consulta PÚBLICA** (`RN-MV-024`): responde **sin token**, porque
        el formulario de registro por enlace elige con qué se paga antes de que
        exista la cuenta. **Con sesión devuelve exactamente lo mismo** — no hay
        un catálogo para el anónimo y otro para quien ha entrado, y no existe
        parámetro que cambie lo que sale.

        **Lo que NO devuelve, y no hay forma de pedirlo**: ni los métodos
        desactivados —un método retirado no se puede usar en una venta nueva— ni
        los de visibilidad `INTERNO` (`RN-MV-023`). Estos últimos **sirven para
        pagar y no los elige ninguna persona**: los pone el sistema. Es el caso
        de `GRATIS`, con el que se anotan las ventas de importe cero
        (`RN-MV-022`): quien depure una de esas verá un `paymentMethodId` que
        **este catálogo no resuelve**, y eso es deliberado.

        **La respuesta no publica el campo de visibilidad.** Si todo lo que sale
        es `PUBLICO`, declararlo sugeriría que puede salir otra cosa.

        **`excludedCountries` dice dónde NO vale cada medio.** Una lista vacía
        significa que vale en todos los países, y el campo **viaja siempre**:
        no hay que distinguir «sin exclusiones» de «no vino el campo».

        **Esta restricción es informativa y el servidor NO la aplica.** Registrar
        una venta con un método excluido en algún país **se registra con
        normalidad**: quien decide qué ofrecer es el cliente que consume esta
        respuesta. El servidor no sabe de qué país es quien compra — ninguna
        persona del sistema tiene país todavía.

        **No admite parámetros**, y en particular no admite un país: filtrar aquí
        haría creer que el servidor sabe cuál corresponde.

        **Está acotada por origen** —120 peticiones por minuto, con cubo propio—,
        como los demás catálogos públicos: superar la cota responde `429`.
      operationId: consultar_2
      responses:
        "200":
          description: El catálogo de métodos de pago activos y públicos. Se responde
            igual con token y sin él.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PaymentMethodCatalogResponse"
        "429":
          description: Se superó la cota de peticiones por origen (120 por minuto).
            La cabecera `Retry-After` dice cuánto esperar.
  /api/v1/movements/mine:
    get:
      tags:
      - Movimientos
      summary: Consultar los movimientos propios
      description: |
        Devuelve **los movimientos en los que usted participó**, paginados y del más
        reciente al más antiguo.

        **«Propio» son DOS papeles.** Un movimiento lleva a su sujeto —`user`, a nombre de
        quién es— y a los vendedores de sus líneas —`sellers`—, y usted puede ser cualquiera
        de los dos — o **los dos a la vez**, si compró algo que se le atribuye, que es lo
        que ocurre siempre que compra quien no cuelga de nadie. Cada movimiento dice en qué
        papel aparece usted con `role`: `BUYER`, `SELLER` o `BOTH`. El que es las dos
        cosas **aparece una sola vez**.

        **No hay forma de preguntar por otra persona**, ni indicándola ni teniendo
        permisos: quien pregunta sale de la credencial. Consultar las ventas de terceros es
        otra operación, con su permiso.

        **Las líneas no viajan aquí.** Una venta puede llevar varias, y meterlas
        multiplicaría la respuesta por un dato que solo se mira al abrir uno: están en el
        detalle.

        **`sellers` es una lista, sin repetir y nunca nula**: el vendedor es de cada línea y
        una venta podría llevar varios. Hoy lleva uno. Va **vacía** en los movimientos que
        no tienen vendedor, que no es el caso de ninguna venta.

        El orden es fijo y no se puede cambiar. `status` filtra por estado.
      operationId: mios
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: status
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: La página de movimientos propios.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseMyMovement"
        "400":
          description: Paginación inválida (`VAL-002`) o estado no admitido (`VAL-003`)
        "401":
          description: Token ausente o inválido (`AUTH-001`)
        "500":
          description: Fallo no controlado (`ERR-500`)
  /api/v1/movements/mine/{id}:
    get:
      tags:
      - Movimientos
