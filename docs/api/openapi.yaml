      description: |
        **Permiso requerido:** `courses:read`. Sin él, `403` (`AUTH-002`).

        El curso entero: lo suyo, el instructor resuelto, `coverImageUrl`, sus
        **categorías** vivas, los **cursos que recomienda** —con su estado y si se
