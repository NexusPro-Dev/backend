        "400":
          description: "Datos inválidos, juntos (`VAL-001` a `VAL-005`), o un campo\
            \ no admitido (`VAL-006`)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CourseModuleDetailResponse"
        "401":
          description: Token ausente o inválido (`AUTH-001`)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CourseModuleDetailResponse"
