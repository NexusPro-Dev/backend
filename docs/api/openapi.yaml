          type: string
          description: "PENDIENTE, ENTREGADA o RETENIDA. Al comprar, siempre PENDIENTE."
        deliveredAt:
          type:
          - string
          - "null"
          format: date-time
          description: Desde cuándo se tiene lo comprado. NULO si no está ENTREGADA.
        deliveryNote:
          type:
          - string
          - "null"
          description: Por qué se retuvo. NULO si no está RETENIDA.
