          type: integer
          format: int32
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: type
        in: query
        required: false
        schema:
          type: string
      - name: typeStatus
        in: query
        required: false
        schema:
          type: string
      - name: userId
