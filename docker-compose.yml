# Entorno local completo (Art. X.2).
#
#   docker compose up -d db     solo la base de datos, para `mvn spring-boot:run`
#   docker compose up           todo, con la aplicación en contenedor
#
# Los valores de este archivo son de desarrollo y no deben usarse en ningún
# otro entorno.

services:

  db:
    image: postgres:17-alpine
    container_name: nexus-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
    ports:
      - "5432:5432"
    volumes:
      - nexus-db-data:/var/lib/postgresql/data
    healthcheck:
      # La aplicación no debe arrancar antes de que PostgreSQL acepte
      # conexiones: Flyway corre al inicio y fallaría.
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      DATABASE_URL: jdbc:postgresql://db:5432/nexus
      DATABASE_USER: nexus
      DATABASE_PASSWORD: nexus
      API_URL: http://localhost:8080
      # El cierre de comisiones y su pago (RF-CM-009, RF-CM-028, RF-CM-029): la
      # zona del negocio, el interruptor y el cron de seis campos. Por defecto,
      # mensual a las 00:00:00 del día 1 en Bogotá. Cambiarlos solo pide
      # reiniciar el contenedor; el frontend lee el próximo cierre de
      # GET /api/v1/commission-closings/next.
      BUSINESS_ZONE: ${BUSINESS_ZONE:-America/Bogota}
      COMMISSION_CLOSING_ENABLED: ${COMMISSION_CLOSING_ENABLED:-true}
      COMMISSION_CLOSING_CRON: "${COMMISSION_CLOSING_CRON:-0 0 0 1 * *}"
      # Orígenes del navegador autorizados (CORS). Estos son los puertos
      # habituales de un frontend en desarrollo —Vite, Next/CRA, Angular— y
      # valen SOLO para local: en cualquier entorno desplegado la lista es el
      # dominio real y llega por variable de entorno, nunca desde este archivo.
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:3000,http://localhost:4200"
      LOG_LEVEL: INFO
      # Secreto de desarrollo. En cualquier otro entorno llega por variable
      # de entorno y nunca desde un archivo versionado (Art. IV.3).
      JWT_SECRET: desarrollo-no-usar-fuera-de-local
      # Llave del segundo factor (security.md §3.3). La de local no vale fuera.
      MFA_ENCRYPTION_KEY: ZGVzYXJyb2xsby1uby11c2FyLWZ1ZXJhLWRlLWxvYyE=
      # Swagger y el contrato OpenAPI, accesibles sin autenticar. Solo local.
      EXPOSE_API_DOCS: "true"
      # Credencial inicial del superadministrador (V22). Local y solo local:
      # en cualquier otro entorno llega por el gestor de secretos.
      #
      # SIN `:?` a proposito. El fallo rapido que exige el Art. IX.5 ya lo hace
      # la aplicacion: `application.yml` declara la variable sin valor por
      # defecto y el contenedor muere al arrancar con un error de Spring.
      # Ponerlo aqui tumbaba el archivo ENTERO —Compose interpola antes de
      # elegir servicio—, de modo que `docker compose up -d db` y hasta
      # `docker compose ps` fallaban sin que nada estuviera mal.
      #
      # El hash lleva los `$` DUPLICADOS en el `.env`. Ver `.env.example`.
      #
      # El correo sale del `.env` como todo lo demas. Tenerlo fijo aqui hacia
      # que `SUPERADMIN_EMAIL` estuviera declarada en el `.env` y NO SE USARA:
      # se ponia un correo y la base sembraba otro, sin que nada avisara.
      #
      # OJO: `V22` ya corrio en las bases existentes y Flyway no repite las
      # migraciones aplicadas, de modo que cambiar esto NO actualiza el correo
      # de un superadministrador ya sembrado. Para eso hay que recrear el
      # volumen de la base o cambiarlo por la API.
      SUPERADMIN_EMAIL: "${SUPERADMIN_EMAIL}"
      SUPERADMIN_PASSWORD_HASH: ${SUPERADMIN_PASSWORD_HASH}

      # Canal de envio saliente (RF-SP-040, D-23). Los valores viven en `.env`,
      # que NO se versiona: aqui solo se interpolan. Sin ellos el adaptador
      # queda APAGADO y lo avisa al arrancar, en lugar de fallar la primera vez
      # que alguien olvide su contrasena.
      #
      # SIN `:?`, por lo mismo que el hash de arriba: Compose interpola el
      # archivo ENTERO antes de elegir servicio, y un `:?` aqui tumbaria hasta
      # `docker compose ps`. El fallo rapido ya lo da la aplicacion.
      NOTIFICATION_ENABLED: ${NOTIFICATION_ENABLED}
      RESEND_API_KEY: ${RESEND_API_KEY}
      NOTIFICATION_FROM: ${NOTIFICATION_FROM}
      NOTIFICATION_TEMPLATE_PASSWORD_RECOVERY: ${NOTIFICATION_TEMPLATE_PASSWORD_RECOVERY}
      # Duración de los videos de academia (RN-AC-017). Opcionales: sin la de
      # un proveedor, sus lecciones exigen la duración a mano.
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      VIMEO_ACCESS_TOKEN: ${VIMEO_ACCESS_TOKEN:-}
      # Las clases en vivo por Zoom (RN-AC-026). Opcionales: sin ellas,
      # programar, iniciar y entrar a una clase responden 503.
      ZOOM_ACCOUNT_ID: ${ZOOM_ACCOUNT_ID:-}
      ZOOM_CLIENT_ID: ${ZOOM_CLIENT_ID:-}
      ZOOM_CLIENT_SECRET: ${ZOOM_CLIENT_SECRET:-}
      ZOOM_HOST_USER: ${ZOOM_HOST_USER:-me}
      # La pasarela de la tarjeta (RF-MV-040). Opcionales: sin las dos, la
      # tarjeta nace pendiente y la confirma una persona.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # Los avisos de los brokers (RF-SP-078, deployment.md §6.5.3). Un secreto por
      # broker; sin el suyo, la ruta de ese broker responde 503.
      BROKER_TOKEN_IQOPTION: ${BROKER_TOKEN_IQOPTION:-}
      BROKER_TOKEN_EXNOVA: ${BROKER_TOKEN_EXNOVA:-}
      BROKER_TOKEN_EXOPTION: ${BROKER_TOKEN_EXOPTION:-}
      # La pasarela local, PayRetailers (RF-MV-048, deployment.md §6.5.2). La tienda
      # de cada país va en su conversión. Opcionales: sin las dos, PSE nace pendiente
      # y lo confirma una persona.
      PAYRETAILERS_SUBSCRIPTION_KEY: ${PAYRETAILERS_SUBSCRIPTION_KEY:-}
      PAYRETAILERS_ENCRYPTION_KEY: ${PAYRETAILERS_ENCRYPTION_KEY:-}
      PAYRETAILERS_BASE_URL: ${PAYRETAILERS_BASE_URL:-https://api-sandbox.payretailers.com/payments/v2}
      PAYRETAILERS_NOTIFICATION_URL: ${PAYRETAILERS_NOTIFICATION_URL:-}
      PAYRETAILERS_RETURN_URL: ${PAYRETAILERS_RETURN_URL:-}
      PAYRETAILERS_TEST_MODE: ${PAYRETAILERS_TEST_MODE:-false}
      # El barrido de los cobros pendientes. Para probar en local, cada minuto y sin espera:
      # PAYRETAILERS_RECONCILE_CRON="0 * * * * *" y PAYRETAILERS_RECONCILE_AFTER=PT1M.
      PAYRETAILERS_RECONCILE_CRON: ${PAYRETAILERS_RECONCILE_CRON:-0 */5 * * * *}
      PAYRETAILERS_RECONCILE_AFTER: ${PAYRETAILERS_RECONCILE_AFTER:-PT10M}
    ports:
      - "8080:8080"
    healthcheck:
      # DISPONIBILIDAD, no vida (issue #31). `/readiness` responde «puedo
      # atender» y es lo que decide si al contenedor se le manda tráfico;
      # `/actuator/health` a secas mezclaba esa pregunta con «¿arrancó?», que
      # es la que responde `/liveness` y la que Docker no usa aquí.
      #
      # Sigue siendo público (Art. XV.10) y la imagen alpine trae el `wget` de
      # busybox, de modo que no hace falta añadir nada.
      #
      # `start_period` sigue holgado, y ahora por un motivo más pequeño: en el
      # primer arranque Flyway aplica las migraciones antes de que el puerto
      # responda, y hasta que responde no hay sonda que valga.
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 60s

  # Reenvía a la aplicación las notificaciones de Stripe (RF-MV-041), que en
  # local no tienen a dónde llegar: sin esto, una compra con tarjeta se cobra en
  # Stripe y se queda PENDIENTE aquí para siempre (02-10-2026). Es lo mismo que
  # correr `stripe listen` a mano, pero no depende de una terminal abierta.
  #
  # Usa la MISMA clave que la aplicación, y el `whsec_` que firma lo que reenvía
  # es el que imprime `stripe listen --print-secret` con esa clave: ese es el
  # que va en STRIPE_WEBHOOK_SECRET del `.env`. Sin clave no hace nada —se
  # queda dormido y lo dice en su log—, para no tumbar `docker compose up` a
  # quien no usa la tarjeta.
  #
  # SOLO LOCAL. En un entorno desplegado el endpoint se registra en el panel
  # de Stripe (deployment.md §6.5.1) y este servicio no existe.
  stripe:
    image: stripe/stripe-cli:v1.53.0
    container_name: nexus-stripe
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        if [ -z "$$STRIPE_API_KEY" ]; then
        echo "Sin STRIPE_SECRET_KEY: no se reenvian notificaciones de Stripe.";
        exec sleep 2147483647;
        fi;
        exec stripe listen
        --forward-to http://app:8080/api/v1/movements/gateway-notifications/stripe
        --events payment_intent.succeeded,payment_intent.payment_failed,payment_intent.canceled,charge.refunded,charge.dispute.created,charge.dispute.closed

  adminer:
    image: adminer
    container_name: backend-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: darkly
      ADMINER_USER: nexus
      ADMINER_PASSWORD: nexus

volumes:
  nexus-db-data:
