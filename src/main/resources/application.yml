# Configuración base. Todo lo que depende del entorno llega por variable de
# entorno (Art. IX.1) y no tiene valor por defecto cuando es obligatorio:
# la aplicación debe fallar al arrancar si falta, no asumir algo inseguro
# (Art. IX.5). Por eso ${VAR} sin valor tras los dos puntos.

spring:
  application:
    name: nexus-backend

  lifecycle:
    # Cuánto se espera a las peticiones en curso durante un apagado ordenado
    # (`server.shutdown`). Treinta segundos sobran para cualquier operación de
    # este sistema —los umbrales del Art. XV.9 son de menos de un segundo— y
    # quedan por debajo del plazo con el que una plataforma de despliegue mata
    # el proceso a la fuerza.
    timeout-per-shutdown-phase: 30s

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}

  jpa:
    hibernate:
      # Las migraciones son la fuente de verdad del esquema (Art. V.3).
      # `validate` y nunca `update` ni `create`: Hibernate comprueba que el
      # esquema coincide con el mapeo, y no lo modifica jamás.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Sin `baseline-on-migrate`: una base de datos con tablas y sin historial
    # de Flyway es un estado que debe fallar, no que deba asumirse.
    validate-on-migrate: true

    # Credencial inicial del superadministrador (`V22__seed_superadmin.sql`).
    #
    # Entra por marcador de posición y no como literal en la migración: un hash
    # escrito en el repositorio es una credencial en el repositorio (RNF-SEG-003).
    # Sin valor por omisión a propósito — un despliegue que no la declare debe
    # FALLAR AL ARRANCAR, no arrancar con una credencial conocida (Art. IX.5).
    placeholders:
      superadmin_email: ${SUPERADMIN_EMAIL}
      superadmin_password_hash: ${SUPERADMIN_PASSWORD_HASH}

  jackson:
    # Un campo desconocido en el cuerpo se rechaza, no se ignora. Varios
    # criterios de aceptación dependen de ello: sin esto, enviar un campo que
    # el endpoint no admite pasaría en silencio y el criterio no comprobaría
    # nada (por ejemplo CA-SP-151 y CA-SP-159).
    deserialization:
      fail-on-unknown-properties: true
    default-property-inclusion: non_null

server:
  # EL PUERTO LO ELIGE QUIEN EJECUTA, no este archivo (Art. IX.1). La plataforma
  # de despliegue lo anuncia en `PORT`; en local no hay quien lo anuncie y valen
  # los 8080 de siempre, que son los que declara el `Dockerfile` y los que espera
  # el `docker-compose.yml`.
  #
  # El literal que había aquí obligaba a fijar `PORT=8080` a mano en Railway para
  # que el borde encaminara al puerto correcto, y el día que no coincidieran el
  # síntoma sería una sonda de salud en rojo sobre un arranque IMPECABLE en los
  # logs — es decir, el puerto es lo último que uno mira. Ver `deployment.md` §7.1.
  port: ${PORT:8080}

  # RELEVAR UNA VERSIÓN POR OTRA DEJA DOS PROCESOS VIVOS, y al viejo se le manda
  # parar con peticiones en curso (`deployment.md` §7.3). Sin esto las corta en
  # seco: quien estaba escribiendo recibe una conexión caída y no un error, que
  # es indistinguible de que el sistema esté roto.
  #
  # Con esto deja de aceptar nuevas y termina las que tiene, hasta el plazo de
  # `spring.lifecycle.timeout-per-shutdown-phase`.
  shutdown: graceful

  error:
    # El detalle interno no sale al cliente (Art. VI.5). El formato de error
    # es RFC 9457, producido por el manejador global.
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        # `health` es público por el Art. XV.10; `metrics` NO lo es y no hace
        # falta declararlo en ningún sitio para que deje de serlo: la cadena de
        # seguridad deniega por defecto todo lo que no figure entre las rutas
        # públicas, de modo que exponerlo aquí solo lo hace alcanzable para
        # quien ya se autenticó.
        #
        # Qué falta para que sirva de verdad: un raspador no porta un JWT. El
        # permiso propio —o la red de administración que lo aísle— llega con la
        # infraestructura de despliegue (D-09). Hasta entonces las métricas se
        # consultan a mano, que es infinitamente mejor que no tenerlas.
        include: health,metrics
  endpoint:
    health:
      # Ni versiones, ni URLs de base de datos, ni nombres de componentes: el
      # detalle de salud es un mapa del sistema para quien lo sondea sin
      # credenciales (Art. VI.5).
      show-details: never

      # DOS PREGUNTAS DISTINTAS, DOS SONDAS (issue #31). `/actuator/health`
      # respondía a la vez «¿arrancó?» y «¿puede atender?», y no son lo mismo:
      # en el primer arranque Flyway aplica las migraciones y la aplicación
      # está VIVA sin poder recibir tráfico. Con una sola sonda, el orquestador
      # que pregunta lo primero interpreta lo segundo y reinicia un proceso
      # perfectamente sano — y el `start_period` holgado del compose es el
      # parche que hoy lo tapa.
      #
      # `liveness`  -> ¿hay que reiniciarlo? Solo dice que no vive si el
      #               proceso está roto sin remedio.
      # `readiness` -> ¿le mando tráfico? Es la que mira las dependencias.
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

nexus:
  # El entorno de esta instancia (Art. IX.4): development | testing | production.
  #
  # SIN VALOR POR DEFECTO, y el vacío de aquí NO es uno: `RuntimeEnvironment` lo
  # rechaza y TUMBA EL ARRANQUE nombrando los tres admitidos. El vacío existe
  # solo para que el mensaje de error sea el suyo y no el genérico de un
  # marcador sin resolver.
  #
  # De esta variable depende que NO se siembren datos de prueba, de modo que
  # asumir un valor sería exactamente lo que el Art. IX.5 prohíbe.
  environment: ${ENVIRONMENT:}

  # Semilla de datos de prueba (`db/dev-seed/`). NO se aplica en `production`, y
  # eso lo decide el entorno y no este interruptor: ponerlo en `true` allí no
  # siembra nada.
  #
  # Existe por lo mismo que `token-purge.enabled` y `rate-limit.enabled`: LA
  # SUITE LO APAGA. Sus pruebas corren como `testing` y cuentan personas y
  # roles; quince cuentas apareciendo solas harían fallar decenas de ellas por
  # algo que no tiene que ver con lo que comprueban.
  dev-seed:
    enabled: ${DEV_SEED_ENABLED:true}

  # Uniforme para todo el sistema, no por endpoint (architecture.md §7.4).
  # Una petición que exceda el máximo se rechaza, no se recorta.
  pagination:
    default-size: 20
    max-size: 100
    # Hasta dónde cuenta un listado sobre una tabla que crece sin purga —los
    # cuatro registros de auditoría—. Por encima del techo la respuesta dice
    # «hay más de esto» con `totalIsExact` en falso, en lugar de recorrer la
    # tabla entera en cada página. Es configuración y no constante: subirlo
    # recupera el total exacto siempre; quitarlo devuelve el recorrido completo.
    count-limit: 10000

  audit:
    # Retención del `request_log`. HOY NO LA LEE NADIE, y decirlo aquí evita la
    # peor confusión posible: creer que la purga está activa porque el valor
    # está puesto. La tabla existe desde `V35` (issue #23) y crece sin techo
    # hasta que D-10 fije los días y alguien escriba el proceso que los aplica.
    request-log-retention-days: ${REQUEST_LOG_RETENTION_DAYS:}

  security:
    jwt-secret: ${JWT_SECRET}
    # Documentación de la API accesible sin autenticar. Por defecto NO, que
    # es lo seguro: el contrato describe cada endpoint y cada permiso del
    # sistema. Se habilita de forma explícita donde interese.
    expose-api-docs: ${EXPOSE_API_DOCS:false}

    trusted-proxies: ${TRUSTED_PROXIES:}

    # Purga de sesiones caducadas (issue #25). `refresh_tokens` crece de forma
    # monótona por diseño: `RF-SP-035` rota el token en cada refresco y revocar
    # es marcar, no eliminar, de modo que una sesión de siete días renovando
    # cada quince minutos deja cientos de filas que nadie retira.
    token-purge:
      # Apagable, y la suite lo apaga: con la purga corriendo por su cuenta, una
      # prueba podría encontrarse retiradas las sesiones que acababa de crear.
      enabled: ${TOKEN_PURGE_ENABLED:true}

      # De madrugada y en UTC. Nada de esto urge: lo que se retira lleva días
      # sin autenticar a nadie, y el borrado en bloque toca la tabla que
      # sostiene la autenticación de todo el sistema.
      cron: ${TOKEN_PURGE_CRON:0 30 3 * * *}

      # CUÁNTO SE ESPERA DESPUÉS DE QUE LA FAMILIA ENTERA CADUQUE, y el número
      # no es arbitrario: `RF-SP-035` detecta el robo cuando alguien presenta un
      # token ya rotado, y esa detección vive en las filas revocadas. Purgar
      # demasiado pronto APAGA UNA ALARMA. Treinta días dejan un mes de margen
      # para investigar una sesión que ya no puede autenticar a nadie.
      #
      # El plazo se cuenta desde que TODA la familia dejó de servir —el mayor
      # `expires_at` del grupo—, nunca desde la revocación: una rotación revoca
      # su token a los quince minutos de nacer.
      retention: ${TOKEN_PURGE_RETENTION:P30D}

    # Límite de tasa de los endpoints públicos de autenticación (`security.md`
    # §5.5). NO es el bloqueo por intentos fallidos: aquel cuenta fallos de
    # credencial contra UNA cuenta y la protege; este cuenta PETICIONES, acierten
    # o fallen, y protege al sistema del rociado de contraseñas —que no dispara
    # ningún bloqueo— y de que provocar bloqueos ajenos sea gratis.
    #
    # `capacity` acota cuántas llaves distintas se recuerdan a la vez: la llave
    # la elige quien llama —su IP, el identificador que teclea—, de modo que un
    # mapa sin tope es memoria que el atacante controla.
    rate-limit:
      # Apagable SOLO para pruebas de otros requerimientos, que emiten ráfagas
      # contra el login a propósito. En un entorno real no debería tocarse.
      enabled: ${RATE_LIMIT_ENABLED:true}
      capacity: 20000

      # Quien teclea mal su contraseña reintenta dos o tres veces; diez por
      # minuto desde una misma IP ya es una herramienta. La cota por credencial
      # es más estricta a propósito, y aun así quien ataca una cuenta concreta
      # topa antes con los cinco intentos del bloqueo.
      login:
        por-origen: 10
        por-identidad: 5
        ventana: PT1M

      # Un cliente legítimo refresca cada quince minutos: el margen es enorme a
      # propósito, porque una interfaz con varias pestañas refresca en ráfaga.
      # Lo que se corta es el bucle, que consulta la base en cada llamada.
      refresh:
        por-origen: 60
        ventana: PT1M

      # Cinco por minuto, y quien los supera espera cinco minutos. Decisión del
      # responsable del proyecto, 26-08-2026, sobre la advertencia de que es la
      # única operación pública que provoca un ENVÍO SALIENTE: la cota pasa de
      # tres correos POR HORA a una persona real a unos sesenta.
      #
      # La PENALIZACIÓN es lo que hace que el número siga sirviendo de algo. Sin
      # ella, cinco por minuto son setenta y dos mil correos al día; con ella,
      # superar la cota cuesta una espera fija y el ritmo sostenido baja a cinco
      # cada cinco minutos.
      recovery:
        por-origen: 5
        por-identidad: 5
        ventana: PT1M
        penalizacion: PT5M

      # La confirmación se acota SOLO POR ORIGEN, y no es un descuido: su cuerpo
      # no lleva identidad ninguna —lleva un permiso—, de modo que no hay nada
      # por lo que acotar por credencial. Lo que se corta aquí es probar
      # permisos al azar, y treinta por hora deja margen a quien se equivoca al
      # copiar el código del correo sin dejar sitio a una búsqueda.
      recovery-confirmation:
        por-origen: 30
        ventana: PT1H

    # Orígenes que el navegador puede usar para llamar a esta API, separados
    # por coma y con la forma esquema://host[:puerto]. Cambian por entorno, de
    # modo que llegan por variable y NO se escriben en el código (Art. IX.1).
    # Vacío = ningún origen autorizado, que es lo seguro: un backend consumido
    # de servidor a servidor no necesita CORS. El comodín `*` se rechaza al
    # arrancar. Ver `CorsConfig` y `security.md` §6.1.
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}
      # Cuánto puede el navegador reutilizar la comprobación previa antes de
      # repetirla. Media hora ahorra un viaje por petición sin retrasar de más
      # un cambio de política.
      max-age: ${CORS_MAX_AGE:PT30M}

    # Token de acceso y sesión (security.md §5.2).
    jwt:
      issuer: nexus
      # Quince minutos: corto a propósito, porque el token de acceso NO es
      # revocable — solo expira. Cuanto más vive, más dura un token robado.
      access-token-ttl: PT15M
      refresh-token-ttl: P7D
      # Duración máxima de sesión, medida desde el INICIO y no desde el último
      # refresco: sin ella, quien rota con disciplina no caduca nunca.
      session-max-duration: P30D

    # Bloqueo por intentos fallidos (security.md §3.2).
    lockout:
      max-attempts: 5
      base-delay: PT1M
      # El techo NO es opcional: sin él, alguien mantiene bloqueada la cuenta de
      # otra persona provocando fallos a propósito, que es una denegación de
      # servicio contra su titular.
      max-delay: PT1H

      # Los dos siguientes NO defienden de la fuerza bruta: existen para que el
      # identificador SIN cuenta cuente sus fallos igual que uno real y la
      # respuesta no delate cuáles existen (ver `FailedAttemptLedger`).
      #
      # La ventana se recuerda en memoria y nunca baja del techo del bloqueo.
      # La capacidad la impone que la clave llega de fuera: un mapa sin tope
      # crece hasta donde quiera quien ataca.
      identifier-window: PT1H
      identifier-capacity: 10000

    # Política de contraseña (security.md §3.2).
    password:
      min-length: 12
      # Cuánto vale la credencial que OTRA PERSONA fija (RF-SP-038). Sin plazo,
      # una cuenta restablecida y nunca usada conserva indefinidamente una
      # contraseña que alguien más conoce, y nadie se entera porque no falla nada.
      provisional-ttl: PT48H
      # Cuánto vive el permiso de recuperación (RF-SP-040, security.md §3.2).
      # Treinta minutos: acota la ventana en que un correo interceptado sirve
      # para entrar, sin caducar mientras la persona busca el mensaje en su
      # carpeta de correo no deseado —y cada repetición es otro correo—.
      recovery-ttl: PT30M
      argon2:
        memory-kb: 16384
        iterations: 2
        parallelism: 1

  # Envío saliente (architecture.md §15.1, D-23 cerrada el 26-08-2026 con Resend).
  #
  # La clave llega por variable y NO tiene valor por omisión (Art. IX.1, IX.5).
  # Sin ella el envío queda APAGADO y se avisa al arrancar, en lugar de fallar
  # en silencio la primera vez que alguien olvide su contraseña.
  #
  # El remitente debe pertenecer a un dominio verificado en Resend, o el
  # proveedor rechaza el envío con un 403 que no se descubre hasta producción.
  notification:
    enabled: ${NOTIFICATION_ENABLED:false}
    api-key: ${RESEND_API_KEY:}
    from: ${NOTIFICATION_FROM:}
    base-url: ${RESEND_BASE_URL:https://api.resend.com}
    timeout: PT10S

    # Qué plantilla alojada en Resend le toca a cada mensaje (RF-SP-040).
    #
    # La clave es el código del tipo en `NotificationKind`, y el valor es el id
    # o el alias de una plantilla PUBLICADA. Añadir una plantilla nueva es
    # añadir una línea aquí y su variable; no se toca código.
    #
    # VACÍO POR OMISIÓN, y eso decide el comportamiento: sin plantilla el
    # mensaje sale en texto plano en lugar de no salir. Un entorno al que le
    # falte esta variable manda un correo sin estilos; uno que fallara aquí
    # dejaría fuera a quien esperaba su código.
    templates:
      password-recovery: ${NOTIFICATION_TEMPLATE_PASSWORD_RECOVERY:}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
